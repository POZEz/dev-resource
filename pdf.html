<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editor de Documentos</title>

  <!-- Bibliotecas Base -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
  
  <!-- Exportação e Importação -->
  <script src="https://unpkg.com/html-docx-js/dist/html-docx.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.5.1/mammoth.browser.min.js"></script>

  <!-- Fontes -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Arial&family=Georgia&family=Times+New+Roman&family=Courier+Prime&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            app: { bg: '#18181b', card: '#27272a', border: '#3f3f46', text: '#fafafa', primary: '#2563eb' }
          }
        }
      }
    }
  </script>

  <style>
    body, html { margin: 0; padding: 0; height: 100%; background-color: #18181b; color: #fafafa; overflow: hidden; }
    
    .custom-scroll::-webkit-scrollbar { width: 8px; height: 8px; }
    .custom-scroll::-webkit-scrollbar-track { background: transparent; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 99px; }
    .custom-scroll::-webkit-scrollbar-thumb:hover { background: #52525b; }

    /* =========================================
       ARQUITETURA DE DOCUMENTO (A4)
       ========================================= */
    #workspace-container {
      flex: 1; overflow-y: auto; overflow-x: auto;
      background-color: #09090b; /* Fundo escuro para destacar a página */
      display: flex; flex-direction: column; align-items: center;
      padding: 40px 20px;
    }

    #document-transform {
      transform-origin: top center;
      transition: transform 0.15s ease-out;
    }

    #editor-page {
      width: 794px; /* A4 Width em 96dpi */
      min-height: 1123px; /* A4 Height em 96dpi */
      background-color: #ffffff;
      color: #000000;
      box-shadow: 0 4px 24px rgba(0,0,0,0.5);
      padding: 96px; /* Margem padrão ~2.54cm */
      outline: none;
      font-family: Arial, sans-serif;
      font-size: 11pt;
      line-height: 1.5;
      position: relative;
    }

    /* Linhas indicadoras de quebra de página */
    .page-break-indicator {
      position: absolute; left: 0; right: 0; height: 1px;
      border-top: 1px dashed #cbd5e1; pointer-events: none;
      display: flex; justify-content: center; align-items: center;
    }
    .page-break-indicator::after {
      content: 'Quebra de Página (A4)'; color: #94a3b8; font-size: 10px; background: #fff; padding: 0 10px; font-family: 'Inter', sans-serif;
    }

    /* Estilização interna do Editor */
    #editor-page p { margin-bottom: 1em; }
    #editor-page h1 { font-size: 24pt; font-weight: bold; margin-bottom: 0.5em; }
    #editor-page h2 { font-size: 18pt; font-weight: bold; margin-bottom: 0.5em; }
    #editor-page h3 { font-size: 14pt; font-weight: bold; margin-bottom: 0.5em; }
    
    #editor-page table { border-collapse: collapse; width: 100%; margin-bottom: 1em; table-layout: fixed; }
    #editor-page th, #editor-page td { border: 1px solid #94a3b8; padding: 8px; vertical-align: top; min-width: 50px; }
    #editor-page img { max-width: 100%; height: auto; display: block; margin: 10px 0; cursor: pointer; }
    #editor-page img.inline { display: inline-block; }
    #editor-page img.wrap { float: left; margin: 0 15px 5px 0; }
    
    #editor-page ul { list-style-type: disc; margin-left: 2em; margin-bottom: 1em; }
    #editor-page ol { list-style-type: decimal; margin-left: 2em; margin-bottom: 1em; }
    
    #editor-page a { color: #2563eb; text-decoration: underline; cursor: pointer; }

    /* =========================================
       UI ELEMENTS & RÉGUA
       ========================================= */
    .btn-toolbar { padding: 6px; border-radius: 6px; color: #a1a1aa; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; }
    .btn-toolbar:hover { background-color: #3f3f46; color: #fff; }
    .btn-toolbar.active { background-color: #2563eb; color: #fff; }
    
    .toolbar-divider { width: 1px; height: 20px; background-color: #3f3f46; margin: 0 8px; }

    #ruler-container {
      width: 794px; height: 24px; background: #e2e8f0; margin: 0 auto;
      border-radius: 4px 4px 0 0; position: relative;
      display: flex; align-items: flex-end; overflow: hidden;
      border: 1px solid #cbd5e1; border-bottom: none;
    }
    .ruler-tick { width: 1px; background: #94a3b8; position: absolute; bottom: 0; }
    .ruler-tick.major { height: 12px; }
    .ruler-tick.minor { height: 6px; }
    .ruler-number { position: absolute; bottom: 12px; font-size: 9px; color: #64748b; font-family: monospace; transform: translateX(-50%); }

    /* =========================================
       FLOATING CONTEXT MENU
       ========================================= */
    #context-toolbar {
      position: absolute; background: #27272a; border: 1px solid #3f3f46;
      border-radius: 8px; padding: 4px; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      display: flex; align-items: center; gap: 2px; z-index: 100;
      opacity: 0; pointer-events: none; transition: opacity 0.15s ease;
      transform: translateY(-10px);
    }
    #context-toolbar.visible { opacity: 1; pointer-events: auto; transform: translateY(0); }

    .dropdown { display: none; position: absolute; top: 100%; left: 0; background: #27272a; border: 1px solid #3f3f46; border-radius: 8px; padding: 4px; z-index: 60; box-shadow: 0 10px 25px rgba(0,0,0,0.5); min-width: 150px; margin-top: 4px; }
    .dropdown-trigger:hover .dropdown { display: block; }
    .dropdown-item { padding: 8px 12px; color: #a1a1aa; font-size: 12px; cursor: pointer; border-radius: 4px; display: flex; align-items: center; gap: 8px; }
    .dropdown-item:hover { background: #3f3f46; color: #fff; }

    /* =========================================
       RESIZER DE IMAGENS & QUEBRA DE PÁGINA
       ========================================= */
    #image-resizer {
      position: absolute; border: 2px dashed #2563eb; pointer-events: none; z-index: 50; display: none;
    }
    .resizer-handle {
      position: absolute; width: 12px; height: 12px; background: #2563eb; border: 2px solid #fff; border-radius: 50%; pointer-events: auto;
    }
    .resizer-handle.nw { top: -6px; left: -6px; cursor: nwse-resize; }
    .resizer-handle.ne { top: -6px; right: -6px; cursor: nesw-resize; }
    .resizer-handle.sw { bottom: -6px; left: -6px; cursor: nesw-resize; }
    .resizer-handle.se { bottom: -6px; right: -6px; cursor: nwse-resize; }

    .manual-page-break {
      page-break-before: always; height: 40px; background: #09090b; 
      margin: 40px -96px; border-top: 1px solid #3f3f46; border-bottom: 1px solid #3f3f46; 
      display: flex; align-items: center; justify-content: center; user-select: none;
      box-shadow: inset 0 4px 6px rgba(0,0,0,0.3), inset 0 -4px 6px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body class="text-sm font-sans flex flex-col h-screen">

  <!-- =========================================================
       TELA INICIAL (RECENTES)
       ========================================================= -->
  <div id="start-screen" class="absolute inset-0 z-50 bg-app-bg flex flex-col items-center pt-20 px-6">
    <div class="w-full max-w-4xl">
      <div class="flex items-center justify-between mb-12">
        <div class="flex items-center gap-3">
          <div class="w-12 h-12 bg-blue-600 rounded-xl flex items-center justify-center shadow-lg shadow-blue-600/20">
            <i class="ph-bold ph-file-text text-2xl text-white"></i>
          </div>
          <div>
            <h1 class="text-2xl font-bold text-white">Word Web</h1>
            <p class="text-zinc-400 text-sm">Crie e edite documentos perfeitamente.</p>
          </div>
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
        <button onclick="App.createNewDocument()" class="flex flex-col items-center justify-center p-8 bg-app-card border border-app-border rounded-2xl hover:border-blue-500 hover:bg-zinc-800 transition-all group">
          <i class="ph-duotone ph-file-plus text-5xl text-blue-500 mb-4 group-hover:scale-110 transition-transform"></i>
          <span class="font-semibold text-white">Novo Documento</span>
          <span class="text-xs text-zinc-500 mt-1">Página em branco (A4)</span>
        </button>

        <label class="flex flex-col items-center justify-center p-8 bg-app-card border border-app-border rounded-2xl hover:border-blue-500 hover:bg-zinc-800 transition-all group cursor-pointer">
          <i class="ph-duotone ph-upload-simple text-5xl text-emerald-500 mb-4 group-hover:scale-110 transition-transform"></i>
          <span class="font-semibold text-white">Importar Documento</span>
          <span class="text-xs text-zinc-500 mt-1">.docx, .txt, .html</span>
          <input type="file" accept=".docx,.txt,.html" class="hidden" onchange="App.importDocument(event)">
        </label>
      </div>

      <h2 class="text-sm font-bold text-zinc-400 uppercase tracking-wider mb-4">Documentos Recentes</h2>
      <div id="recent-docs-list" class="bg-app-card border border-app-border rounded-2xl overflow-hidden shadow-xl">
        <!-- Preenchido via JS -->
      </div>
    </div>
  </div>

  <!-- =========================================================
       TELA DO EDITOR
       ========================================================= -->
  <div id="editor-screen" class="hidden flex-col h-full w-full">
    
    <!-- HEADER -->
    <header class="h-14 bg-app-card border-b border-app-border flex items-center justify-between px-4 shrink-0">
      <div class="flex items-center gap-4">
        <button onclick="App.showStartScreen()" class="p-2 text-zinc-400 hover:text-white bg-zinc-800 rounded-lg transition-colors" title="Voltar à tela inicial">
          <i class="ph-bold ph-house text-lg"></i>
        </button>
        <div>
          <input type="text" id="doc-title" value="Documento sem título" class="bg-transparent text-white font-semibold text-sm outline-none px-2 py-1 rounded hover:bg-zinc-800 focus:bg-zinc-800 w-64" onchange="App.saveCurrentDoc()">
          <div class="flex items-center gap-3 px-2 mt-0.5">
            <span id="save-status" class="text-[10px] text-zinc-500 flex items-center gap-1"><i class="ph-fill ph-cloud-check text-emerald-500"></i> Salvo localmente</span>
          </div>
        </div>
      </div>

      <div class="flex items-center gap-3">
        <button onclick="App.Search.toggle()" class="px-3 py-1.5 rounded-lg bg-zinc-800 hover:bg-zinc-700 text-zinc-300 font-medium text-xs flex items-center gap-2">
          <i class="ph-bold ph-magnifying-glass"></i> Buscar
        </button>
        <div class="h-5 w-px bg-app-border"></div>
        <div class="relative dropdown-trigger">
          <button class="px-4 py-1.5 rounded-lg bg-blue-600 hover:bg-blue-500 text-white font-semibold text-xs shadow-lg flex items-center gap-2">
            <i class="ph-bold ph-export"></i> Exportar
          </button>
          <div class="dropdown right-0 left-auto w-40">
            <div class="dropdown-item" onclick="App.Export.toDOCX()"><i class="ph-bold ph-file-doc text-blue-400"></i> Microsoft Word (.docx)</div>
            <div class="dropdown-item" onclick="App.Export.toPDF()"><i class="ph-bold ph-file-pdf text-red-400"></i> Arquivo PDF (.pdf)</div>
            <div class="dropdown-item" onclick="App.Export.toTXT()"><i class="ph-bold ph-file-text text-zinc-400"></i> Texto Simples (.txt)</div>
          </div>
        </div>
      </div>
    </header>

    <!-- TOOLBAR PRINCIPAL -->
    <div class="bg-app-bg border-b border-app-border px-4 py-2 flex items-center flex-wrap gap-y-2 shrink-0">
      
      <!-- Undo/Redo -->
      <button onclick="App.Editor.exec('undo')" class="btn-toolbar" title="Desfazer (Ctrl+Z)"><i class="ph-bold ph-arrow-u-up-left"></i></button>
      <button onclick="App.Editor.exec('redo')" class="btn-toolbar" title="Refazer (Ctrl+Y)"><i class="ph-bold ph-arrow-u-up-right"></i></button>
      <div class="toolbar-divider"></div>

      <!-- Fonte -->
      <select onchange="App.Editor.exec('fontName', this.value)" class="bg-app-card border border-app-border text-xs text-white rounded px-2 py-1.5 outline-none w-32 cursor-pointer">
        <option value="Arial">Arial</option>
        <option value="Inter">Inter</option>
        <option value="Georgia">Georgia</option>
        <option value="Times New Roman">Times New Roman</option>
        <option value="Courier Prime">Courier Mono</option>
      </select>

      <select onchange="App.Editor.exec('fontSize', this.value)" class="bg-app-card border border-app-border text-xs text-white rounded px-2 py-1.5 outline-none w-16 ml-1 cursor-pointer">
        <option value="1">10</option>
        <option value="2">11</option>
        <option value="3" selected>12</option>
        <option value="4">14</option>
        <option value="5">18</option>
        <option value="6">24</option>
        <option value="7">36</option>
      </select>

      <div class="toolbar-divider"></div>

      <!-- Formatação -->
      <button onclick="App.Editor.exec('bold')" class="btn-toolbar format-btn" data-cmd="bold" title="Negrito (Ctrl+B)"><i class="ph-bold ph-text-b"></i></button>
      <button onclick="App.Editor.exec('italic')" class="btn-toolbar format-btn" data-cmd="italic" title="Itálico (Ctrl+I)"><i class="ph-bold ph-text-italic"></i></button>
      <button onclick="App.Editor.exec('underline')" class="btn-toolbar format-btn" data-cmd="underline" title="Sublinhado (Ctrl+U)"><i class="ph-bold ph-text-underline"></i></button>
      <button onclick="App.Editor.exec('strikeThrough')" class="btn-toolbar format-btn" data-cmd="strikeThrough" title="Tachado"><i class="ph-bold ph-text-strikethrough"></i></button>
      
      <div class="toolbar-divider"></div>

      <!-- Cores -->
      <label class="btn-toolbar relative" title="Cor do Texto">
        <i class="ph-bold ph-palette"></i>
        <input type="color" onchange="App.Editor.exec('foreColor', this.value)" class="absolute opacity-0 w-full h-full cursor-pointer">
      </label>
      <label class="btn-toolbar relative" title="Cor de Destaque">
        <i class="ph-bold ph-highlighter"></i>
        <input type="color" onchange="App.Editor.exec('hiliteColor', this.value)" class="absolute opacity-0 w-full h-full cursor-pointer">
      </label>

      <div class="toolbar-divider"></div>

      <!-- Alinhamento -->
      <button onclick="App.Editor.exec('justifyLeft')" class="btn-toolbar format-btn" data-cmd="justifyLeft" title="Alinhar à Esquerda"><i class="ph-bold ph-text-align-left"></i></button>
      <button onclick="App.Editor.exec('justifyCenter')" class="btn-toolbar format-btn" data-cmd="justifyCenter" title="Centralizar"><i class="ph-bold ph-text-align-center"></i></button>
      <button onclick="App.Editor.exec('justifyRight')" class="btn-toolbar format-btn" data-cmd="justifyRight" title="Alinhar à Direita"><i class="ph-bold ph-text-align-right"></i></button>
      <button onclick="App.Editor.exec('justifyFull')" class="btn-toolbar format-btn" data-cmd="justifyFull" title="Justificar"><i class="ph-bold ph-text-align-justify"></i></button>

      <div class="toolbar-divider"></div>

      <!-- Listas e Indentação -->
      <button onclick="App.Editor.exec('insertUnorderedList')" class="btn-toolbar format-btn" data-cmd="insertUnorderedList" title="Lista com Marcadores"><i class="ph-bold ph-list-bullets"></i></button>
      <button onclick="App.Editor.exec('insertOrderedList')" class="btn-toolbar format-btn" data-cmd="insertOrderedList" title="Lista Numerada"><i class="ph-bold ph-list-numbers"></i></button>
      <button onclick="App.Editor.exec('outdent')" class="btn-toolbar" title="Diminuir Recuo (Shift+Tab)"><i class="ph-bold ph-text-outdent"></i></button>
      <button onclick="App.Editor.exec('indent')" class="btn-toolbar" title="Aumentar Recuo (Tab)"><i class="ph-bold ph-text-indent"></i></button>

      <div class="toolbar-divider"></div>

      <!-- Menu Inserir -->
      <div class="relative dropdown-trigger ml-auto">
        <button class="px-3 py-1.5 rounded-lg bg-zinc-800 hover:bg-zinc-700 text-zinc-300 font-medium text-xs flex items-center gap-1">
          <i class="ph-bold ph-plus"></i> Inserir
        </button>
        <div class="dropdown right-0 left-auto w-48">
          <label class="dropdown-item">
            <i class="ph-bold ph-image text-emerald-400"></i> Imagem Local
            <input type="file" accept="image/*" class="hidden" onchange="App.Insert.image(event)">
          </label>
          <div class="dropdown-item" onclick="App.Insert.tablePrompt()"><i class="ph-bold ph-table text-blue-400"></i> Tabela (Grelha)</div>
          <div class="dropdown-item" onclick="App.Insert.link()"><i class="ph-bold ph-link text-zinc-300"></i> Link URL (Ctrl+K)</div>
          <div class="dropdown-item" onclick="App.Editor.exec('insertHorizontalRule')"><i class="ph-bold ph-minus text-zinc-300"></i> Linha Horizontal</div>
          <div class="dropdown-item" onclick="App.Insert.pageBreak()"><i class="ph-bold ph-scissors text-amber-400"></i> Quebra de Página Manual</div>
        </div>
      </div>
    </div>

    <!-- WORKSPACE (SCROLL AREA) -->
    <main id="workspace-container" class="custom-scroll" onscroll="App.UI.updateContextToolbarPosition()">
      
      <!-- Transform wrapper para Zoom -->
      <div id="document-transform">
        
        <!-- Régua Visual A4 -->
        <div id="ruler-container"></div>
        
        <!-- Editor Real -->
        <div id="editor-page" contenteditable="true" spellcheck="false" class="custom-scroll">
          <p><br></p>
        </div>

        <!-- Resizer de Imagens -->
        <div id="image-resizer">
          <div class="resizer-handle nw" data-pos="nw"></div>
          <div class="resizer-handle ne" data-pos="ne"></div>
          <div class="resizer-handle sw" data-pos="sw"></div>
          <div class="resizer-handle se" data-pos="se"></div>
        </div>
      </div>
    </main>

    <!-- STATUS BAR -->
    <footer class="h-8 bg-app-card border-t border-app-border flex items-center justify-between px-4 shrink-0 text-[11px] text-zinc-400 font-medium">
      <div class="flex items-center gap-4">
        <span id="status-pages">Página 1 de 1</span>
        <span id="status-words">0 palavras</span>
        <span id="status-chars">0 caracteres</span>
        <span>Português (Brasil)</span>
      </div>
      
      <div class="flex items-center gap-2 bg-app-bg px-2 py-0.5 rounded border border-app-border">
        <button onclick="App.View.setZoom(App.View.zoom - 0.25)" class="hover:text-white"><i class="ph-bold ph-minus"></i></button>
        <span id="zoom-level" class="w-10 text-center font-mono">100%</span>
        <button onclick="App.View.setZoom(App.View.zoom + 0.25)" class="hover:text-white"><i class="ph-bold ph-plus"></i></button>
      </div>
    </footer>
  </div>

  <!-- =========================================================
       FLUTUANTES
       ========================================================= -->
  
  <!-- CONTEXT TOOLBAR -->
  <div id="context-toolbar">
    <select onchange="App.Editor.exec('fontSize', this.value)" class="bg-transparent text-white text-xs outline-none cursor-pointer w-12 px-1">
      <option value="1">10</option>
      <option value="2">11</option>
      <option value="3">12</option>
      <option value="4">14</option>
      <option value="5">18</option>
    </select>
    <div class="toolbar-divider" style="height: 14px; margin: 0 4px;"></div>
    <button onclick="App.Editor.exec('bold')" class="btn-toolbar !p-1 !rounded"><i class="ph-bold ph-text-b"></i></button>
    <button onclick="App.Editor.exec('italic')" class="btn-toolbar !p-1 !rounded"><i class="ph-bold ph-text-italic"></i></button>
    <button onclick="App.Editor.exec('underline')" class="btn-toolbar !p-1 !rounded"><i class="ph-bold ph-text-underline"></i></button>
    <div class="toolbar-divider" style="height: 14px; margin: 0 4px;"></div>
    <label class="btn-toolbar !p-1 !rounded relative"><i class="ph-bold ph-palette text-blue-400"></i><input type="color" onchange="App.Editor.exec('foreColor', this.value)" class="absolute opacity-0 w-full h-full cursor-pointer"></label>
    <label class="btn-toolbar !p-1 !rounded relative"><i class="ph-bold ph-highlighter text-yellow-400"></i><input type="color" onchange="App.Editor.exec('hiliteColor', this.value)" class="absolute opacity-0 w-full h-full cursor-pointer"></label>
  </div>

  <!-- SEARCH BAR -->
  <div id="search-bar" class="hidden absolute top-16 right-6 z-50 bg-app-card border border-app-border rounded-xl p-2 shadow-2xl flex items-center gap-2">
    <i class="ph-bold ph-magnifying-glass text-zinc-400 pl-2"></i>
    <input type="text" id="search-input" placeholder="Localizar no texto..." class="bg-transparent text-xs text-white placeholder-zinc-500 outline-none w-48" oninput="App.Search.doSearch()" onkeydown="if(event.key==='Enter') App.Search.next()">
    <button onclick="App.Search.prev()" class="btn-toolbar !p-1" title="Anterior"><i class="ph-bold ph-caret-up"></i></button>
    <button onclick="App.Search.next()" class="btn-toolbar !p-1" title="Próximo"><i class="ph-bold ph-caret-down"></i></button>
    <div class="toolbar-divider" style="height:14px"></div>
    <button onclick="App.Search.toggle()" class="btn-toolbar !p-1 text-red-400"><i class="ph-bold ph-x"></i></button>
  </div>

  <script>
    // Inicialização da Régua Visual
    function renderRuler() {
      const container = document.getElementById('ruler-container');
      const dpi = 96;
      const widthPx = 794;
      const cmInPx = dpi / 2.54; 
      
      for(let i=0; i <= (widthPx/cmInPx); i++) {
        const x = i * cmInPx;
        
        // Traço principal (cm)
        const tick = document.createElement('div');
        tick.className = 'ruler-tick major';
        tick.style.left = `${x}px`;
        container.appendChild(tick);
        
        if(i > 0) {
            const num = document.createElement('div');
            num.className = 'ruler-number';
            num.style.left = `${x}px`;
            num.innerText = i;
            container.appendChild(num);
        }

        // Sub-traços (mm)
        for(let j=1; j<10; j++) {
            const subX = x + (j * (cmInPx/10));
            if(subX < widthPx) {
                const subTick = document.createElement('div');
                subTick.className = 'ruler-tick minor';
                subTick.style.left = `${subX}px`;
                container.appendChild(subTick);
            }
        }
      }
    }
    renderRuler();

    // Aplicação Principal
    const App = {
      db: localforage.createInstance({ name: "WordWeb_DB" }),
      currentDoc: { id: null, title: 'Documento sem título', content: '<p><br></p>', updated: Date.now() },
      
      Elements: {
        editor: document.getElementById('editor-page'),
        workspace: document.getElementById('workspace-container'),
        ctxMenu: document.getElementById('context-toolbar'),
      },

      View: {
        zoom: 1.0,
        setZoom(val) {
          this.zoom = Math.max(0.5, Math.min(val, 2.0));
          document.getElementById('document-transform').style.transform = `scale(${this.zoom})`;
          document.getElementById('zoom-level').innerText = `${Math.round(this.zoom * 100)}%`;
        }
      },

      async init() {
        // Garantir que p é o parágrafo padrão no execCommand
        document.execCommand('defaultParagraphSeparator', false, 'p');
        
        await this.loadRecentDocs();
        this.setupEvents();
        this.ImageResizer.init();
      },

      // --- GERENCIAMENTO DE ARQUIVOS ---
      showStartScreen() {
        this.saveCurrentDoc();
        document.getElementById('start-screen').classList.remove('hidden');
        document.getElementById('editor-screen').classList.add('hidden');
        document.getElementById('editor-screen').classList.remove('flex');
        this.loadRecentDocs();
      },

      showEditorScreen() {
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('editor-screen').classList.remove('hidden');
        document.getElementById('editor-screen').classList.add('flex');
        document.getElementById('doc-title').value = this.currentDoc.title;
        this.Elements.editor.innerHTML = this.currentDoc.content || '<p><br></p>';
        this.Elements.editor.focus();
        this.UI.updateStats();
        this.UI.updatePaginationIndicators();
      },

      createNewDocument() {
        this.currentDoc = {
          id: 'doc_' + Date.now(),
          title: 'Documento sem título',
          content: '<p><br></p>',
          updated: Date.now()
        };
        this.showEditorScreen();
        this.saveCurrentDoc();
      },

      async openDocument(id) {
        const doc = await this.db.getItem(id);
        if (doc) {
          this.currentDoc = doc;
          this.showEditorScreen();
        }
      },

      async deleteDocument(e, id) {
        e.stopPropagation();
        if(confirm('Tem certeza que deseja excluir este documento?')) {
            await this.db.removeItem(id);
            this.loadRecentDocs();
        }
      },

      async loadRecentDocs() {
        const container = document.getElementById('recent-docs-list');
        container.innerHTML = '';
        const keys = await this.db.keys();
        const docs = [];
        
        for (let k of keys) {
            const item = await this.db.getItem(k);
            if(item && item.id) docs.push(item);
        }

        docs.sort((a,b) => b.updated - a.updated);

        if (docs.length === 0) {
            container.innerHTML = '<div class="p-6 text-center text-zinc-500 text-sm">Nenhum documento recente.</div>';
            return;
        }

        docs.forEach(doc => {
            const date = new Date(doc.updated).toLocaleDateString('pt-BR', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit'});
            container.innerHTML += `
              <div onclick="App.openDocument('${doc.id}')" class="flex items-center justify-between p-4 border-b border-app-border hover:bg-zinc-800 cursor-pointer transition-colors group">
                <div class="flex items-center gap-3">
                  <i class="ph-duotone ph-file-text text-2xl text-blue-400"></i>
                  <div>
                    <h3 class="text-sm font-semibold text-white">${doc.title || 'Sem título'}</h3>
                    <p class="text-[11px] text-zinc-500">Editado em ${date}</p>
                  </div>
                </div>
                <button onclick="App.deleteDocument(event, '${doc.id}')" class="text-zinc-500 hover:text-red-400 opacity-0 group-hover:opacity-100 p-2"><i class="ph-bold ph-trash"></i></button>
              </div>
            `;
        });
      },

      saveCurrentDoc: function() {
        if (!this.currentDoc.id) return;
        const status = document.getElementById('save-status');
        status.innerHTML = '<i class="ph-bold ph-spinner animate-spin"></i> Salvando...';
        
        this.currentDoc.title = document.getElementById('doc-title').value;
        this.currentDoc.content = this.Elements.editor.innerHTML;
        this.currentDoc.updated = Date.now();

        this.db.setItem(this.currentDoc.id, this.currentDoc).then(() => {
          setTimeout(() => {
            status.innerHTML = '<i class="ph-fill ph-cloud-check text-emerald-500"></i> Salvo';
          }, 500);
        });
      },

      // --- IMPORTAÇÃO ---
      importDocument(e) {
        const file = e.target.files[0];
        if(!file) return;

        const ext = file.name.split('.').pop().toLowerCase();
        const reader = new FileReader();

        if (ext === 'txt' || ext === 'html') {
            reader.onload = (ev) => {
                let content = ev.target.result;
                if(ext === 'txt') content = `<p>${content.replace(/\n/g, '</p><p>')}</p>`;
                
                this.currentDoc = { id: 'doc_'+Date.now(), title: file.name, content: content, updated: Date.now() };
                this.showEditorScreen();
                this.saveCurrentDoc();
            };
            reader.readAsText(file);
        } else if (ext === 'docx') {
            reader.onload = (ev) => {
                mammoth.convertToHtml({arrayBuffer: ev.target.result})
                    .then((result) => {
                        this.currentDoc = { id: 'doc_'+Date.now(), title: file.name, content: result.value, updated: Date.now() };
                        this.showEditorScreen();
                        this.saveCurrentDoc();
                    }).catch(err => alert("Erro ao ler DOCX: " + err.message));
            };
            reader.readAsArrayBuffer(file);
        }
        e.target.value = '';
      },

      // --- MÓDULO DE EDIÇÃO (PRIORIDADE 1 e 2) ---
      Editor: {
        exec(command, value = null) {
          App.Elements.editor.focus();
          document.execCommand(command, false, value);
          App.UI.updateToolbarState();
          App.saveCurrentDoc();
        }
      },

      // --- REDIMENSIONAMENTO DE IMAGENS ---
      ImageResizer: {
        activeImg: null,
        overlay: null,
        init() {
            this.overlay = document.getElementById('image-resizer');
            
            document.querySelectorAll('.resizer-handle').forEach(handle => {
                handle.addEventListener('mousedown', (e) => this.startResize(e, handle.dataset.pos));
            });

            App.Elements.editor.addEventListener('click', (e) => {
                if (e.target.tagName === 'IMG') {
                    this.attach(e.target);
                } else {
                    this.detach();
                }
            });

            // Atualizar posição ao digitar, rolar ou redimensionar
            App.Elements.editor.addEventListener('input', () => this.updatePos());
            App.Elements.workspace.addEventListener('scroll', () => this.updatePos());
        },
        attach(img) {
            this.activeImg = img;
            this.overlay.style.display = 'block';
            this.updatePos();
        },
        detach() {
            this.activeImg = null;
            this.overlay.style.display = 'none';
        },
        updatePos() {
            if (!this.activeImg) return;
            const img = this.activeImg;
            // Calculando offset relativo ao editor-page
            this.overlay.style.width = img.offsetWidth + 'px';
            this.overlay.style.height = img.offsetHeight + 'px';
            this.overlay.style.top = img.offsetTop + 'px';
            this.overlay.style.left = img.offsetLeft + 'px';
        },
        startResize(e, pos) {
            e.preventDefault(); e.stopPropagation();
            const startX = e.clientX;
            const startW = this.activeImg.offsetWidth;

            const onMove = (ev) => {
                let newW = startW;
                // Ajuste de largura baseado na posição do mouse e zoom
                const deltaX = (ev.clientX - startX) / App.View.zoom;
                
                if (pos.includes('e')) newW = startW + deltaX;
                if (pos.includes('w')) newW = startW - deltaX;
                
                if (newW > 50) { // Largura mínima
                    this.activeImg.style.width = newW + 'px';
                    this.activeImg.style.height = 'auto'; // Mantém proporção
                    this.updatePos();
                }
            };

            const onUp = () => {
                window.removeEventListener('mousemove', onMove);
                window.removeEventListener('mouseup', onUp);
                App.saveCurrentDoc();
            };

            window.addEventListener('mousemove', onMove);
            window.addEventListener('mouseup', onUp);
        }
      },

      // --- INSERÇÃO (PRIORIDADE 6, 7 e 8) ---
      Insert: {
        link() {
            const url = prompt("Digite a URL do link:", "https://");
            if(url) App.Editor.exec('createLink', url);
        },
        image(e) {
            const file = e.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                const img = `<img src="${ev.target.result}" style="max-width: 100%;" class="inline" onclick="App.UI.toggleImageWrap(this)">`;
                App.Editor.exec('insertHTML', img);
            };
            reader.readAsDataURL(file);
            e.target.value = '';
        },
        tablePrompt() {
            const rows = prompt("Número de linhas:", "3");
            const cols = prompt("Número de colunas:", "3");
            if(rows && cols) this.table(parseInt(rows), parseInt(cols));
        },
        table(rows, cols) {
            let html = '<br><table style="width: 100%; border-collapse: collapse; margin-bottom: 1em;"><tbody>';
            for(let r=0; r<rows; r++){
                html += '<tr>';
                for(let c=0; c<cols; c++){
                    html += '<td style="border: 1px solid #94a3b8; padding: 8px; min-width: 50px;"><br></td>';
                }
                html += '</tr>';
            }
            html += '</tbody></table><p><br></p>';
            App.Editor.exec('insertHTML', html);
        },
        pageBreak() {
            // Emulando quebra de página física (recorta o padding branco para mostrar o fundo escuro)
            const breakHtml = `
            <div class="manual-page-break" contenteditable="false">
                <div style="background: #27272a; padding: 4px 12px; border-radius: 12px; font-size: 10px; color: #a1a1aa; font-family: Inter, sans-serif; font-weight: 600; letter-spacing: 0.5px;">Quebra de Página</div>
            </div><p><br></p>`;
            App.Editor.exec('insertHTML', breakHtml);
        }
      },

      // --- INTERFACE E LÓGICA DE VISUALIZAÇÃO ---
      UI: {
        updateToolbarState() {
          document.querySelectorAll('.format-btn').forEach(btn => {
            const cmd = btn.getAttribute('data-cmd');
            if(document.queryCommandState(cmd)) btn.classList.add('active');
            else btn.classList.remove('active');
          });
        },
        
        updateContextToolbarPosition() {
          const selection = window.getSelection();
          const menu = App.Elements.ctxMenu;
          
          if (!selection.isCollapsed && App.Elements.editor.contains(selection.anchorNode)) {
            const range = selection.getRangeAt(0);
            const rect = range.getBoundingClientRect();
            const wsRect = App.Elements.workspace.getBoundingClientRect();
            
            // Posicionar acima da seleção
            menu.style.left = `${rect.left + (rect.width/2) - (menu.offsetWidth/2)}px`;
            menu.style.top = `${rect.top - menu.offsetHeight - 10}px`;
            menu.classList.add('visible');
          } else {
            menu.classList.remove('visible');
          }
        },

        updateStats() {
            const text = App.Elements.editor.innerText || '';
            const chars = text.replace(/\s/g, '').length;
            const words = text.trim() === '' ? 0 : text.trim().split(/\s+/).length;
            
            document.getElementById('status-words').innerText = `${words} palavras`;
            document.getElementById('status-chars').innerText = `${chars} caracteres`;
        },

        // Simula visualmente páginas A4 continuas baseadas na altura
        updatePaginationIndicators() {
            const editor = App.Elements.editor;
            const pageHeight = 1123; // A4 height em pixels
            
            // Remover indicadores antigos
            document.querySelectorAll('.page-break-indicator').forEach(el => el.remove());
            
            const totalHeight = editor.scrollHeight;
            const numPages = Math.max(1, Math.ceil(totalHeight / pageHeight));
            
            // Desenhar linhas a cada 1123px
            for(let i = 1; i < numPages; i++) {
                const indicator = document.createElement('div');
                indicator.className = 'page-break-indicator';
                indicator.style.top = `${i * pageHeight}px`;
                editor.appendChild(indicator);
            }

            document.getElementById('status-pages').innerText = `Página 1 de ${numPages}`;
            // Se a altura real (scroll) for maior que a minima (css), o padding bottom pode ficar estranho
            // Mantemos a altura fluida mas com minimo de A4
            editor.style.minHeight = `${numPages * pageHeight}px`;
        },

        toggleImageWrap(imgElement) {
            if(imgElement.classList.contains('inline')) {
                imgElement.classList.remove('inline');
                imgElement.classList.add('wrap');
            } else {
                imgElement.classList.remove('wrap');
                imgElement.classList.add('inline');
            }
        }
      },

      // --- BUSCA (PRIORIDADE 13) ---
      Search: {
        active: false,
        toggle() {
            this.active = !this.active;
            const bar = document.getElementById('search-bar');
            if(this.active) { bar.classList.remove('hidden'); document.getElementById('search-input').focus(); }
            else { bar.classList.add('hidden'); App.Elements.editor.focus(); }
        },
        doSearch() {
            const term = document.getElementById('search-input').value;
            if(!term) return;
            window.find(term, false, false, true, false, false, false);
        },
        next() { this.doSearch(); },
        prev() { 
            const term = document.getElementById('search-input').value;
            if(term) window.find(term, false, true, true, false, false, false); 
        }
      },

      // --- EXPORTAÇÃO (PRIORIDADE 14) ---
      Export: {
        toDOCX() {
            // Limpa quebras visuais temporariamente para não poluir o HTML
            document.querySelectorAll('.page-break-indicator').forEach(el => el.remove());
            
            const html = `<!DOCTYPE html><html><head><meta charset="utf-8"></head><body>${App.Elements.editor.innerHTML}</body></html>`;
            const blob = htmlDocx.asBlob(html, { orientation: 'portrait', margins: { top: 1440, right: 1440, bottom: 1440, left: 1440 }}); // 1 inch
            
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `${App.currentDoc.title || 'Documento'}.docx`;
            link.click();
            URL.revokeObjectURL(link.href);
            
            App.UI.updatePaginationIndicators(); // restaura
        },
        toPDF() {
            const opt = {
                margin:       25.4, // 1 polegada em mm
                filename:     `${App.currentDoc.title || 'Documento'}.pdf`,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2 },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };
            
            // Ocultar indicadores para PDF limpo
            document.querySelectorAll('.page-break-indicator').forEach(el => el.style.display = 'none');
            
            html2pdf().set(opt).from(App.Elements.editor).save().then(() => {
                document.querySelectorAll('.page-break-indicator').forEach(el => el.style.display = 'flex');
            });
        },
        toTXT() {
            const text = App.Elements.editor.innerText;
            const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `${App.currentDoc.title || 'Documento'}.txt`;
            link.click();
            URL.revokeObjectURL(link.href);
        }
      },

      // --- EVENTOS GLOBAIS E TECLADO ---
      setupEvents() {
        // Atualizações de UI ao digitar/clicar
        this.Elements.editor.addEventListener('keyup', () => {
            this.UI.updateToolbarState();
            this.UI.updateStats();
            this.UI.updatePaginationIndicators();
            this.debounceSave();
        });
        this.Elements.editor.addEventListener('mouseup', () => {
            this.UI.updateToolbarState();
        });

        // Barra contextual de seleção
        document.addEventListener('selectionchange', () => this.UI.updateContextToolbarPosition());

        // Colar Texto (Prio 1) - Mantém a formatação básica nativa, mas você poderia forçar texto puro se quisesse
        this.Elements.editor.addEventListener('paste', () => {
            setTimeout(() => {
                this.UI.updateStats();
                this.UI.updatePaginationIndicators();
                this.saveCurrentDoc();
            }, 100);
        });

        // Atalhos de teclado (Prio 1 e 13)
        document.addEventListener('keydown', (e) => {
            if(!this.currentDoc.id) return; // Só se estiver editando

            // Tab (Indentação)
            if (e.key === 'Tab' && this.Elements.editor.contains(document.activeElement)) {
                e.preventDefault();
                if(e.shiftKey) this.Editor.exec('outdent');
                else this.Editor.exec('indent');
            }

            // Ctrl+F (Busca)
            if (e.ctrlKey && e.key.toLowerCase() === 'f') {
                e.preventDefault();
                this.Search.toggle();
            }

            // Ctrl+K (Link)
            if (e.ctrlKey && e.key.toLowerCase() === 'k') {
                e.preventDefault();
                this.Insert.link();
            }

            // Excluir imagem selecionada via teclado
            if ((e.key === 'Backspace' || e.key === 'Delete') && this.ImageResizer.activeImg) {
                e.preventDefault();
                this.ImageResizer.activeImg.remove();
                this.ImageResizer.detach();
                this.saveCurrentDoc();
            }
        });
      },

      // Helper para não sobrecarregar o DB a cada tecla
      debounceSave: function() {
        clearTimeout(this._saveTimer);
        const status = document.getElementById('save-status');
        status.innerHTML = '<i class="ph-bold ph-spinner animate-spin"></i> Salvando...';
        this._saveTimer = setTimeout(() => this.saveCurrentDoc(), 1500);
      }
    };

    // Iniciar App
    window.onload = () => App.init();

  </script>
</body>
