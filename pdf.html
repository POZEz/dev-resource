<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#09090b">
  <title>Editor de PDF Pro</title>

  <!-- Bibliotecas: Supabase, PDF.js, PDF-lib, Tailwind, Phosphor Icons -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            matte: { bg: '#09090b', card: '#121214', border: '#27272a', text: '#fafafa', muted: '#a1a1aa', primary: '#3b82f6' }
          }
        }
      }
    }
  </script>

  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #09090b; color: #fafafa; overflow: hidden; overscroll-behavior: none; }
    .no-scrollbars::-webkit-scrollbar { display: none; }
    .no-scrollbars { -ms-overflow-style: none; scrollbar-width: none; }

    /* Área de Trabalho do PDF */
    #workspace {
      position: absolute;
      top: 56px; /* Header */
      bottom: 0;
      left: 64px; /* Toolbar lateral */
      right: 0;
      overflow: hidden;
      background-color: #121214;
      touch-action: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #document-container {
      position: absolute;
      transform-origin: 0 0;
      background: white;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
    }

    canvas { display: block; position: absolute; top: 0; left: 0; pointer-events: none; }
    #overlay-layer { z-index: 10; position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

    /* Estilos dos Elementos Editáveis no Overlay */
    .pdf-element {
      position: absolute;
      cursor: grab;
      user-select: none;
      box-sizing: border-box;
      transform-origin: 0 0;
    }
    .pdf-element.selected {
      outline: 2px solid #3b82f6;
      z-index: 50;
    }
    .pdf-element:active { cursor: grabbing; }

    /* Textos */
    .pdf-text-content {
      width: 100%;
      height: 100%;
      outline: none;
      color: #000;
      font-family: Arial, Helvetica, sans-serif; /* Padrão seguro para pdf-lib */
      line-height: 1.2;
      overflow: hidden;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    
    /* Imagens e Retângulos */
    .pdf-image-content { width: 100%; height: 100%; object-fit: fill; pointer-events: none; }
    .pdf-rect-content { width: 100%; height: 100%; pointer-events: none; }

    /* Alças de Redimensionamento (Resize Handles) */
    .resize-handle {
      position: absolute;
      width: 12px;
      height: 12px;
      background-color: #fff;
      border: 2px solid #3b82f6;
      border-radius: 50%;
      display: none;
      z-index: 60;
    }
    .pdf-element.selected .resize-handle { display: block; }
    .handle-tl { top: -6px; left: -6px; cursor: nwse-resize; }
    .handle-tr { top: -6px; right: -6px; cursor: nesw-resize; }
    .handle-bl { bottom: -6px; left: -6px; cursor: nesw-resize; }
    .handle-br { bottom: -6px; right: -6px; cursor: nwse-resize; }

    /* Menu Contextual Flutuante */
    #context-menu {
      position: absolute;
      display: none;
      background: rgba(28, 28, 30, 0.95);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 6px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      z-index: 100;
      align-items: center;
      gap: 6px;
    }
    #context-menu.active { display: flex; }

    .ctx-btn {
      padding: 6px;
      border-radius: 6px;
      color: #a1a1aa;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .ctx-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }
    .ctx-btn.active { background: rgba(59, 130, 246, 0.2); color: #60a5fa; }
    
    .ctx-input {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      color: #fff;
      border-radius: 6px;
      padding: 4px;
      font-size: 12px;
      text-align: center;
      outline: none;
    }

    /* Toolbar Lateral */
    .side-toolbar {
      position: absolute;
      top: 56px;
      bottom: 0;
      left: 0;
      width: 64px;
      background: #121214;
      border-right: 1px solid #27272a;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 16px;
      gap: 16px;
      z-index: 40;
    }
    .tool-btn {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #a1a1aa;
      transition: all 0.2s;
      cursor: pointer;
    }
    .tool-btn:hover { background: rgba(255,255,255,0.05); color: #fff; }
    .tool-btn.active { background: rgba(59, 130, 246, 0.15); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.3); }

    /* Drawer de Páginas */
    #pages-drawer { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    .drawer-closed { transform: translateX(100%); }
    .drawer-open { transform: translateX(0); }
  </style>
</head>
<body class="antialiased text-white">

  <!-- TELA INICIAL (ESTADO VAZIO) -->
  <div id="empty-state" class="absolute inset-0 z-50 flex flex-col items-center justify-center bg-matte-bg px-6">
    <div class="w-20 h-20 rounded-[24px] bg-white/[0.02] border border-white/5 flex items-center justify-center text-zinc-500 mb-6 shadow-2xl">
      <i class="ph-fill ph-file-pdf text-4xl text-blue-500/80"></i>
    </div>
    <h2 class="text-xl font-bold text-white mb-2 text-center">Editor de PDF Profissional</h2>
    <p class="text-sm text-zinc-400 mb-8 text-center max-w-sm leading-relaxed">Adicione textos, imagens, cubra informações sensíveis e gerencie páginas de forma fluida e direta.</p>
    
    <div class="flex flex-col sm:flex-row items-center gap-4 w-full max-w-sm">
      <label class="w-full px-5 py-3.5 rounded-xl bg-blue-600 text-white font-bold text-sm hover:bg-blue-500 transition-colors cursor-pointer shadow-lg shadow-blue-500/20 flex items-center justify-center gap-2">
        <i class="ph-bold ph-folder-open text-lg"></i> Abrir Documento
        <input type="file" id="file-upload" accept="application/pdf" class="hidden" onchange="handleFileSelect(event)">
      </label>

      <button onclick="createBlankPDF()" class="w-full px-5 py-3.5 rounded-xl bg-white/[0.05] border border-white/10 text-white font-bold text-sm hover:bg-white/[0.1] transition-colors flex items-center justify-center gap-2">
        <i class="ph-bold ph-file-plus text-lg"></i> Criar em Branco
      </button>
    </div>
  </div>

  <!-- EDITOR PRINCIPAL -->
  <div id="editor-ui" class="hidden flex-col h-full w-full relative">
    
    <!-- CABEÇALHO SUPERIOR -->
    <header class="h-14 bg-matte-card border-b border-matte-border flex items-center justify-between px-4 shrink-0 absolute top-0 w-full z-40">
      <div class="flex items-center gap-4">
        <div class="w-8 h-8 rounded-lg bg-blue-500/10 flex items-center justify-center text-blue-400">
          <i class="ph-fill ph-file-pdf text-lg"></i>
        </div>
        <div>
          <input type="text" id="header-filename" value="documento.pdf" onchange="state.filename = this.value" class="bg-transparent font-bold text-sm text-white focus:outline-none focus:border-b border-blue-500 truncate w-32 sm:w-64">
          <div class="text-[10px] text-zinc-500 flex items-center gap-1">
            <span id="sync-status">Alterações salvas localmente</span>
          </div>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button onclick="toggleDrawer(true)" class="px-3 py-1.5 rounded-lg bg-white/[0.03] hover:bg-white/[0.08] border border-white/5 text-zinc-300 text-xs font-semibold flex items-center gap-1.5 transition-colors">
          <i class="ph-bold ph-files"></i> <span class="hidden sm:inline">Páginas</span>
        </button>
        <button onclick="exportFinalPDF()" class="px-4 py-1.5 rounded-lg bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold shadow-lg shadow-blue-500/20 flex items-center gap-1.5 transition-colors">
          <i class="ph-bold ph-download-simple"></i> Exportar
        </button>
      </div>
    </header>

    <!-- BARRA DE FERRAMENTAS LATERAL -->
    <nav class="side-toolbar">
      <button onclick="setTool('select')" id="tool-select" class="tool-btn active" title="Selecionar & Mover (V)">
        <i class="ph-bold ph-cursor text-xl"></i>
      </button>
      <button onclick="setTool('pan')" id="tool-pan" class="tool-btn" title="Navegar / Mão (H)">
        <i class="ph-bold ph-hand-palm text-xl"></i>
      </button>
      
      <div class="w-8 h-px bg-matte-border my-1"></div>

      <button onclick="addElement('text')" class="tool-btn" title="Inserir Texto">
        <i class="ph-bold ph-text-t text-xl"></i>
      </button>
      <label class="tool-btn cursor-pointer" title="Inserir Imagem">
        <i class="ph-bold ph-image text-xl"></i>
        <input type="file" accept="image/*" class="hidden" onchange="handleAddImage(event)">
      </label>
      <button onclick="addElement('whiteout')" class="tool-btn" title="Apagador / Retângulo Branco (Ocultar texto original)">
        <i class="ph-bold ph-square text-xl"></i>
      </button>
      
      <div class="flex-1"></div>
      
      <!-- Controles de Zoom -->
      <div class="flex flex-col items-center gap-2 mb-4">
        <button onclick="zoomCanvas(1.2)" class="p-2 text-zinc-400 hover:text-white"><i class="ph-bold ph-magnifying-glass-plus"></i></button>
        <span id="zoom-level" class="text-[9px] font-mono text-zinc-500">100%</span>
        <button onclick="zoomCanvas(0.8)" class="p-2 text-zinc-400 hover:text-white"><i class="ph-bold ph-magnifying-glass-minus"></i></button>
      </div>
    </nav>

    <!-- WORKSPACE E MOTOR DE GESTOS -->
    <main id="workspace">
      <div id="document-container">
        <!-- Renderização do PDF original -->
        <canvas id="pdf-layer"></canvas>
        <!-- Camada HTML com os elementos editáveis (Textos, Imagens, Formas) -->
        <div id="overlay-layer"></div>
      </div>
      
      <!-- MENU CONTEXTUAL FLUTUANTE (Aparece ao selecionar elemento) -->
      <div id="context-menu">
        <!-- Controles de Texto -->
        <div id="ctx-text-tools" class="flex items-center gap-1 hidden border-r border-white/10 pr-1 mr-1">
          <input type="number" id="ctx-font-size" value="16" min="8" max="72" onchange="updateSelectedElement({fontSize: parseInt(this.value)})" class="ctx-input w-12" title="Tamanho da Fonte">
          <button onclick="toggleElementStyle('isBold')" id="ctx-bold" class="ctx-btn" title="Negrito"><i class="ph-bold ph-text-b"></i></button>
          <button onclick="toggleElementStyle('isItalic')" id="ctx-italic" class="ctx-btn" title="Itálico"><i class="ph-bold ph-text-italic"></i></button>
          
          <div class="w-px h-4 bg-white/10 mx-1"></div>
          
          <button onclick="updateSelectedElement({align: 'left'})" class="ctx-btn" title="Alinhar à Esquerda"><i class="ph-bold ph-text-align-left"></i></button>
          <button onclick="updateSelectedElement({align: 'center'})" class="ctx-btn" title="Centralizar"><i class="ph-bold ph-text-align-center"></i></button>
          <button onclick="updateSelectedElement({align: 'right'})" class="ctx-btn" title="Alinhar à Direita"><i class="ph-bold ph-text-align-right"></i></button>
        </div>

        <!-- Cores (Aparece para texto e retângulos) -->
        <div id="ctx-color-tools" class="flex items-center gap-2 px-1">
          <div class="relative w-6 h-6 rounded-full overflow-hidden border border-white/20" title="Cor Principal">
            <input type="color" id="ctx-color" oninput="updateSelectedElement({color: this.value})" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
            <div id="ctx-color-preview" class="w-full h-full pointer-events-none bg-black"></div>
          </div>
          <!-- Botão Excluir Global -->
          <div class="w-px h-4 bg-white/10 mx-1"></div>
          <button onclick="deleteSelectedElement()" class="ctx-btn text-red-400 hover:text-red-300 hover:bg-red-500/10" title="Excluir (Del)"><i class="ph-bold ph-trash"></i></button>
        </div>
      </div>
    </main>

    <!-- DRAWER LATERAL DE PÁGINAS (Fica à direita) -->
    <div id="drawer-backdrop" onclick="toggleDrawer(false)" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-40 hidden transition-opacity"></div>
    <aside id="pages-drawer" class="fixed inset-y-0 right-0 w-72 bg-matte-card border-l border-matte-border z-50 drawer-closed flex flex-col shadow-2xl">
      <div class="h-14 px-4 border-b border-matte-border flex items-center justify-between shrink-0">
        <span class="text-sm font-bold text-white">Layout da Página</span>
        <button onclick="toggleDrawer(false)" class="text-zinc-500 hover:text-white p-1 rounded-md hover:bg-white/5"><i class="ph-bold ph-x"></i></button>
      </div>
      
      <div class="p-4 border-b border-matte-border grid grid-cols-2 gap-2">
        <button onclick="addBlankPageToDoc('portrait')" class="py-2 rounded-lg bg-white/[0.03] hover:bg-white/[0.08] text-xs font-semibold text-zinc-300 border border-white/5 flex flex-col items-center justify-center gap-1">
          <i class="ph-bold ph-file-plus text-base"></i> Retrato A4
        </button>
        <button onclick="addBlankPageToDoc('landscape')" class="py-2 rounded-lg bg-white/[0.03] hover:bg-white/[0.08] text-xs font-semibold text-zinc-300 border border-white/5 flex flex-col items-center justify-center gap-1">
          <i class="ph-bold ph-rectangle text-base"></i> Paisagem A4
        </button>
      </div>

      <div id="thumbnails-container" class="flex-1 overflow-y-auto p-4 space-y-4 custom-scroll">
        <!-- Miniaturas injetadas aqui -->
      </div>
    </aside>

  </div>

  <script>
    // ========================================================================
    // ESTADO GLOBAL DO EDITOR
    // ========================================================================
    let state = {
      pdfDocLib: null,   // Instância manipulável (salvamento)
      pdfJsDoc: null,    // Instância visual (renderização)
      filename: 'documento.pdf',
      currentPage: 1,
      totalPages: 0,
      
      zoom: 1.0,
      panX: 0,
      panY: 0,
      
      activeTool: 'select', // 'select', 'pan'
      selectedElementId: null,
      
      // Banco de Objetos: edits[pageNum] = [ { id, type, x, y, width, height, ...props } ]
      edits: {} 
    };

    // Referências DOM
    const workspace = document.getElementById('workspace');
    const container = document.getElementById('document-container');
    const pdfLayer = document.getElementById('pdf-layer');
    const overlayLayer = document.getElementById('overlay-layer');
    const contextMenu = document.getElementById('context-menu');
    
    let pdfCtx = pdfLayer.getContext('2d');

    function initEditor() {
      setupPanZoomEngine();
      setupOverlayInteraction();
      
      // Atalhos de teclado
      window.addEventListener('keydown', (e) => {
        if (e.key === 'Delete' || e.key === 'Backspace') {
          // Apenas deleta se não estiver editando um texto ativamente
          if (document.activeElement.tagName !== 'DIV' && state.selectedElementId) {
            deleteSelectedElement();
          }
        }
        if (e.key === 'v' || e.key === 'V') setTool('select');
        if (e.key === 'h' || e.key === 'H') setTool('pan');
      });
    }

    // ========================================================================
    // GESTÃO DE ARQUIVOS (ABRIR, CRIAR)
    // ========================================================================
    async function createBlankPDF() {
      try {
        const pdfDoc = await PDFLib.PDFDocument.create();
        pdfDoc.addPage([595.28, 841.89]); // A4 Portrait
        const pdfBytes = await pdfDoc.save();
        state.filename = "Novo_Documento.pdf";
        document.getElementById('header-filename').value = state.filename;
        await loadPdfData(pdfBytes);
      } catch (err) { alert("Erro ao criar PDF."); }
    }

    async function handleFileSelect(e) {
      const file = e.target.files[0];
      if (!file || file.type !== 'application/pdf') return;
      state.filename = file.name;
      document.getElementById('header-filename').value = file.name;
      try {
        const arrayBuffer = await file.arrayBuffer();
        await loadPdfData(arrayBuffer);
      } catch (err) { alert("Erro ao carregar arquivo."); }
    }

    async function loadPdfData(arrayBuffer) {
      try {
        state.pdfDocLib = await PDFLib.PDFDocument.load(arrayBuffer);
        const typedArray = new Uint8Array(arrayBuffer);
        state.pdfJsDoc = await pdfjsLib.getDocument({ data: typedArray }).promise;
        state.totalPages = state.pdfJsDoc.numPages;

        for(let i=1; i<=state.totalPages; i++) {
          if (!state.edits[i]) state.edits[i] = [];
        }

        document.getElementById('empty-state').classList.add('hidden');
        document.getElementById('editor-ui').classList.remove('hidden');
        document.getElementById('editor-ui').classList.add('flex');

        state.currentPage = 1;
        await renderCurrentPage();
        centerDocument();
        renderThumbnailsDrawer();
      } catch(err) {
        alert("Erro fatal ao processar o PDF.");
        console.error(err);
      }
    }

    // ========================================================================
    // RENDERIZAÇÃO DO PDF
    // ========================================================================
    async function renderCurrentPage() {
      if (!state.pdfJsDoc) return;
      state.selectedElementId = null;
      hideContextMenu();
      
      const page = await state.pdfJsDoc.getPage(state.currentPage);
      const renderScale = 2.0; 
      const viewport = page.getViewport({ scale: renderScale });

      pdfLayer.width = viewport.width;
      pdfLayer.height = viewport.height;

      const cssWidth = viewport.width / renderScale;
      const cssHeight = viewport.height / renderScale;
      container.style.width = `${cssWidth}px`;
      container.style.height = `${cssHeight}px`;

      await page.render({ canvasContext: pdfCtx, viewport }).promise;
      renderOverlayElements();
    }

    // ========================================================================
    // MOTOR PAN & ZOOM (TELA E TOUCH)
    // ========================================================================
    let isPanning = false;
    let startPanX, startPanY;

    function setupPanZoomEngine() {
      workspace.addEventListener('mousedown', (e) => {
        if (state.activeTool === 'pan' || e.button === 1 || e.shiftKey) {
          isPanning = true;
          startPanX = e.clientX - state.panX;
          startPanY = e.clientY - state.panY;
          workspace.style.cursor = 'grabbing';
        } else {
          // Deseleciona se clicar no fundo vazio
          if (e.target === pdfLayer || e.target === overlayLayer) {
            state.selectedElementId = null;
            renderOverlayElements();
            hideContextMenu();
          }
        }
      });

      window.addEventListener('mousemove', (e) => {
        if (!isPanning) return;
        state.panX = e.clientX - startPanX;
        state.panY = e.clientY - startPanY;
        applyTransform();
      });

      window.addEventListener('mouseup', () => {
        isPanning = false;
        workspace.style.cursor = state.activeTool === 'pan' ? 'grab' : 'default';
      });

      workspace.addEventListener('wheel', (e) => {
        if (e.ctrlKey || e.metaKey) {
          e.preventDefault();
          const zoomDelta = e.deltaY < 0 ? 1.1 : 0.9;
          zoomCanvas(zoomDelta, e.clientX, e.clientY);
        } else {
          // Panning com scroll normal
          state.panX -= e.deltaX;
          state.panY -= e.deltaY;
          applyTransform();
        }
      }, { passive: false });
    }

    function zoomCanvas(factor, clientX = null, clientY = null) {
      let newZoom = state.zoom * factor;
      newZoom = Math.max(0.3, Math.min(newZoom, 4.0));
      
      if (clientX === null) {
        const rect = workspace.getBoundingClientRect();
        clientX = rect.left + rect.width / 2;
        clientY = rect.top + rect.height / 2;
      }

      const rect = workspace.getBoundingClientRect();
      const relX = clientX - rect.left;
      const relY = clientY - rect.top;

      state.panX = relX - (relX - state.panX) * (newZoom / state.zoom);
      state.panY = relY - (relY - state.panY) * (newZoom / state.zoom);
      state.zoom = newZoom;
      
      document.getElementById('zoom-level').innerText = `${Math.round(state.zoom * 100)}%`;
      applyTransform();
      updateContextMenuPosition();
    }

    function applyTransform() {
      container.style.transform = `translate(${state.panX}px, ${state.panY}px) scale(${state.zoom})`;
    }

    function centerDocument() {
      const wRect = workspace.getBoundingClientRect();
      const cRect = container.getBoundingClientRect();
      const fitZoom = (wRect.width - 60) / (cRect.width / state.zoom);
      state.zoom = Math.min(fitZoom, 1.2);
      state.panX = (wRect.width - (cRect.width / state.zoom) * state.zoom) / 2;
      state.panY = 30;
      document.getElementById('zoom-level').innerText = `${Math.round(state.zoom * 100)}%`;
      applyTransform();
    }

    function setTool(tool) {
      state.activeTool = tool;
      document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(`tool-${tool}`).classList.add('active');
      workspace.style.cursor = tool === 'pan' ? 'grab' : 'default';
      overlayLayer.style.pointerEvents = tool === 'pan' ? 'none' : 'auto';
    }

    // ========================================================================
    // SISTEMA DE ELEMENTOS HTML (TEXTOS, IMAGENS, FORMAS)
    // ========================================================================
    function getActivePageEdits() {
      return state.edits[state.currentPage] || [];
    }

    function addElement(type) {
      setTool('select');
      const id = crypto.randomUUID();
      const containerRect = container.getBoundingClientRect();
      
      // Adiciona no centro visível da tela
      const centerX = (window.innerWidth / 2 - state.panX) / state.zoom;
      const centerY = (window.innerHeight / 2 - state.panY) / state.zoom;

      let el = { id, type, x: centerX, y: centerY };

      if (type === 'text') {
        el = { ...el, width: 200, height: 40, text: 'Digite seu texto', fontSize: 16, color: '#000000', align: 'left', isBold: false, isItalic: false };
      } else if (type === 'whiteout') {
        el = { ...el, width: 200, height: 50, color: '#ffffff', type: 'rect' }; // Retângulo branco
      }

      state.edits[state.currentPage].push(el);
      state.selectedElementId = id;
      renderOverlayElements();
    }

    async function handleAddImage(e) {
      const file = e.target.files[0];
      if (!file || !file.type.startsWith('image/')) return;
      
      const reader = new FileReader();
      reader.onload = (evt) => {
        const id = crypto.randomUUID();
        const img = new Image();
        img.onload = () => {
          // Redimensiona proporcionalmente para caber na tela
          const ratio = img.width / img.height;
          const w = 200;
          const h = 200 / ratio;
          
          state.edits[state.currentPage].push({
            id, type: 'image', src: evt.target.result,
            x: 50, y: 50, width: w, height: h
          });
          state.selectedElementId = id;
          renderOverlayElements();
        };
        img.src = evt.target.result;
      };
      reader.readAsDataURL(file);
      e.target.value = ''; // Reset input
    }

    function renderOverlayElements() {
      overlayLayer.innerHTML = '';
      const elements = getActivePageEdits();

      elements.forEach(el => {
        const wrapper = document.createElement('div');
        wrapper.className = `pdf-element ${el.id === state.selectedElementId ? 'selected' : ''}`;
        wrapper.style.left = `${el.x}px`;
        wrapper.style.top = `${el.y}px`;
        wrapper.style.width = `${el.width}px`;
        wrapper.style.height = `${el.height}px`;

        // Renderização Específica
        if (el.type === 'text') {
          const div = document.createElement('div');
          div.className = 'pdf-text-content';
          div.style.fontSize = `${el.fontSize}px`;
          div.style.color = el.color;
          div.style.textAlign = el.align;
          div.style.fontWeight = el.isBold ? 'bold' : 'normal';
          div.style.fontStyle = el.isItalic ? 'italic' : 'normal';
          div.innerText = el.text;
          
          // Permite edição de texto fluida com duplo clique
          div.ondblclick = () => {
            div.contentEditable = true;
            div.focus();
            // Desabilita drag temporariamente
            wrapper.onmousedown = null; 
          };
          div.onblur = () => {
            div.contentEditable = false;
            updateElementData(el.id, { text: div.innerText });
            setupDragAndResize(wrapper, el); // Restaura drag
          };
          wrapper.appendChild(div);
        } 
        else if (el.type === 'rect') {
          const rect = document.createElement('div');
          rect.className = 'pdf-rect-content';
          rect.style.backgroundColor = el.color;
          wrapper.appendChild(rect);
        }
        else if (el.type === 'image') {
          const img = document.createElement('img');
          img.className = 'pdf-image-content';
          img.src = el.src;
          wrapper.appendChild(img);
        }

        // Adiciona alças de redimensionamento se estiver selecionado
        if (el.id === state.selectedElementId) {
          ['tl', 'tr', 'bl', 'br'].forEach(pos => {
            const handle = document.createElement('div');
            handle.className = `resize-handle handle-${pos}`;
            handle.onmousedown = (e) => startResize(e, el, pos);
            wrapper.appendChild(handle);
          });
          showContextMenu(el, wrapper);
        }

        // Lógica de Seleção e Arraste
        wrapper.onmousedown = (e) => {
          if (e.target.classList.contains('resize-handle') || e.target.contentEditable === "true") return;
          e.stopPropagation();
          if (state.selectedElementId !== el.id) {
            state.selectedElementId = el.id;
            renderOverlayElements();
          }
          startDrag(e, el);
        };

        overlayLayer.appendChild(wrapper);
      });

      if (!state.selectedElementId) hideContextMenu();
    }

    function updateElementData(id, data) {
      const el = getActivePageEdits().find(e => e.id === id);
      if (el) Object.assign(el, data);
    }

    // ==== MOTOR DE ARRASTE (DRAG) ====
    function startDrag(e, el) {
      let startX = e.clientX;
      let startY = e.clientY;
      let initialX = el.x;
      let initialY = el.y;

      function onMouseMove(ev) {
        const dx = (ev.clientX - startX) / state.zoom;
        const dy = (ev.clientY - startY) / state.zoom;
        updateElementData(el.id, { x: initialX + dx, y: initialY + dy });
        renderOverlayElements();
      }
      function onMouseUp() {
        document.removeEventListener('mousemove', onMouseMove);
        document.removeEventListener('mouseup', onMouseUp);
      }
      document.addEventListener('mousemove', onMouseMove);
      document.addEventListener('mouseup', onMouseUp);
    }

    // ==== MOTOR DE REDIMENSIONAMENTO (RESIZE) ====
    function startResize(e, el, handle) {
      e.stopPropagation();
      let startX = e.clientX;
      let startY = e.clientY;
      let initialW = el.width;
      let initialH = el.height;
      let initialX = el.x;
      let initialY = el.y;

      function onMouseMove(ev) {
        const dx = (ev.clientX - startX) / state.zoom;
        const dy = (ev.clientY - startY) / state.zoom;

        let newW = initialW, newH = initialH, newX = initialX, newY = initialY;

        if (handle.includes('r')) newW = Math.max(20, initialW + dx);
        if (handle.includes('l')) { newW = Math.max(20, initialW - dx); newX = initialX + (initialW - newW); }
        if (handle.includes('b')) newH = Math.max(20, initialH + dy);
        if (handle.includes('t')) { newH = Math.max(20, initialH - dy); newY = initialY + (initialH - newH); }

        updateElementData(el.id, { x: newX, y: newY, width: newW, height: newH });
        renderOverlayElements();
      }
      function onMouseUp() {
        document.removeEventListener('mousemove', onMouseMove);
        document.removeEventListener('mouseup', onMouseUp);
      }
      document.addEventListener('mousemove', onMouseMove);
      document.addEventListener('mouseup', onMouseUp);
    }

    // ==== MENU CONTEXTUAL FLUTUANTE ====
    function showContextMenu(el, domWrapper) {
      const rect = domWrapper.getBoundingClientRect();
      const workspaceRect = workspace.getBoundingClientRect();
      
      // Posiciona acima do elemento
      let top = rect.top - workspaceRect.top - 50;
      let left = rect.left - workspaceRect.left + (rect.width / 2);

      // Previne sair da tela
      top = Math.max(10, top);

      contextMenu.style.top = `${top}px`;
      contextMenu.style.left = `${left}px`;
      contextMenu.style.transform = `translateX(-50%)`;
      contextMenu.classList.add('active');

      // Atualiza painéis baseados no tipo
      document.getElementById('ctx-text-tools').classList.toggle('hidden', el.type !== 'text');
      
      // Atualiza valores atuais no UI do menu
      if (el.type === 'text') {
        document.getElementById('ctx-font-size').value = el.fontSize;
        document.getElementById('ctx-bold').classList.toggle('active', el.isBold);
        document.getElementById('ctx-italic').classList.toggle('active', el.isItalic);
      }
      
      if (el.color) {
        document.getElementById('ctx-color').value = el.color;
        document.getElementById('ctx-color-preview').style.backgroundColor = el.color;
      }
    }

    function hideContextMenu() {
      contextMenu.classList.remove('active');
    }

    function updateSelectedElement(props) {
      if (state.selectedElementId) {
        updateElementData(state.selectedElementId, props);
        renderOverlayElements();
      }
    }

    function toggleElementStyle(prop) {
      if (state.selectedElementId) {
        const el = getActivePageEdits().find(e => e.id === state.selectedElementId);
        if (el) updateSelectedElement({ [prop]: !el[prop] });
      }
    }

    function deleteSelectedElement() {
      if (state.selectedElementId) {
        state.edits[state.currentPage] = state.edits[state.currentPage].filter(e => e.id !== state.selectedElementId);
        state.selectedElementId = null;
        renderOverlayElements();
      }
    }

    // ==== PAINEL LATERAL DE PÁGINAS ====
    function toggleDrawer(show) {
      const drawer = document.getElementById('pages-drawer');
      const backdrop = document.getElementById('drawer-backdrop');
      if (show) {
        backdrop.classList.remove('hidden');
        drawer.classList.remove('drawer-closed');
        drawer.classList.add('drawer-open');
      } else {
        backdrop.classList.add('hidden');
        drawer.classList.remove('drawer-open');
        drawer.classList.add('drawer-closed');
      }
    }

    async function addBlankPageToDoc(orientation) {
      const size = orientation === 'portrait' ? [595.28, 841.89] : [841.89, 595.28];
      state.pdfDocLib.addPage(size);
      
      const newBytes = await state.pdfDocLib.save();
      await loadPdfData(newBytes);
      
      state.currentPage = state.totalPages; // Vai pra última página
      await renderCurrentPage();
      centerDocument();
      renderThumbnailsDrawer();
    }

    async function renderThumbnailsDrawer() {
      const container = document.getElementById('thumbnails-container');
      container.innerHTML = '';

      for (let i = 1; i <= state.totalPages; i++) {
        const wrapper = document.createElement('div');
        const isActive = i === state.currentPage;
        
        wrapper.className = `p-2 rounded-xl flex flex-col gap-2 transition-colors cursor-pointer border ${isActive ? 'bg-blue-500/20 border-blue-500/50' : 'bg-white/[0.02] border-white/5 hover:bg-white/[0.08]'}`;
        
        wrapper.onclick = async () => {
          state.currentPage = i;
          await renderCurrentPage();
          centerDocument();
          toggleDrawer(false); 
          renderThumbnailsDrawer();
        };

        const canvasId = `thumb-page-${i}`;

        wrapper.innerHTML = `
          <div class="flex items-center justify-between text-zinc-400">
            <span class="text-xs font-semibold ${isActive ? 'text-white' : 'text-zinc-400'}">Página ${i}</span>
            <div class="flex items-center gap-1.5">
              <button onclick="event.stopPropagation(); deletePage(${i})" class="hover:text-red-400 p-1.5 rounded-md hover:bg-red-500/20 transition-colors" title="Excluir Página"><i class="ph-bold ph-trash"></i></button>
            </div>
          </div>
          <div class="w-full aspect-[1/1.4] bg-white rounded-lg flex items-center justify-center overflow-hidden pointer-events-none shadow-inner border border-zinc-200 relative">
             <canvas id="${canvasId}" class="w-full h-auto block"></canvas>
          </div>
        `;
        container.appendChild(wrapper);

        state.pdfJsDoc.getPage(i).then(page => {
            const canvas = document.getElementById(canvasId);
            if(!canvas) return;
            const ctx = canvas.getContext('2d');
            const baseViewport = page.getViewport({ scale: 1 });
            const thumbScale = 180 / baseViewport.width; 
            const viewport = page.getViewport({ scale: thumbScale });
            canvas.width = viewport.width;
            canvas.height = viewport.height;
            page.render({ canvasContext: ctx, viewport });
        });
      }
    }

    async function deletePage(pageNum) {
      if (state.totalPages <= 1) { alert("O PDF precisa ter pelo menos 1 página."); return; }
      if (!confirm(`Remover página ${pageNum}?`)) return;

      state.pdfDocLib.removePage(pageNum - 1);
      
      // Shift edits
      for (let i = pageNum; i < state.totalPages; i++) {
        state.edits[i] = state.edits[i+1];
      }
      delete state.edits[state.totalPages];

      const newBytes = await state.pdfDocLib.save();
      state.pdfJsDoc = await pdfjsLib.getDocument({ data: newBytes.slice(0) }).promise;
      state.totalPages = state.pdfJsDoc.numPages;

      if (state.currentPage > state.totalPages) state.currentPage = state.totalPages;

      renderThumbnailsDrawer();
      await renderCurrentPage();
    }

    // ========================================================================
    // EXPORTAÇÃO FINAL PARA O PDF NATIVO VIA PDF-LIB
    // ========================================================================
    async function exportFinalPDF() {
      if (!state.pdfDocLib) return;
      document.getElementById('sync-status').innerText = "Gerando PDF...";

      try {
        const helveticaFont = await state.pdfDocLib.embedFont(PDFLib.StandardFonts.Helvetica);
        const helveticaBold = await state.pdfDocLib.embedFont(PDFLib.StandardFonts.HelveticaBold);
        const helveticaOblique = await state.pdfDocLib.embedFont(PDFLib.StandardFonts.HelveticaOblique);
        const helveticaBoldOblique = await state.pdfDocLib.embedFont(PDFLib.StandardFonts.HelveticaBoldOblique);

        for (let i = 1; i <= state.totalPages; i++) {
          const elements = state.edits[i];
          if (!elements || elements.length === 0) continue;

          const page = state.pdfDocLib.getPage(i - 1);
          const { width, height } = page.getSize();
          
          // Precisamos da escala original para mapear coordenadas HTML px para PDF points
          const pdfJsPage = await state.pdfJsDoc.getPage(i);
          const viewport = pdfJsPage.getViewport({ scale: 1 });
          const scaleX = width / viewport.width;
          const scaleY = height / viewport.height;

          for (const el of elements) {
            // Conversão de coordenadas (Atenção: PDF-lib tem origem Y no fundo esquerdo, HTML no topo esquerdo)
            const pdfX = el.x * scaleX;
            const pdfY = height - ((el.y + el.height) * scaleY);
            const pdfW = el.width * scaleX;
            const pdfH = el.height * scaleY;

            // Extrair RGB do Hex (#RRGGBB)
            const rgb = hexToRgb(el.color || '#000000');

            if (el.type === 'rect') {
              page.drawRectangle({
                x: pdfX, y: pdfY, width: pdfW, height: pdfH,
                color: PDFLib.rgb(rgb.r, rgb.g, rgb.b),
                borderWidth: 0
              });
            } 
            else if (el.type === 'image') {
              const imgBytes = await fetch(el.src).then(res => res.arrayBuffer());
              let embeddedImg;
              if (el.src.includes('png') || el.src.startsWith('data:image/png')) {
                embeddedImg = await state.pdfDocLib.embedPng(imgBytes);
              } else {
                embeddedImg = await state.pdfDocLib.embedJpg(imgBytes);
              }
              page.drawImage(embeddedImg, { x: pdfX, y: pdfY, width: pdfW, height: pdfH });
            }
            else if (el.type === 'text') {
              let fontToUse = helveticaFont;
              if (el.isBold && el.isItalic) fontToUse = helveticaBoldOblique;
              else if (el.isBold) fontToUse = helveticaBold;
              else if (el.isItalic) fontToUse = helveticaOblique;

              // Em PDF-lib, o Y da fonte é a linha de base (baseline). Precisamos ajustar o offsetY.
              // Simulando que a baseline fica próxima ao topo + tamanho da fonte.
              const baselineY = height - (el.y * scaleY) - (el.fontSize * scaleY * 0.8);

              // Para alinhar o texto, precisaríamos medir a largura da string na fonte, mas para simplificar, 
              // vamos desenhar a partir da esquerda respeitando o padding.
              page.drawText(el.text, {
                x: pdfX,
                y: baselineY,
                size: el.fontSize * scaleY, // Ajusta o tamanho da fonte proporcionalmente
                font: fontToUse,
                color: PDFLib.rgb(rgb.r, rgb.g, rgb.b),
                lineHeight: (el.fontSize * 1.2) * scaleY,
                maxWidth: pdfW // Quebra de linha automática do pdf-lib
              });
            }
          }
        }

        const finalBytes = await state.pdfDocLib.save();
        const blob = new Blob([finalBytes], { type: 'application/pdf' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = state.filename;
        link.click();

        document.getElementById('sync-status').innerText = "Pronto";
      } catch (err) {
        alert("Erro ao exportar o PDF.");
        console.error(err);
      }
    }

    function hexToRgb(hex) {
      const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
      return result ? {
        r: parseInt(result[1], 16) / 255,
        g: parseInt(result[2], 16) / 255,
        b: parseInt(result[3], 16) / 255
      } : { r: 0, g: 0, b: 0 };
    }

    initEditor();
  </script>
