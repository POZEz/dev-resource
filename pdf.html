<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editor de PDF Profissional</title>

  <!-- Bibliotecas Base -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  
  <!-- Fontes -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Courier+Prime&family=Georgia&family=Times+New+Roman&display=swap" rel="stylesheet">

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            matte: { bg: '#09090b', card: '#121214', border: '#27272a', text: '#fafafa', muted: '#a1a1aa' }
          }
        }
      }
    }
  </script>

  <style>
    body, html { 
      margin: 0; padding: 0; width: 100%; height: 100%; 
      background-color: #09090b; color: #fafafa; 
      overflow: hidden; user-select: none;
    }
    
    .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scroll::-webkit-scrollbar-track { background: transparent; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #27272a; border-radius: 99px; }
    .custom-scroll::-webkit-scrollbar-thumb:hover { background: #3f3f46; }

    /* =========================================================
       ARQUITETURA DE VIEWPORT E ENQUADRAMENTO
       ========================================================= */
    #workspace {
      position: absolute;
      top: 48px; /* Altura do Header */
      bottom: 0; left: 240px; right: 0; /* Left reserva espaço pro painel lateral se aberto */
      overflow: hidden;
      background-color: #121214;
      cursor: default;
    }

    #workspace.is-panning { cursor: grabbing !important; }
    #workspace.is-drawing { cursor: crosshair !important; }

    /* Container de Transformação (Zoom/Pan aplicados via matriz CSS) */
    #transform-wrapper {
      position: absolute;
      transform-origin: 0 0;
      /* Margem visual adicionada via cálculo de pan inicial */
    }

    /* O Documento Lógico Base (1:1 com os Pontos do PDF) */
    #logical-document {
      position: relative;
      background: #ffffff;
      box-shadow: 0 4px 24px rgba(0,0,0,0.5);
      /* Dimensões definidas via JS */
    }

    /* Camadas do Documento Lógico */
    canvas.render-layer {
      position: absolute; top: 0; left: 0;
      pointer-events: none;
      /* CSS width/height = 100%, Canvas width/height = High Res */
      width: 100%; height: 100%;
    }

    #overlay-layer {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: auto; /* Permite interação com objetos */
    }

    /* =========================================================
       ELEMENTOS EDITÁVEIS
       ========================================================= */
    .pdf-object {
      position: absolute;
      box-sizing: border-box;
      pointer-events: auto;
      cursor: move;
      transform-origin: 0 0;
    }

    .pdf-object.selected {
      outline: 1.5px solid #3b82f6; /* Azul Tailwind */
    }

    /* Texto */
    .obj-text {
      width: 100%; height: 100%;
      outline: none;
      white-space: pre-wrap;
      word-wrap: break-word;
      line-height: 1.2;
      padding: 2px;
      color: #000;
      cursor: text;
    }
    
    /* Alças de Redimensionamento */
    .resize-handle {
      position: absolute;
      width: 8px; height: 8px;
      background: #fff;
      border: 1px solid #3b82f6;
      border-radius: 50%;
      display: none;
      z-index: 10;
    }
    .pdf-object.selected .resize-handle { display: block; }
    
    .handle-nw { top: -4px; left: -4px; cursor: nwse-resize; }
    .handle-n  { top: -4px; left: calc(50% - 4px); cursor: ns-resize; }
    .handle-ne { top: -4px; right: -4px; cursor: nesw-resize; }
    .handle-e  { top: calc(50% - 4px); right: -4px; cursor: ew-resize; }
    .handle-se { bottom: -4px; right: -4px; cursor: nwse-resize; }
    .handle-s  { bottom: -4px; left: calc(50% - 4px); cursor: ns-resize; }
    .handle-sw { bottom: -4px; left: -4px; cursor: nesw-resize; }
    .handle-w  { top: calc(50% - 4px); left: -4px; cursor: ew-resize; }

    /* =========================================================
       MENU CONTEXTUAL INTELIGENTE
       ========================================================= */
    #context-menu {
      position: fixed; /* Fixo em relação a janela pra não escalar com o zoom */
      background: #1c1c1e;
      border: 1px solid #27272a;
      border-radius: 8px;
      padding: 4px;
      display: flex;
      align-items: center;
      gap: 4px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s ease;
    }
    #context-menu.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .ctx-btn {
      padding: 4px; border-radius: 4px; color: #a1a1aa; cursor: pointer;
    }
    .ctx-btn:hover { background: #27272a; color: #fff; }
    .ctx-btn.active { color: #3b82f6; background: rgba(59, 130, 246, 0.1); }
    
    .ctx-divider { width: 1px; height: 16px; background: #3f3f46; margin: 0 4px; }

    /* =========================================================
       INTERFACE (SIDEBAR / HEADER)
       ========================================================= */
    #sidebar {
      position: absolute;
      top: 48px; bottom: 0; left: 0; width: 240px;
      background: #09090b; border-right: 1px solid #27272a;
      display: flex; flex-direction: column;
      z-index: 40;
    }
    .thumbnail {
      width: 100%; border: 2px solid transparent; border-radius: 6px; cursor: pointer;
      margin-bottom: 8px; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }
    .thumbnail.active { border-color: #3b82f6; }
  </style>
</head>
<body>

  <!-- -->
  <!-- ESTADO VAZIO -->
  <div id="empty-state" class="absolute inset-0 z-50 flex flex-col items-center justify-center bg-matte-bg px-6">
    <div class="w-16 h-16 rounded-2xl bg-white/[0.03] border border-white/10 flex items-center justify-center text-zinc-500 mb-5 shadow-2xl">
      <i class="ph-fill ph-file-pdf text-3xl"></i>
    </div>
    <h2 class="text-lg font-bold text-white mb-6">Editor de PDF Profissional</h2>
    
    <div class="flex items-center gap-3">
      <label class="px-5 py-2.5 rounded-lg bg-blue-600 hover:bg-blue-500 text-white font-semibold text-xs cursor-pointer shadow-lg transition-colors">
        Abrir Arquivo PDF
        <input type="file" id="file-upload" accept="application/pdf" class="hidden" onchange="App.loadPDF(event)">
      </label>
      <button onclick="App.createBlankPDF()" class="px-5 py-2.5 rounded-lg bg-white/[0.05] border border-white/10 hover:bg-white/[0.1] text-white font-semibold text-xs transition-colors">
        Novo em Branco
      </button>
    </div>
  </div>

  <!-- EDITOR UI -->
  <div id="editor-ui" class="hidden h-full w-full relative">
    
    <!-- HEADER -->
    <header class="h-12 bg-matte-card border-b border-matte-border flex items-center justify-between px-4 absolute top-0 w-full z-50">
      <div class="flex items-center gap-4">
        <span id="doc-title" class="text-xs font-bold text-zinc-200">documento.pdf</span>
        <div class="h-4 w-px bg-zinc-700"></div>
        
        <!-- Ferramentas Globais (Não poluem o context menu) -->
        <div class="flex items-center gap-1">
          <button onclick="App.setMode('select')" id="btn-mode-select" class="ctx-btn active" title="Selecionar (V)"><i class="ph-bold ph-cursor"></i></button>
          <button onclick="App.setMode('draw')" id="btn-mode-draw" class="ctx-btn" title="Caneta Livre (D)"><i class="ph-bold ph-pencil-simple"></i></button>
          <button onclick="App.addTextObject()" class="ctx-btn" title="Inserir Texto (T)"><i class="ph-bold ph-text-t"></i></button>
          <button onclick="App.addRectObject()" class="ctx-btn" title="Inserir Retângulo (R)"><i class="ph-bold ph-square"></i></button>
          <button onclick="App.addWhiteoutObject()" class="ctx-btn" title="Apagador / Whiteout"><i class="ph-bold ph-eraser"></i></button>
          <label class="ctx-btn cursor-pointer" title="Inserir Imagem (I)">
            <i class="ph-bold ph-image"></i>
            <input type="file" accept="image/*" class="hidden" onchange="App.addImageObject(event)">
          </label>
        </div>
      </div>

      <div class="flex items-center gap-3">
        <!-- Controles de Zoom -->
        <div class="flex items-center gap-1 bg-black/50 rounded-lg p-1 border border-zinc-800">
          <button onclick="App.View.zoomOut()" class="ctx-btn"><i class="ph-bold ph-minus"></i></button>
          <span id="zoom-indicator" class="text-[11px] font-mono w-10 text-center text-zinc-400">100%</span>
          <button onclick="App.View.zoomIn()" class="ctx-btn"><i class="ph-bold ph-plus"></i></button>
          <div class="ctx-divider"></div>
          <button onclick="App.View.fitPage()" class="ctx-btn text-[10px] font-bold px-2">Fit Pg</button>
          <button onclick="App.View.fitWidth()" class="ctx-btn text-[10px] font-bold px-2">Fit W</button>
        </div>

        <button onclick="App.Export.savePDF()" class="px-4 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs flex items-center gap-1.5 transition-colors">
          <i class="ph-bold ph-download-simple"></i> Salvar PDF
        </button>
      </div>
    </header>

    <!-- SIDEBAR (Thumbnails) -->
    <aside id="sidebar">
      <div class="flex items-center justify-between p-3 border-b border-matte-border">
        <span class="text-xs font-bold text-zinc-400">Páginas</span>
        <button onclick="App.addBlankPage()" class="text-blue-400 hover:text-blue-300 text-xs font-bold"><i class="ph-bold ph-plus"></i></button>
      </div>
      <div id="thumbnails-container" class="flex-1 overflow-y-auto p-3 custom-scroll"></div>
    </aside>

    <!-- WORKSPACE -->
    <main id="workspace">
      <div id="transform-wrapper">
        <div id="logical-document">
          <!-- Renderização nativa do PDF -->
          <canvas id="pdf-render-canvas" class="render-layer"></canvas>
          <!-- Traços de caneta -->
          <canvas id="draw-render-canvas" class="render-layer"></canvas>
          <!-- Objetos Interativos -->
          <div id="overlay-layer"></div>
        </div>
      </div>
    </main>

    <!-- MENU CONTEXTUAL INTELIGENTE FLUTUANTE -->
    <div id="context-menu">
      <!-- Injetado dinamicamente dependendo do objeto -->
    </div>

  </div>

  <!-- -->
  <script>
    /**
     * ARQUITETURA CORE DO EDITOR DE PDF
     * Separação rigorosa entre Lógica (PDF Points), Viewport (Pixels/Escala) e Renderização.
     */
    const App = {
      State: {
        pdfDoc: null,      // Instância pdf-lib (dados brutos para exportação)
        pdfJs: null,       // Instância pdf.js (renderização visual)
        filename: 'doc.pdf',
        numPages: 0,
        currentPage: 1,
        
        // Dimensões lógicas da página atual (1:1 com pt do PDF)
        logicalWidth: 0,
        logicalHeight: 0,

        // Interação
        mode: 'select', // 'select' ou 'draw'
        selectedId: null,
        
        // Histórico por página: edits[pageNum] = { objects: [], paths: [] }
        edits: {},
        history: { past: [], future: [] }
      },

      View: {
        zoom: 1.0,
        panX: 0,
        panY: 0,
        isPanning: false,
        spacePressed: false
      },

      UI: {
        workspace: document.getElementById('workspace'),
        transformWrapper: document.getElementById('transform-wrapper'),
        logicalDoc: document.getElementById('logical-document'),
        pdfCanvas: document.getElementById('pdf-render-canvas'),
        drawCanvas: document.getElementById('draw-render-canvas'),
        overlay: document.getElementById('overlay-layer'),
        ctxMenu: document.getElementById('context-menu')
      }
    };

    // =========================================================
    // 1. GERENCIAMENTO DE COORDENADAS
    // =========================================================
    const Coords = {
      // Converte evento de mouse (tela) para coordenada lógica (PDF point)
      screenToLogical(clientX, clientY) {
        const rect = App.UI.workspace.getBoundingClientRect();
        // Mouse relativo ao workspace
        const relX = clientX - rect.left;
        const relY = clientY - rect.top;
        
        // Remove pan e zoom
        const logicalX = (relX - App.View.panX) / App.View.zoom;
        const logicalY = (relY - App.View.panY) / App.View.zoom;
        return { x: logicalX, y: logicalY };
      },

      // Converte coordenada lógica para posição CSS absoluta na tela (útil pro context menu)
      logicalToScreen(logicalX, logicalY) {
        const rect = App.UI.workspace.getBoundingClientRect();
        const screenX = rect.left + App.View.panX + (logicalX * App.View.zoom);
        const screenY = rect.top + App.View.panY + (logicalY * App.View.zoom);
        return { x: screenX, y: screenY };
      },

      // Pega o centro da área VISÍVEL em coordenadas lógicas
      getVisibleCenterLogical() {
        const rect = App.UI.workspace.getBoundingClientRect();
        const centerX = rect.width / 2;
        const centerY = rect.height / 2;
        return this.screenToLogical(rect.left + centerX, rect.top + centerY);
      }
    };

    // =========================================================
    // 2. ENQUADRAMENTO E ZOOM (VIEWPORT)
    // =========================================================
    App.View.applyTransform = function() {
      App.UI.transformWrapper.style.transform = `translate(${this.panX}px, ${this.panY}px) scale(${this.zoom})`;
      document.getElementById('zoom-indicator').innerText = `${Math.round(this.zoom * 100)}%`;
      App.ContextMenu.updatePosition();
    };

    App.View.fitPage = function() {
      const rect = App.UI.workspace.getBoundingClientRect();
      const pad = 40; // margem segura
      const scaleX = (rect.width - pad) / App.State.logicalWidth;
      const scaleY = (rect.height - pad) / App.State.logicalHeight;
      this.zoom = Math.min(scaleX, scaleY);
      
      // Centraliza
      this.panX = (rect.width - (App.State.logicalWidth * this.zoom)) / 2;
      this.panY = (rect.height - (App.State.logicalHeight * this.zoom)) / 2;
      this.applyTransform();
    };

    App.View.fitWidth = function() {
      const rect = App.UI.workspace.getBoundingClientRect();
      const pad = 60;
      this.zoom = (rect.width - pad) / App.State.logicalWidth;
      this.panX = pad / 2;
      this.panY = 20;
      this.applyTransform();
    };

    App.View.zoomToCursor = function(delta, cursorX, cursorY) {
      const rect = App.UI.workspace.getBoundingClientRect();
      const cX = cursorX - rect.left;
      const cY = cursorY - rect.top;

      // Ponto lógico sob o cursor ANTES do zoom
      const logicalX = (cX - this.panX) / this.zoom;
      const logicalY = (cY - this.panY) / this.zoom;

      // Limites de zoom (25% a 400%)
      let newZoom = this.zoom * delta;
      newZoom = Math.max(0.25, Math.min(newZoom, 4.0));

      // Ajusta o Pan para que o ponto lógico continue sob o cursor
      this.panX = cX - (logicalX * newZoom);
      this.panY = cY - (logicalY * newZoom);
      this.zoom = newZoom;
      this.applyTransform();
    };

    App.View.zoomIn = function() { this.zoomToCursor(1.2, window.innerWidth/2, window.innerHeight/2); };
    App.View.zoomOut = function() { this.zoomToCursor(0.8, window.innerWidth/2, window.innerHeight/2); };

    //    // =========================================================
    // 3. EVENTOS GLOBAIS (PAN, ZOOM, SELEÇÃO)
    // =========================================================
    function setupGlobalEvents() {
      // Spacebar para Mãozinha
      window.addEventListener('keydown', (e) => {
        if (e.code === 'Space' && document.activeElement.tagName !== 'INPUT' && !document.activeElement.isContentEditable) {
          e.preventDefault();
          App.View.spacePressed = true;
          App.UI.workspace.classList.add('is-panning');
        }
        
        // Atalhos de Ferramentas
        if (!document.activeElement.isContentEditable && document.activeElement.tagName !== 'INPUT') {
          if (e.key.toLowerCase() === 'v') App.setMode('select');
          if (e.key.toLowerCase() === 'd') App.setMode('draw');
          if (e.key.toLowerCase() === 't') App.addTextObject();
          if (e.key.toLowerCase() === 'r') App.addRectObject();
          
          // Delete / Backspace (Proteção)
          if (e.key === 'Delete' || e.key === 'Backspace') {
            App.Engine.deleteSelected();
          }

          // Undo / Redo
          if (e.ctrlKey && e.key.toLowerCase() === 'z') { e.preventDefault(); App.History.undo(); }
          if (e.ctrlKey && e.key.toLowerCase() === 'y') { e.preventDefault(); App.History.redo(); }
        }
      });

      window.addEventListener('keyup', (e) => {
        if (e.code === 'Space') {
          App.View.spacePressed = false;
          App.UI.workspace.classList.remove('is-panning');
        }
      });

      // Roda do Mouse (Zoom + Pan vertical)
      App.UI.workspace.addEventListener('wheel', (e) => {
        e.preventDefault();
        if (e.ctrlKey) {
          const delta = e.deltaY < 0 ? 1.1 : 0.9;
          App.View.zoomToCursor(delta, e.clientX, e.clientY);
        } else {
          // Pan via trackpad/scroll
          App.View.panX -= e.deltaX;
          App.View.panY -= e.deltaY;
          App.View.applyTransform();
        }
      }, { passive: false });

      // Eventos de Mouse Base no Workspace
      let startPanX, startPanY;
      let isDrawing = false;
      let currentPath = [];

      App.UI.workspace.addEventListener('mousedown', (e) => {
        // Pan com Botão do Meio ou Espaço
        if (e.button === 1 || App.View.spacePressed) {
          e.preventDefault();
          App.View.isPanning = true;
          startPanX = e.clientX - App.View.panX;
          startPanY = e.clientY - App.View.panY;
          return;
        }

        // Se clicou no fundo vazio (não num objeto e não numa alça)
        if (e.target === App.UI.workspace || e.target === App.UI.overlay || e.target === App.UI.drawCanvas) {
          
          if (App.State.mode === 'select') {
            App.Engine.selectObject(null); // Desmarca
          } 
          else if (App.State.mode === 'draw') {
            isDrawing = true;
            const pt = Coords.screenToLogical(e.clientX, e.clientY);
            currentPath = [{ x: pt.x, y: pt.y }];
            const ctx = App.UI.drawCanvas.getContext('2d');
            ctx.beginPath();
            ctx.strokeStyle = '#ff0000';
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
            // Multiplica pelo devicePixelRatio (renderScale) pro canvas HQ
            const scale = 2.0; 
            ctx.moveTo(pt.x * scale, pt.y * scale);
          }
        }
      });

      window.addEventListener('mousemove', (e) => {
        if (App.View.isPanning) {
          App.View.panX = e.clientX - startPanX;
          App.View.panY = e.clientY - startPanY;
          App.View.applyTransform();
        }
        else if (isDrawing) {
          const pt = Coords.screenToLogical(e.clientX, e.clientY);
          currentPath.push({ x: pt.x, y: pt.y });
          const ctx = App.UI.drawCanvas.getContext('2d');
          const scale = 2.0;
          ctx.lineTo(pt.x * scale, pt.y * scale);
          ctx.stroke();
        }
      });

      window.addEventListener('mouseup', () => {
        App.View.isPanning = false;
        if (isDrawing && currentPath.length > 1) {
          App.History.saveState();
          App.State.edits[App.State.currentPage].paths.push({ points: currentPath, color: '#ff0000', width: 3 });
          isDrawing = false;
        }
      });
    }

    App.setMode = function(mode) {
      this.State.mode = mode;
      document.querySelectorAll('header .ctx-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(`btn-mode-${mode}`)?.classList.add('active');
      this.UI.workspace.classList.toggle('is-drawing', mode === 'draw');
      if (mode === 'draw') this.Engine.selectObject(null);
    };

    //    // =========================================================
    // 4. CARREGAMENTO E RENDERIZAÇÃO DE PDF
    // =========================================================
    App.createBlankPDF = async function() {
      const doc = await PDFLib.PDFDocument.create();
      doc.addPage([595.28, 841.89]); // A4
      const bytes = await doc.save();
      this.loadPdfBytes(bytes, 'Documento em Branco.pdf');
    };

    App.loadPDF = async function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const bytes = new Uint8Array(await file.arrayBuffer());
      this.loadPdfBytes(bytes, file.name);
    };

    App.loadPdfBytes = async function(bytes, filename) {
      this.State.filename = filename;
      document.getElementById('doc-title').innerText = filename;

      this.State.pdfDoc = await PDFLib.PDFDocument.load(bytes);
      this.State.pdfJs = await pdfjsLib.getDocument({ data: bytes }).promise;
      this.State.numPages = this.State.pdfJs.numPages;

      // Inicia state das páginas
      for (let i = 1; i <= this.State.numPages; i++) {
        if(!this.State.edits[i]) this.State.edits[i] = { objects: [], paths: [] };
      }

      document.getElementById('empty-state').classList.add('hidden');
      document.getElementById('editor-ui').classList.remove('hidden');

      this.State.currentPage = 1;
      await this.renderPage();
      this.View.fitPage();
      this.renderThumbnails();
      App.History.saveState(); // Estado inicial
    };

    App.renderPage = async function() {
      const page = await this.State.pdfJs.getPage(this.State.currentPage);
      
      // Define tamanho Lógico
      const viewportLogical = page.getViewport({ scale: 1 });
      this.State.logicalWidth = viewportLogical.width;
      this.State.logicalHeight = viewportLogical.height;

      // Ajusta CSS do documento base
      this.UI.logicalDoc.style.width = `${this.State.logicalWidth}px`;
      this.UI.logicalDoc.style.height = `${this.State.logicalHeight}px`;

      // Renderiza High Res (Escala 2.0)
      const renderScale = window.devicePixelRatio || 2.0;
      const viewportRender = page.getViewport({ scale: renderScale });
      
      this.UI.pdfCanvas.width = viewportRender.width;
      this.UI.pdfCanvas.height = viewportRender.height;
      this.UI.drawCanvas.width = viewportRender.width;
      this.UI.drawCanvas.height = viewportRender.height;

      const ctx = this.UI.pdfCanvas.getContext('2d');
      await page.render({ canvasContext: ctx, viewport: viewportRender }).promise;

      this.Engine.redrawPaths();
      this.Engine.renderOverlayObjects();
      this.Engine.selectObject(null);
    };

    App.renderThumbnails = async function() {
      const container = document.getElementById('thumbnails-container');
      container.innerHTML = '';
      
      for (let i = 1; i <= this.State.numPages; i++) {
        const thumb = document.createElement('div');
        thumb.className = `thumbnail ${i === this.State.currentPage ? 'active' : ''}`;
        thumb.style.aspectRatio = `${this.State.logicalWidth}/${this.State.logicalHeight}`;
        thumb.onclick = () => {
          this.State.currentPage = i;
          this.renderPage();
          this.renderThumbnails();
        };
        container.appendChild(thumb);
      }
    };

    //    // =========================================================
    // 5. MOTOR DE OBJETOS LÓGICOS (DOM OVERLAY)
    // =========================================================
    App.Engine = {
      
      // Redesenha caminhos (Draw)
      redrawPaths() {
        const ctx = App.UI.drawCanvas.getContext('2d');
        const scale = window.devicePixelRatio || 2.0;
        ctx.clearRect(0, 0, App.UI.drawCanvas.width, App.UI.drawCanvas.height);
        
        const paths = App.State.edits[App.State.currentPage].paths;
        paths.forEach(p => {
          if (p.points.length < 2) return;
          ctx.beginPath();
          ctx.strokeStyle = p.color;
          ctx.lineWidth = p.width * scale;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          ctx.moveTo(p.points[0].x * scale, p.points[0].y * scale);
          for (let i = 1; i < p.points.length; i++) {
            ctx.lineTo(p.points[i].x * scale, p.points[i].y * scale);
          }
          ctx.stroke();
        });
      },

      // Renderiza Objetos DOM baseados no estado lógico
      renderOverlayObjects() {
        App.UI.overlay.innerHTML = '';
        const objects = App.State.edits[App.State.currentPage].objects;

        objects.forEach(obj => {
          const wrapper = document.createElement('div');
          wrapper.className = `pdf-object ${obj.id === App.State.selectedId ? 'selected' : ''}`;
          wrapper.id = obj.id;
          
          // Posicionamento e Tamanho em PONTOS LÓGICOS (A escala do CSS resolve o zoom visual)
          wrapper.style.left = `${obj.x}px`;
          wrapper.style.top = `${obj.y}px`;
          wrapper.style.width = `${obj.w}px`;
          wrapper.style.height = `${obj.h}px`;
          wrapper.style.zIndex = obj.z || 10;

          if (obj.type === 'text') {
            const txt = document.createElement('div');
            txt.className = 'obj-text';
            txt.style.fontFamily = obj.font || 'Helvetica';
            txt.style.fontSize = `${obj.size}px`;
            txt.style.color = obj.color || '#000000';
            txt.style.textAlign = obj.align || 'left';
            txt.style.fontWeight = obj.bold ? 'bold' : 'normal';
            txt.style.fontStyle = obj.italic ? 'italic' : 'normal';
            txt.innerText = obj.text;
            
            // Foco para edição
            txt.ondblclick = () => { txt.contentEditable = true; txt.focus(); };
            txt.onblur = () => {
              txt.contentEditable = false;
              if (obj.text !== txt.innerText) {
                App.History.saveState();
                obj.text = txt.innerText;
              }
            };
            wrapper.appendChild(txt);
          } 
          else if (obj.type === 'rect') {
            wrapper.style.backgroundColor = obj.fill || 'transparent';
            wrapper.style.border = `${obj.borderW || 1}px solid ${obj.color || '#000'}`;
            if (obj.isWhiteout) {
              wrapper.style.backgroundColor = '#ffffff';
              wrapper.style.border = 'none';
            }
          }
          else if (obj.type === 'image') {
            const img = document.createElement('img');
            img.src = obj.src;
            img.style.width = '100%'; img.style.height = '100%';
            img.style.objectFit = 'fill';
            img.draggable = false;
            wrapper.appendChild(img);
          }

          // Se estiver selecionado, adiciona handles de resize
          if (obj.id === App.State.selectedId) {
            ['nw','n','ne','e','se','s','sw','w'].forEach(dir => {
              const handle = document.createElement('div');
              handle.className = `resize-handle handle-${dir}`;
              handle.onmousedown = (e) => this.startResize(e, obj, dir);
              wrapper.appendChild(handle);
            });
            App.ContextMenu.show(obj);
          }

          // Inicia o Arraste (Drag)
          wrapper.onmousedown = (e) => {
            if (e.target.classList.contains('resize-handle') || e.target.contentEditable === "true") return;
            e.stopPropagation();
            this.selectObject(obj.id);
            this.startDrag(e, obj);
          };

          App.UI.overlay.appendChild(wrapper);
        });
      },

      selectObject(id) {
        App.State.selectedId = id;
        this.renderOverlayObjects();
        if (!id) App.ContextMenu.hide();
      },

      // Lógica de Arraste considerando Zoom
      startDrag(e, obj) {
        let startX = e.clientX;
        let startY = e.clientY;
        let initialX = obj.x;
        let initialY = obj.y;
        let hasMoved = false;

        const onMove = (ev) => {
          hasMoved = true;
          const dx = (ev.clientX - startX) / App.View.zoom;
          const dy = (ev.clientY - startY) / App.View.zoom;
          obj.x = initialX + dx;
          obj.y = initialY + dy;
          
          const el = document.getElementById(obj.id);
          if (el) {
            el.style.left = `${obj.x}px`;
            el.style.top = `${obj.y}px`;
          }
          App.ContextMenu.updatePosition();
        };

        const onUp = () => {
          window.removeEventListener('mousemove', onMove);
          window.removeEventListener('mouseup', onUp);
          if (hasMoved) {
            App.History.saveState(); // Salva estado apenas no final do movimento
            this.renderOverlayObjects();
          }
        };

        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onUp);
      },

      // Lógica de Redimensionamento considerando Zoom
      startResize(e, obj, dir) {
        e.stopPropagation();
        let startX = e.clientX;
        let startY = e.clientY;
        let initialX = obj.x, initialY = obj.y, initialW = obj.w, initialH = obj.h;

        const onMove = (ev) => {
          const dx = (ev.clientX - startX) / App.View.zoom;
          const dy = (ev.clientY - startY) / App.View.zoom;
          
          let newX = initialX, newY = initialY, newW = initialW, newH = initialH;

          if (dir.includes('e')) newW = Math.max(20, initialW + dx);
          if (dir.includes('s')) newH = Math.max(20, initialH + dy);
          if (dir.includes('w')) { newW = Math.max(20, initialW - dx); newX = initialX + (initialW - newW); }
          if (dir.includes('n')) { newH = Math.max(20, initialH - dy); newY = initialY + (initialH - newH); }

          obj.x = newX; obj.y = newY; obj.w = newW; obj.h = newH;
          
          const el = document.getElementById(obj.id);
          if (el) {
            el.style.left = `${obj.x}px`; el.style.top = `${obj.y}px`;
            el.style.width = `${obj.w}px`; el.style.height = `${obj.h}px`;
          }
          App.ContextMenu.updatePosition();
        };

        const onUp = () => {
          window.removeEventListener('mousemove', onMove);
          window.removeEventListener('mouseup', onUp);
          App.History.saveState();
          this.renderOverlayObjects();
        };

        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onUp);
      },

      deleteSelected() {
        if (!App.State.selectedId) return;
        App.History.saveState();
        App.State.edits[App.State.currentPage].objects = App.State.edits[App.State.currentPage].objects.filter(o => o.id !== App.State.selectedId);
        this.selectObject(null);
      }
    };

    //    // =========================================================
    // 6. MÉTODOS DE INSERÇÃO DE OBJETOS
    // =========================================================
    App.addTextObject = function() {
      const center = Coords.getVisibleCenterLogical();
      App.History.saveState();
      const obj = {
        id: crypto.randomUUID(), type: 'text',
        x: center.x - 50, y: center.y - 15, w: 120, h: 30,
        text: 'Novo Texto', font: 'Helvetica', size: 14, color: '#000000', align: 'left', z: 50
      };
      this.State.edits[this.State.currentPage].objects.push(obj);
      this.Engine.selectObject(obj.id);
    };

    App.addRectObject = function() {
      const center = Coords.getVisibleCenterLogical();
      App.History.saveState();
      const obj = {
        id: crypto.randomUUID(), type: 'rect',
        x: center.x - 50, y: center.y - 50, w: 100, h: 100,
        fill: 'transparent', color: '#3b82f6', borderW: 2, z: 40
      };
      this.State.edits[this.State.currentPage].objects.push(obj);
      this.Engine.selectObject(obj.id);
    };

    App.addWhiteoutObject = function() {
      const center = Coords.getVisibleCenterLogical();
      App.History.saveState();
      const obj = {
        id: crypto.randomUUID(), type: 'rect', isWhiteout: true,
        x: center.x - 50, y: center.y - 15, w: 100, h: 30,
        z: 30
      };
      this.State.edits[this.State.currentPage].objects.push(obj);
      this.Engine.selectObject(obj.id);
    };

    App.addImageObject = function(e) {
      const file = e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        const img = new Image();
        img.onload = () => {
          const center = Coords.getVisibleCenterLogical();
          const ratio = img.width / img.height;
          const w = 150; const h = w / ratio;
          App.History.saveState();
          const obj = {
            id: crypto.randomUUID(), type: 'image', src: evt.target.result,
            x: center.x - (w/2), y: center.y - (h/2), w: w, h: h, z: 20
          };
          this.State.edits[this.State.currentPage].objects.push(obj);
          this.Engine.selectObject(obj.id);
        };
        img.src = evt.target.result;
      };
      reader.readAsDataURL(file);
      e.target.value = '';
    };

    // =========================================================
    // 7. MENU CONTEXTUAL INTELIGENTE
    // =========================================================
    App.ContextMenu = {
      show(obj) {
        const menu = App.UI.ctxMenu;
        menu.innerHTML = ''; // Clear

        if (obj.type === 'text') {
          menu.innerHTML = `
            <input type="number" min="8" max="72" value="${obj.size}" onchange="App.updateObj('size', parseInt(this.value))" class="w-12 bg-black text-xs text-center border border-zinc-700 rounded px-1 outline-none text-white">
            <div class="ctx-divider"></div>
            <button onclick="App.updateObj('bold', ${!obj.bold})" class="ctx-btn ${obj.bold ? 'active':''}"><i class="ph-bold ph-text-b"></i></button>
            <button onclick="App.updateObj('italic', ${!obj.italic})" class="ctx-btn ${obj.italic ? 'active':''}"><i class="ph-bold ph-text-italic"></i></button>
            <div class="ctx-divider"></div>
            <button onclick="App.updateObj('align', 'left')" class="ctx-btn ${obj.align==='left' ? 'active':''}"><i class="ph-bold ph-text-align-left"></i></button>
            <button onclick="App.updateObj('align', 'center')" class="ctx-btn ${obj.align==='center' ? 'active':''}"><i class="ph-bold ph-text-align-center"></i></button>
            <div class="ctx-divider"></div>
            <input type="color" value="${obj.color}" oninput="App.updateObj('color', this.value)" class="w-6 h-6 border-0 p-0 bg-transparent rounded cursor-pointer">
          `;
        } 
        else if (obj.type === 'rect') {
           if(!obj.isWhiteout) {
             menu.innerHTML = `
               <input type="color" value="${obj.color}" oninput="App.updateObj('color', this.value)" class="w-6 h-6 border-0 p-0 bg-transparent rounded cursor-pointer" title="Cor da Borda">
               <input type="number" min="1" max="10" value="${obj.borderW}" onchange="App.updateObj('borderW', parseInt(this.value))" class="w-10 bg-black text-xs text-center border border-zinc-700 rounded px-1 outline-none text-white">
             `;
           } else {
             menu.innerHTML = `<span class="text-[10px] text-zinc-400 px-2 font-bold uppercase">Apagador / Whiteout</span>`;
           }
        }
        else if (obj.type === 'image') {
           menu.innerHTML = `<span class="text-[10px] text-zinc-400 px-2 font-bold uppercase">Imagem</span>`;
        }

        // Ações comuns
        menu.innerHTML += `
          <div class="ctx-divider"></div>
          <button onclick="App.Engine.deleteSelected()" class="ctx-btn text-red-400 hover:text-red-300"><i class="ph-bold ph-trash"></i></button>
        `;

        menu.classList.add('visible');
        this.updatePosition();
      },

      hide() {
        App.UI.ctxMenu.classList.remove('visible');
      },

      updatePosition() {
        const obj = App.State.edits[App.State.currentPage].objects.find(o => o.id === App.State.selectedId);
        if (!obj) return this.hide();

        const menu = App.UI.ctxMenu;
        const screenPos = Coords.logicalToScreen(obj.x, obj.y);
        
        // Posiciona o menu flutuante acima do objeto
        // O offset top considera a altura do menu e um padding visual.
        let topPos = screenPos.y - 40; 
        
        // Se bater no header, joga pra baixo do objeto
        if (topPos < 50) {
           const screenBottom = Coords.logicalToScreen(obj.x, obj.y + obj.h);
           topPos = screenBottom.y + 10;
        }

        menu.style.left = `${screenPos.x}px`;
        menu.style.top = `${topPos}px`;
      }
    };

    App.updateObj = function(prop, val) {
      const obj = this.State.edits[this.State.currentPage].objects.find(o => o.id === this.State.selectedId);
      if (obj) {
        this.History.saveState();
        obj[prop] = val;
        this.Engine.renderOverlayObjects();
      }
    };

    //    // =========================================================
    // 8. HISTÓRICO (UNDO / REDO)
    // =========================================================
    App.History = {
      saveState() {
        const snapshot = JSON.stringify(App.State.edits);
        App.State.history.past.push(snapshot);
        App.State.history.future = []; // Limpa futuro ao fazer nova ação
        if (App.State.history.past.length > 30) App.State.history.past.shift(); // Limite
      },
      undo() {
        if (App.State.history.past.length > 0) {
          const current = JSON.stringify(App.State.edits);
          App.State.history.future.push(current);
          App.State.edits = JSON.parse(App.State.history.past.pop());
          App.Engine.renderOverlayObjects();
          App.Engine.redrawPaths();
        }
      },
      redo() {
        if (App.State.history.future.length > 0) {
          const current = JSON.stringify(App.State.edits);
          App.State.history.past.push(current);
          App.State.edits = JSON.parse(App.State.history.future.pop());
          App.Engine.renderOverlayObjects();
          App.Engine.redrawPaths();
        }
      }
    };

    // =========================================================
    // 9. EXPORTAÇÃO PDF-LIB MATEMATICAMENTE FIEL
    // =========================================================
    App.Export = {
      async savePDF() {
        if (!App.State.pdfDoc) return;
        const btn = event.currentTarget;
        const oHtml = btn.innerHTML;
        btn.innerHTML = `<i class="ph-bold ph-spinner animate-spin"></i> Gerando...`;

        try {
          const fontHelvetica = await App.State.pdfDoc.embedFont(PDFLib.StandardFonts.Helvetica);
          const fontBold = await App.State.pdfDoc.embedFont(PDFLib.StandardFonts.HelveticaBold);
          const fontItalic = await App.State.pdfDoc.embedFont(PDFLib.StandardFonts.HelveticaOblique);

          for (let i = 1; i <= App.State.numPages; i++) {
            const page = App.State.pdfDoc.getPage(i - 1);
            const { width, height } = page.getSize();
            const edits = App.State.edits[i];

            // A. Queimar Traços (Paths) gerando um PNG overlay por página
            if (edits.paths.length > 0) {
              const offCanvas = document.createElement('canvas');
              offCanvas.width = width * 2; offCanvas.height = height * 2;
              const offCtx = offCanvas.getContext('2d');
              
              edits.paths.forEach(p => {
                offCtx.beginPath();
                offCtx.strokeStyle = p.color;
                offCtx.lineWidth = p.width * 2;
                offCtx.lineCap = 'round';
                offCtx.moveTo(p.points[0].x * 2, p.points[0].y * 2);
                for(let pt=1; pt<p.points.length; pt++) offCtx.lineTo(p.points[pt].x * 2, p.points[pt].y * 2);
                offCtx.stroke();
              });

              const pngImage = await App.State.pdfDoc.embedPng(offCanvas.toDataURL());
              page.drawImage(pngImage, { x: 0, y: 0, width: width, height: height });
            }

            // Ordena objetos por Z-Index antes de renderizar para respeitar camadas
            const sortedObjs = [...edits.objects].sort((a,b) => (a.z || 0) - (b.z || 0));

            // B. Queimar Objetos Lógicos
            for (const obj of sortedObjs) {
              // Conversão de Y (PDF-lib tem 0,0 no canto inferior esquerdo)
              const pdfY = height - obj.y - obj.h;

              if (obj.type === 'rect') {
                if (obj.isWhiteout) {
                   page.drawRectangle({ x: obj.x, y: pdfY, width: obj.w, height: obj.h, color: PDFLib.rgb(1,1,1) });
                } else {
                   const rgb = this.hexToRgb(obj.color);
                   page.drawRectangle({ 
                     x: obj.x, y: pdfY, width: obj.w, height: obj.h, 
                     borderColor: PDFLib.rgb(rgb.r, rgb.g, rgb.b), borderWidth: obj.borderW 
                   });
                }
              } 
              else if (obj.type === 'text') {
                const rgb = this.hexToRgb(obj.color);
                let f = fontHelvetica;
                if(obj.bold) f = fontBold;
                if(obj.italic) f = fontItalic;

                // PDF-lib desenha texto a partir da linha de base (baseline), então ajustamos o Y
                const baselineY = height - obj.y - (obj.size * 0.85);

                page.drawText(obj.text, {
                  x: obj.x + 2, y: baselineY, size: obj.size, font: f, color: PDFLib.rgb(rgb.r, rgb.g, rgb.b)
                });
              }
              else if (obj.type === 'image') {
                const imgBytes = await fetch(obj.src).then(r => r.arrayBuffer());
                let embedded;
                if (obj.src.includes('png') || obj.src.startsWith('data:image/png')) {
                  embedded = await App.State.pdfDoc.embedPng(imgBytes);
                } else {
                  embedded = await App.State.pdfDoc.embedJpg(imgBytes);
                }
                page.drawImage(embedded, { x: obj.x, y: pdfY, width: obj.w, height: obj.h });
              }
            }
          }

          const finalBytes = await App.State.pdfDoc.save();
          const blob = new Blob([finalBytes], { type: 'application/pdf' });
          const link = document.createElement('a');
          link.href = URL.createObjectURL(blob);
          link.download = `Editado_${App.State.filename}`;
          link.click();
          
        } catch(e) {
          alert("Erro ao exportar PDF.");
          console.error(e);
        } finally {
          btn.innerHTML = `<i class="ph-bold ph-download-simple"></i> Salvar PDF`;
        }
      },

      hexToRgb(hex) {
        const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex || '#000000');
        return result ? { r: parseInt(result[1], 16)/255, g: parseInt(result[2], 16)/255, b: parseInt(result[3], 16)/255 } : {r:0,g:0,b:0};
      }
    };

    // Iniciar App
    setupGlobalEvents();

  </script>
