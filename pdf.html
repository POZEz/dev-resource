<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#09090b">
  <title>Editor de PDF</title>

  <!-- CDNs Oficiais: Supabase, PDF.js, PDF-lib, Tailwind, Phosphor Icons -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            matte: { bg: '#09090b', card: '#121214', border: '#27272a', text: '#fafafa', muted: '#a1a1aa' }
          }
        }
      }
    }
  </script>

  <style>
    body, html { 
      margin: 0; 
      padding: 0; 
      width: 100%; 
      height: 100%; 
      background-color: #09090b; 
      color: #fafafa; 
      overflow: hidden; 
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
    }
    
    .no-scrollbars::-webkit-scrollbar { display: none; }
    .no-scrollbars { -ms-overflow-style: none; scrollbar-width: none; }

    /* Layout absoluto garantido dentro do frame */
    #editor-ui {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      width: 100%;
      height: 100%;
    }

    #workspace {
      position: absolute;
      top: 44px;
      bottom: 0; 
      left: 0;
      right: 0;
      overflow: hidden;
      background-color: #121214;
      touch-action: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #document-container {
      position: absolute;
      transform-origin: 0 0;
      background: white;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
    }

    canvas { display: block; position: absolute; top: 0; left: 0; }
    
    #pdf-layer { z-index: 1; pointer-events: none; }
    #drawing-layer { z-index: 2; pointer-events: none; }
    #overlay-layer { z-index: 3; position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }

    .text-box {
      position: absolute;
      pointer-events: auto;
      color: #000;
      font-size: 16px;
      font-family: Arial, sans-serif;
      min-width: 20px;
      min-height: 20px;
      padding: 2px;
      border: 1px dashed transparent;
      outline: none;
      white-space: pre-wrap;
      line-height: 1.2;
    }
    .text-box:focus, .text-box:hover { border-color: #a1a1aa; background: rgba(0,0,0,0.05); cursor: move; }

    /* Drawer de Páginas */
    #pages-drawer {
      transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .drawer-closed { transform: translateX(-100%); }
    .drawer-open { transform: translateX(0); }

    /* Pílula e Botões Minimalistas Estilo Apple */
    .tool-btn {
      width: 36px;
      height: 36px;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #a1a1aa;
      transition: all 0.15s ease;
      cursor: pointer;
      flex-shrink: 0;
    }
    .tool-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }
    .tool-btn.active {
      background: rgba(255, 255, 255, 0.22); 
      color: #fff;
    }

    /* Subpainéis Popover */
    .popover-panel {
      position: absolute;
      bottom: 56px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(28, 28, 30, 0.95);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 10px 14px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.8);
      z-index: 60;
    }

    input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type="color"]::-webkit-color-swatch { border: none; }
  </style>
</head>
<body class="antialiased text-white select-none">

  <!-- ESTADO VAZIO: TELA INICIAL -->
  <div id="empty-state" class="absolute inset-0 z-50 flex flex-col items-center justify-center bg-matte-bg px-6">
    <div class="w-16 h-16 rounded-2xl bg-white/[0.03] border border-white/10 flex items-center justify-center text-zinc-400 mb-5 shadow-2xl backdrop-blur-xl">
      <i class="ph-fill ph-file-pdf text-3xl"></i>
    </div>
    <h2 class="text-lg font-bold text-white mb-1.5 text-center">Editor de PDF</h2>
    <p class="text-xs text-zinc-400 mb-6 text-center max-w-xs leading-relaxed">Abra um documento existente ou crie uma folha em branco.</p>
    
    <div class="flex flex-col sm:flex-row items-center gap-3 w-full max-w-xs">
      <label class="w-full px-4 py-3 rounded-xl bg-white text-black font-bold text-xs hover:bg-zinc-200 transition-colors cursor-pointer shadow-lg flex items-center justify-center gap-2">
        <i class="ph-bold ph-upload-simple text-base"></i>
        Abrir PDF
        <input type="file" id="file-upload" accept="application/pdf" class="hidden" onchange="handleFileSelect(event)">
      </label>

      <button onclick="createBlankPDF()" class="w-full px-4 py-3 rounded-xl bg-white/[0.05] border border-white/10 text-white font-bold text-xs hover:bg-white/[0.1] transition-colors flex items-center justify-center gap-2">
        <i class="ph-bold ph-file-plus text-base"></i>
        Criar em Branco
      </button>
    </div>
  </div>

  <!-- CONTAINER COMPLETO DO EDITOR -->
  <div id="editor-ui" class="hidden">
    
    <!-- CABEÇALHO SUPERIOR MINIMALISTA -->
    <header class="h-11 bg-[#121214]/90 backdrop-blur-xl border-b border-white/5 flex items-center justify-between px-3 shrink-0 absolute top-0 w-full z-30">
      <div class="flex items-center gap-2">
        <button onclick="toggleDrawer(true)" class="p-1.5 rounded-lg text-zinc-300 hover:bg-white/[0.08] hover:text-white transition-colors" title="Páginas">
          <i class="ph-bold ph-sidebar-simple text-base"></i>
        </button>
        <span id="header-filename" class="text-xs font-semibold truncate max-w-[130px] sm:max-w-xs text-zinc-300">documento.pdf</span>
      </div>

      <div class="flex items-center gap-2">
        <span id="sync-status" class="text-[10px] text-zinc-500 hidden sm:block">Editando</span>
        <button onclick="exportFinalPDF()" class="px-3 py-1 rounded-full bg-white/[0.08] hover:bg-white/[0.15] text-white border border-white/10 text-xs font-bold flex items-center gap-1.5 transition-colors">
          <i class="ph-bold ph-download-simple"></i>
          <span>Exportar</span>
        </button>
      </div>
    </header>

    <!-- MOTOR DE VISUALIZAÇÃO E GESTOS -->
    <main id="workspace">
      <div id="document-container">
        <canvas id="pdf-layer"></canvas>
        <canvas id="drawing-layer"></canvas>
        <div id="overlay-layer"></div>
      </div>
    </main>

    <!-- SUBPAINÉIS POPOVER DE FERRAMENTAS -->
    
    <!-- Popover 1: Estilo de Desenho (Caneta / Marca-Texto) -->
    <div id="popover-draw" class="popover-panel hidden flex-col gap-2">
      <div class="text-[10px] font-bold uppercase text-zinc-400 mb-1">Modo de Desenho</div>
      <div class="flex items-center gap-2">
        <button onclick="setDrawMode('pen')" id="btn-mode-pen" class="px-3 py-1.5 rounded-lg bg-white/20 text-white text-xs font-semibold flex items-center gap-1.5">
          <i class="ph-bold ph-pencil-simple"></i> Caneta
        </button>
        <button onclick="setDrawMode('highlighter')" id="btn-mode-highlighter" class="px-3 py-1.5 rounded-lg bg-white/5 hover:bg-white/10 text-zinc-300 text-xs font-semibold flex items-center gap-1.5">
          <i class="ph-bold ph-highlighter"></i> Marca-Texto
        </button>
      </div>
    </div>

    <!-- Popover 2: Cores e Espessura -->
    <div id="popover-style" class="popover-panel hidden flex-col gap-3 min-w-[200px]">
      <div class="text-[10px] font-bold uppercase text-zinc-400">Cor do Traço</div>
      <div class="flex items-center gap-2">
        <button onclick="selectPresetColor('#ef4444')" class="w-6 h-6 rounded-full bg-red-500 border border-white/20"></button>
        <button onclick="selectPresetColor('#3b82f6')" class="w-6 h-6 rounded-full bg-blue-500 border border-white/20"></button>
        <button onclick="selectPresetColor('#10b981')" class="w-6 h-6 rounded-full bg-emerald-500 border border-white/20"></button>
        <button onclick="selectPresetColor('#f59e0b')" class="w-6 h-6 rounded-full bg-amber-500 border border-white/20"></button>
        <button onclick="selectPresetColor('#000000')" class="w-6 h-6 rounded-full bg-black border border-white/20"></button>
        <div class="relative w-6 h-6 rounded-full border border-white/20 overflow-hidden shrink-0" id="custom-color-preview" style="background: #ef4444">
          <input type="color" id="tool-color" value="#ef4444" class="absolute inset-0 opacity-0 cursor-pointer w-full h-full">
        </div>
      </div>
      
      <div class="border-t border-white/10 pt-2">
        <div class="flex justify-between text-[10px] text-zinc-400 font-bold mb-1">
          <span>Espessura</span>
          <span id="stroke-val-label">3px</span>
        </div>
        <input type="range" id="stroke-width" min="1" max="12" value="3" oninput="setStrokeWidth(this.value)" class="w-full accent-white bg-white/10 h-1 rounded-lg">
      </div>
    </div>

    <!-- Popover 3: Inserir Formas -->
    <div id="popover-shapes" class="popover-panel hidden flex-col gap-2">
      <div class="text-[10px] font-bold uppercase text-zinc-400 mb-1">Inserir Forma</div>
      <div class="flex items-center gap-2">
        <button onclick="addShape('rect')" class="p-2 rounded-lg bg-white/5 hover:bg-white/10 text-white text-xs flex items-center gap-1">
          <i class="ph-bold ph-square text-base"></i> Retângulo
        </button>
        <button onclick="addShape('circle')" class="p-2 rounded-lg bg-white/5 hover:bg-white/10 text-white text-xs flex items-center gap-1">
          <i class="ph-bold ph-circle text-base"></i> Círculo
        </button>
        <button onclick="addShape('line')" class="p-2 rounded-lg bg-white/5 hover:bg-white/10 text-white text-xs flex items-center gap-1">
          <i class="ph-bold ph-line-segment text-base"></i> Linha
        </button>
      </div>
    </div>

    <!-- PÍLULA FLUTUANTE INFERIOR (APPLE STYLE) - Garantida Absoluta -->
    <nav class="absolute bottom-4 left-1/2 -translate-x-1/2 bg-[#1c1c1e]/90 backdrop-blur-2xl border border-white/10 rounded-full shadow-[0_12px_36px_rgba(0,0,0,0.8)] flex items-center gap-1 px-3 py-1.5 z-40">
      
      <button onclick="setTool('hand')" id="tool-hand" class="tool-btn active" title="Mover / Pan">
        <i class="ph-bold ph-hand-palm text-lg"></i>
      </button>

      <button onclick="togglePopover('popover-draw'); setTool('draw');" id="tool-draw" class="tool-btn" title="Caneta / Marca-Texto">
        <i class="ph-bold ph-pencil-simple text-lg"></i>
      </button>

      <button onclick="setTool('text')" id="tool-text" class="tool-btn" title="Inserir Texto">
        <i class="ph-bold ph-text-t text-lg"></i>
      </button>

      <button onclick="togglePopover('popover-shapes')" id="tool-shapes" class="tool-btn" title="Formas Geométricas">
        <i class="ph-bold ph-shapes text-lg"></i>
      </button>

      <label class="tool-btn cursor-pointer" title="Inserir Imagem / Assinatura">
        <i class="ph-bold ph-image text-lg"></i>
        <input type="file" accept="image/*" class="hidden" onchange="handleAddImage(event)">
      </label>

      <div class="w-px h-5 bg-white/10 mx-0.5 rounded-full"></div>

      <!-- Seletor de Cores & Estilo -->
      <button onclick="togglePopover('popover-style')" class="tool-btn" title="Cores e Espessura">
        <div class="w-5 h-5 rounded-full border border-white/20" id="current-color-dot" style="background: #ef4444"></div>
      </button>

      <button onclick="clearCurrentPageDrawings()" class="tool-btn text-zinc-400 hover:text-white" title="Limpar Anotações">
        <i class="ph-bold ph-eraser text-lg"></i>
      </button>

    </nav>

    <!-- DRAWER LATERAL DE PÁGINAS COM THUMBNAILS REAIS -->
    <div id="drawer-backdrop" onclick="toggleDrawer(false)" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-40 hidden transition-opacity"></div>
    
    <aside id="pages-drawer" class="fixed inset-y-0 left-0 w-60 bg-[#121214]/95 backdrop-blur-2xl border-r border-white/5 z-50 drawer-closed flex flex-col shadow-2xl">
      <div class="h-12 px-3 border-b border-white/5 flex items-center justify-between shrink-0">
        <span class="text-xs font-bold text-white tracking-wider">Páginas</span>
        <div class="flex items-center gap-1">
          <button onclick="addNewBlankPage()" class="p-1 rounded text-xs font-bold text-zinc-300 hover:text-white hover:bg-white/10 flex items-center gap-1" title="Nova Página">
            <i class="ph-bold ph-plus"></i>
          </button>
          <button onclick="toggleDrawer(false)" class="text-zinc-500 hover:text-white p-1 rounded-full"><i class="ph-bold ph-x"></i></button>
        </div>
      </div>
      
      <div id="thumbnails-container" class="flex-1 overflow-y-auto p-3 space-y-3 no-scrollbars">
        <!-- Thumbnails renderizadas via JS -->
      </div>
    </aside>

  </div>

  <!-- LÓGICA DO EDITOR (MOTOR DE GESTOS, PDF.JS, PDF-LIB) -->
  <script>
    let state = {
      pdfDocLib: null,
      pdfJsDoc: null,
      originalBytes: null,
      filename: 'documento.pdf',
      
      currentPage: 1,
      totalPages: 0,
      
      zoom: 1.0,
      panX: 0,
      panY: 0,
      
      activeTool: 'hand', // 'hand', 'draw', 'text'
      drawMode: 'pen',    // 'pen' | 'highlighter'
      strokeWidth: 3,
      currentColor: '#ef4444',
      
      edits: {} // edits[pageNum] = { paths: [], texts: [], shapes: [], images: [] }
    };

    const workspace = document.getElementById('workspace');
    const container = document.getElementById('document-container');
    const pdfLayer = document.getElementById('pdf-layer');
    const drawLayer = document.getElementById('drawing-layer');
    const overlayLayer = document.getElementById('overlay-layer');
    
    let pdfCtx = pdfLayer.getContext('2d');
    let drawCtx = drawLayer.getContext('2d');

    function initEditor() {
      setupGestureEngine();
      document.getElementById('tool-color').addEventListener('input', (e) => {
        selectPresetColor(e.target.value);
      });
    }

    // ==== CRIAÇÃO E ABERTURA DE ARQUIVOS ====
    
    async function createBlankPDF() {
      try {
        const pdfDoc = await PDFLib.PDFDocument.create();
        pdfDoc.addPage([595.28, 841.89]);
        const pdfBytes = await pdfDoc.save();
        state.filename = "Documento em Branco.pdf";
        document.getElementById('header-filename').innerText = state.filename;
        await loadPdfData(pdfBytes);
      } catch (err) {
        alert("Erro ao criar documento.");
      }
    }

    async function handleFileSelect(e) {
      const file = e.target.files[0];
      if (!file || file.type !== 'application/pdf') return;
      state.filename = file.name;
      document.getElementById('header-filename').innerText = file.name;
      try {
        const arrayBuffer = await file.arrayBuffer();
        await loadPdfData(arrayBuffer);
      } catch (err) {
        alert("Erro ao ler o PDF.");
      }
    }

    async function loadPdfData(arrayBuffer) {
      try {
        state.originalBytes = arrayBuffer;
        state.pdfDocLib = await PDFLib.PDFDocument.load(arrayBuffer);
        
        const typedArray = new Uint8Array(arrayBuffer);
        state.pdfJsDoc = await pdfjsLib.getDocument({ data: typedArray }).promise;
        state.totalPages = state.pdfJsDoc.numPages;

        for(let i=1; i<=state.totalPages; i++) {
          state.edits[i] = { paths: [], texts: [], images: [] };
        }

        document.getElementById('empty-state').classList.add('hidden');
        document.getElementById('editor-ui').classList.remove('hidden');
        document.getElementById('editor-ui').classList.add('flex');

        state.currentPage = 1;
        await renderCurrentPage();
        centerDocument();
        renderThumbnailsDrawer();
      } catch(err) {
        alert("Falha ao abrir PDF.");
      }
    }

    async function renderCurrentPage() {
      if (!state.pdfJsDoc) return;
      const page = await state.pdfJsDoc.getPage(state.currentPage);
      
      const renderScale = 2.0; 
      const viewport = page.getViewport({ scale: renderScale });

      pdfLayer.width = viewport.width;
      pdfLayer.height = viewport.height;
      drawLayer.width = viewport.width;
      drawLayer.height = viewport.height;

      const cssWidth = viewport.width / renderScale;
      const cssHeight = viewport.height / renderScale;
      container.style.width = `${cssWidth}px`;
      container.style.height = `${cssHeight}px`;

      await page.render({ canvasContext: pdfCtx, viewport }).promise;

      redrawDrawings(renderScale);
      renderTexts();
      renderImages();
    }

    // ==== MOTOR DE GESTOS E POINTERS (CORRIGIDO SEM SALTOS DE CAMERA) ====
    let pointers = [];
    let initialPinchDistance = null;
    let initialZoom = 1;
    let lastPanPt = null;
    let isDrawingStroke = false;
    let currentPath = [];

    function setupGestureEngine() {
      workspace.addEventListener('touchstart', e => e.preventDefault(), { passive: false });

      workspace.addEventListener('pointerdown', (e) => {
        // Fecha popovers abertos ao tocar no workspace
        closeAllPopovers();

        pointers.push(e);

        if (pointers.length === 2) {
          initialPinchDistance = Math.hypot(pointers[0].clientX - pointers[1].clientX, pointers[0].clientY - pointers[1].clientY);
          initialZoom = state.zoom;
          isDrawingStroke = false; 
        } 
        else if (pointers.length === 1) {
          if (state.activeTool === 'hand') {
            lastPanPt = { x: e.clientX, y: e.clientY };
          } 
          else if (state.activeTool === 'draw') {
            isDrawingStroke = true;
            const pt = getRelativeCoordinates(e.clientX, e.clientY);
            
            const isHighlighter = state.drawMode === 'highlighter';
            const color = isHighlighter ? hexToRgba(state.currentColor, 0.35) : state.currentColor;
            const width = isHighlighter ? state.strokeWidth * 3.5 : state.strokeWidth;

            currentPath = [{ x: pt.x, y: pt.y, c: color, w: width }];
            drawCtx.beginPath();
            drawCtx.strokeStyle = color;
            drawCtx.lineWidth = width * 2;
            drawCtx.lineCap = 'round';
            drawCtx.lineJoin = 'round';
            drawCtx.moveTo(pt.x * 2, pt.y * 2);
          }
          else if (state.activeTool === 'text') {
            const pt = getRelativeCoordinates(e.clientX, e.clientY);
            createTextElement(pt.x, pt.y);
            setTool('hand');
          }
        }
      });

      workspace.addEventListener('pointermove', (e) => {
        const index = pointers.findIndex(p => p.pointerId === e.pointerId);
        if (index !== -1) pointers[index] = e;

        if (pointers.length === 2) {
          const dist = Math.hypot(pointers[0].clientX - pointers[1].clientX, pointers[0].clientY - pointers[1].clientY);
          if (!initialPinchDistance) return;
          const scale = dist / initialPinchDistance;
          let newZoom = initialZoom * scale;
          newZoom = Math.max(0.5, Math.min(newZoom, 5.0)); 
          
          const centerX = (pointers[0].clientX + pointers[1].clientX) / 2;
          const centerY = (pointers[0].clientY + pointers[1].clientY) / 2;
          
          const workspaceRect = workspace.getBoundingClientRect();
          const relX = centerX - workspaceRect.left;
          const relY = centerY - workspaceRect.top;

          state.panX = relX - (relX - state.panX) * (newZoom / state.zoom);
          state.panY = relY - (relY - state.panY) * (newZoom / state.zoom);
          state.zoom = newZoom;
          applyTransform();
        } 
        else if (pointers.length === 1) {
          if (state.activeTool === 'hand' && lastPanPt) {
            const dx = e.clientX - lastPanPt.x;
            const dy = e.clientY - lastPanPt.y;
            state.panX += dx;
            state.panY += dy;
            lastPanPt = { x: e.clientX, y: e.clientY };
            applyTransform();
          } 
          else if (state.activeTool === 'draw' && isDrawingStroke) {
            const pt = getRelativeCoordinates(e.clientX, e.clientY);
            currentPath.push({ x: pt.x, y: pt.y });
            drawCtx.lineTo(pt.x * 2, pt.y * 2);
            drawCtx.stroke();
          }
        }
      });

      const endPointer = (e) => {
        pointers = pointers.filter(p => p.pointerId !== e.pointerId);
        
        if (pointers.length < 2) {
          initialPinchDistance = null;
        }

        // Recalibra o ponto de arraste para o dedo restante sem pular a tela
        if (pointers.length === 1 && state.activeTool === 'hand') {
          lastPanPt = { x: pointers[0].clientX, y: pointers[0].clientY };
        } else if (pointers.length === 0) {
          lastPanPt = null;
        }

        if (state.activeTool === 'draw' && isDrawingStroke && currentPath.length > 1) {
          state.edits[state.currentPage].paths.push([...currentPath]);
          isDrawingStroke = false;
        }
      };

      workspace.addEventListener('pointerup', endPointer);
      workspace.addEventListener('pointercancel', endPointer);
      workspace.addEventListener('pointerout', endPointer);

      workspace.addEventListener('wheel', (e) => {
        e.preventDefault();
        const zoomDelta = e.deltaY < 0 ? 1.1 : 0.9;
        let newZoom = state.zoom * zoomDelta;
        newZoom = Math.max(0.5, Math.min(newZoom, 5.0));
        
        const workspaceRect = workspace.getBoundingClientRect();
        const relX = e.clientX - workspaceRect.left;
        const relY = e.clientY - workspaceRect.top;

        state.panX = relX - (relX - state.panX) * (newZoom / state.zoom);
        state.panY = relY - (relY - state.panY) * (newZoom / state.zoom);
        state.zoom = newZoom;
        applyTransform();
      }, { passive: false });
    }

    function applyTransform() {
      container.style.transform = `translate(${state.panX}px, ${state.panY}px) scale(${state.zoom})`;
    }

    function centerDocument() {
      const wRect = workspace.getBoundingClientRect();
      const cRect = container.getBoundingClientRect();
      const fitZoom = (wRect.width - 32) / (cRect.width / state.zoom);
      state.zoom = Math.min(fitZoom, 1.2);
      state.panX = (wRect.width - (cRect.width / state.zoom) * state.zoom) / 2;
      state.panY = 16;
      applyTransform();
    }

    function getRelativeCoordinates(clientX, clientY) {
      const rect = container.getBoundingClientRect();
      const x = (clientX - rect.left) / state.zoom;
      const y = (clientY - rect.top) / state.zoom;
      return { x, y };
    }

    // ==== MANIPULAÇÃO DE POPOVERS E FERRAMENTAS ====
    function setTool(toolName) {
      state.activeTool = toolName;
      document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
      const activeBtn = document.getElementById(`tool-${toolName}`);
      if (activeBtn) activeBtn.classList.add('active');
      
      overlayLayer.style.pointerEvents = (toolName === 'text' || toolName === 'hand') ? 'auto' : 'none';
    }

    function togglePopover(popoverId) {
      const el = document.getElementById(popoverId);
      const isHidden = el.classList.contains('hidden');
      closeAllPopovers();
      if (isHidden) el.classList.remove('hidden');
    }

    function closeAllPopovers() {
      document.querySelectorAll('.popover-panel').forEach(p => p.classList.add('hidden'));
    }

    function setDrawMode(mode) {
      state.drawMode = mode;
      document.getElementById('btn-mode-pen').className = mode === 'pen' ? 'px-3 py-1.5 rounded-lg bg-white/20 text-white text-xs font-semibold flex items-center gap-1.5' : 'px-3 py-1.5 rounded-lg bg-white/5 hover:bg-white/10 text-zinc-300 text-xs font-semibold flex items-center gap-1.5';
      document.getElementById('btn-mode-highlighter').className = mode === 'highlighter' ? 'px-3 py-1.5 rounded-lg bg-white/20 text-white text-xs font-semibold flex items-center gap-1.5' : 'px-3 py-1.5 rounded-lg bg-white/5 hover:bg-white/10 text-zinc-300 text-xs font-semibold flex items-center gap-1.5';
    }

    function selectPresetColor(hex) {
      state.currentColor = hex;
      document.getElementById('tool-color').value = hex;
      document.getElementById('custom-color-preview').style.background = hex;
      document.getElementById('current-color-dot').style.background = hex;
    }

    function setStrokeWidth(val) {
      state.strokeWidth = parseInt(val);
      document.getElementById('stroke-val-label').innerText = `${val}px`;
    }

    // ==== DESENHO E REDRAW ====
    function redrawDrawings(scale) {
      drawCtx.clearRect(0, 0, drawLayer.width, drawLayer.height);
      const paths = state.edits[state.currentPage].paths;
      paths.forEach(path => {
        if (path.length < 2) return;
        drawCtx.beginPath();
        drawCtx.strokeStyle = path[0].c || '#ef4444';
        drawCtx.lineWidth = (path[0].w || 3) * scale;
        drawCtx.lineCap = 'round';
        drawCtx.lineJoin = 'round';
        drawCtx.moveTo(path[0].x * scale, path[0].y * scale);
        for (let i = 1; i < path.length; i++) {
          drawCtx.lineTo(path[i].x * scale, path[i].y * scale);
        }
        drawCtx.stroke();
      });
    }

    function clearCurrentPageDrawings() {
      state.edits[state.currentPage].paths = [];
      state.edits[state.currentPage].texts = [];
      state.edits[state.currentPage].images = [];
      redrawDrawings(2.0);
      renderTexts();
      renderImages();
    }

    // ==== ELEMENTOS DE TEXTO INSTANTÂNEOS ====
    function createTextElement(x, y, content = '') {
      const textId = crypto.randomUUID();
      const textObj = { id: textId, x: x, y: y, text: content, color: state.currentColor };
      state.edits[state.currentPage].texts.push(textObj);
      renderTexts();
      
      setTimeout(() => {
        const el = document.getElementById(textId);
        if (el) {
          el.focus();
          const range = document.createRange();
          const sel = window.getSelection();
          range.selectNodeContents(el);
          range.collapse(false);
          sel.removeAllRanges();
          sel.addRange(range);
        }
      }, 50);
    }

    function renderTexts() {
      overlayLayer.querySelectorAll('.text-box').forEach(el => el.remove());
      const texts = state.edits[state.currentPage].texts;

      texts.forEach(txt => {
        const div = document.createElement('div');
        div.id = txt.id;
        div.className = 'text-box';
        div.contentEditable = true;
        div.innerText = txt.text || '';
        if (!txt.text) div.dataset.placeholder = 'Escreva...';
        
        div.style.left = `${txt.x}px`;
        div.style.top = `${txt.y}px`;
        div.style.color = txt.color;

        div.onblur = () => {
          if (!div.innerText.trim()) {
            state.edits[state.currentPage].texts = state.edits[state.currentPage].texts.filter(t => t.id !== txt.id);
            div.remove();
          } else {
            txt.text = div.innerText;
          }
        };

        let isDragging = false;
        let startX, startY;
        div.onmousedown = div.ontouchstart = (e) => {
          if(e.type === 'touchstart') e = e.touches[0];
          if(document.activeElement === div) return;
          isDragging = true;
          startX = e.clientX;
          startY = e.clientY;
          e.stopPropagation();
        };

        window.addEventListener('mousemove', dragTxt);
        window.addEventListener('touchmove', dragTxt, {passive: false});
        window.addEventListener('mouseup', endDrag);
        window.addEventListener('touchend', endDrag);

        function dragTxt(e) {
          if (!isDragging) return;
          e.preventDefault();
          if(e.type === 'touchmove') e = e.touches[0];
          
          const dx = (e.clientX - startX) / state.zoom;
          const dy = (e.clientY - startY) / state.zoom;
          txt.x += dx;
          txt.y += dy;
          div.style.left = `${txt.x}px`;
          div.style.top = `${txt.y}px`;
          
          startX = e.clientX;
          startY = e.clientY;
        }
        function endDrag() { isDragging = false; }

        overlayLayer.appendChild(div);
      });
    }

    // ==== CARREGAMENTO DE IMAGENS & ASSINATURAS ====
    function handleAddImage(e) {
      const file = e.target.files[0];
      if (!file || !file.type.startsWith('image/')) return;

      const reader = new FileReader();
      reader.onload = (evt) => {
        const imgObj = {
          id: crypto.randomUUID(),
          src: evt.target.result,
          x: 40,
          y: 40,
          width: 120,
          height: 120
        };
        state.edits[state.currentPage].images.push(imgObj);
        renderImages();
      };
      reader.readAsDataURL(file);
    }

    function renderImages() {
      overlayLayer.querySelectorAll('.img-stamp').forEach(el => el.remove());
      const images = state.edits[state.currentPage].images;

      images.forEach(imgData => {
        const img = document.createElement('img');
        img.className = 'img-stamp absolute pointer-events-auto cursor-move border border-dashed border-transparent hover:border-white/50 rounded';
        img.src = imgData.src;
        img.style.left = `${imgData.x}px`;
        img.style.top = `${imgData.y}px`;
        img.style.width = `${imgData.width}px`;

        let isDragging = false, startX, startY;
        img.onmousedown = img.ontouchstart = (e) => {
          if(e.type === 'touchstart') e = e.touches[0];
          isDragging = true;
          startX = e.clientX;
          startY = e.clientY;
          e.stopPropagation();
        };

        window.addEventListener('mousemove', dragImg);
        window.addEventListener('touchmove', dragImg, {passive: false});
        window.addEventListener('mouseup', endDragImg);
        window.addEventListener('touchend', endDragImg);

        function dragImg(e) {
          if (!isDragging) return;
          e.preventDefault();
          if(e.type === 'touchmove') e = e.touches[0];
          
          const dx = (e.clientX - startX) / state.zoom;
          const dy = (e.clientY - startY) / state.zoom;
          imgData.x += dx;
          imgData.y += dy;
          img.style.left = `${imgData.x}px`;
          img.style.top = `${imgData.y}px`;
          
          startX = e.clientX;
          startY = e.clientY;
        }
        function endDragImg() { isDragging = false; }

        overlayLayer.appendChild(img);
      });
    }

    // ==== DRAWER LATERAL DE THUMBNAILS REAL ====
    function toggleDrawer(show) {
      const drawer = document.getElementById('pages-drawer');
      const backdrop = document.getElementById('drawer-backdrop');
      if (show) {
        backdrop.classList.remove('hidden');
        drawer.classList.remove('drawer-closed');
        drawer.classList.add('drawer-open');
      } else {
        backdrop.classList.add('hidden');
        drawer.classList.remove('drawer-open');
        drawer.classList.add('drawer-closed');
      }
    }

    async function renderThumbnailsDrawer() {
      const container = document.getElementById('thumbnails-container');
      container.innerHTML = '';

      for (let i = 1; i <= state.totalPages; i++) {
        const wrapper = document.createElement('div');
        const isActive = i === state.currentPage;
        
        wrapper.className = `p-2 rounded-xl flex flex-col gap-1.5 transition-colors cursor-pointer border ${isActive ? 'bg-white/10 border-white/20' : 'bg-white/[0.02] border-white/5 hover:bg-white/[0.08]'}`;
        
        wrapper.onclick = async () => {
          state.currentPage = i;
          await renderCurrentPage();
          centerDocument();
          toggleDrawer(false); 
          renderThumbnailsDrawer();
        };

        const canvasId = `thumb-page-${i}`;

        wrapper.innerHTML = `
          <div class="flex items-center justify-between text-zinc-400 px-0.5">
            <span class="text-[11px] font-semibold ${isActive ? 'text-white' : 'text-zinc-400'}">Pág ${i}</span>
            <div class="flex items-center gap-1">
              <button onclick="event.stopPropagation(); rotatePage(${i})" class="hover:text-white p-1 rounded" title="Girar 90°"><i class="ph-bold ph-arrows-clockwise"></i></button>
              <button onclick="event.stopPropagation(); deletePage(${i})" class="hover:text-red-400 p-1 rounded" title="Excluir"><i class="ph-bold ph-trash"></i></button>
            </div>
          </div>
          <div class="w-full bg-white rounded-lg overflow-hidden shadow-inner border border-zinc-200">
             <canvas id="${canvasId}" class="w-full h-auto block"></canvas>
          </div>
        `;
        container.appendChild(wrapper);

        state.pdfJsDoc.getPage(i).then(page => {
            const canvas = document.getElementById(canvasId);
            if(!canvas) return;
            const ctx = canvas.getContext('2d');
            
            const baseViewport = page.getViewport({ scale: 1 });
            const thumbScale = 160 / baseViewport.width; 
            const viewport = page.getViewport({ scale: thumbScale });
            
            canvas.width = viewport.width;
            canvas.height = viewport.height;
            page.render({ canvasContext: ctx, viewport });
        });
      }
    }

    async function addNewBlankPage() {
      state.pdfDocLib.addPage([595.28, 841.89]);
      const newBytes = await state.pdfDocLib.save();
      await loadPdfData(newBytes);
      state.currentPage = state.totalPages;
      await renderCurrentPage();
      centerDocument();
      renderThumbnailsDrawer();
    }

    async function rotatePage(pageNum) {
      const page = state.pdfDocLib.getPage(pageNum - 1);
      const currentRotation = page.getRotation().angle;
      page.setRotation(PDFLib.degrees((currentRotation + 90) % 360));
      
      const newBytes = await state.pdfDocLib.save();
      await loadPdfData(newBytes);
    }

    async function deletePage(pageNum) {
      if (state.totalPages <= 1) {
        alert("O PDF precisa ter pelo menos 1 página.");
        return;
      }
      if (!confirm(`Remover página ${pageNum}?`)) return;

      state.pdfDocLib.removePage(pageNum - 1);
      
      for (let i = pageNum; i < state.totalPages; i++) {
        state.edits[i] = state.edits[i+1];
      }
      delete state.edits[state.totalPages];

      const newBytes = await state.pdfDocLib.save();
      await loadPdfData(newBytes);
    }

    // ==== EXPORTAÇÃO FINAL DO ARQUIVO ====
    async function exportFinalPDF() {
      if (!state.pdfDocLib) return;
      document.getElementById('sync-status').innerText = "Gerando...";

      try {
        for (let i = 1; i <= state.totalPages; i++) {
          const edits = state.edits[i];
          if (!edits || (edits.paths.length === 0 && edits.texts.length === 0 && edits.images.length === 0)) continue;

          const page = state.pdfDocLib.getPage(i - 1);
          const { width, height } = page.getSize();

          // Incorporar Traçados
          if (edits.paths.length > 0) {
            const offCanvas = document.createElement('canvas');
            offCanvas.width = width * 2;
            offCanvas.height = height * 2;
            const offCtx = offCanvas.getContext('2d');

            const viewScale = (width * 2) / (pdfLayer.width / 2);

            edits.paths.forEach(path => {
              if (path.length < 2) return;
              offCtx.beginPath();
              offCtx.strokeStyle = path[0].c;
              offCtx.lineWidth = (path[0].w || 3) * viewScale; 
              offCtx.lineCap = 'round';
              offCtx.lineJoin = 'round';
              offCtx.moveTo(path[0].x * 2 * viewScale, path[0].y * 2 * viewScale);
              for (let p = 1; p < path.length; p++) {
                offCtx.lineTo(path[p].x * 2 * viewScale, path[p].y * 2 * viewScale);
              }
              offCtx.stroke();
            });

            const pngDataUrl = offCanvas.toDataURL('image/png');
            const pngImage = await state.pdfDocLib.embedPng(pngDataUrl);
            page.drawImage(pngImage, { x: 0, y: 0, width: width, height: height });
          }

          // Incorporar Textos
          if (edits.texts.length > 0) {
            const font = await state.pdfDocLib.embedFont(PDFLib.StandardFonts.Helvetica);
            for (const txt of edits.texts) {
              const pdfJsPage = await state.pdfJsDoc.getPage(i);
              const viewport = pdfJsPage.getViewport({ scale: 1 });
              const scaleX = width / viewport.width;
              const scaleY = height / viewport.height;

              const rgbRegex = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i;
              const result = rgbRegex.exec(txt.color);
              const r = result ? parseInt(result[1], 16) / 255 : 0;
              const g = result ? parseInt(result[2], 16) / 255 : 0;
              const b = result ? parseInt(result[3], 16) / 255 : 0;

              page.drawText(txt.text, {
                x: txt.x * scaleX,
                y: height - (txt.y * scaleY) - 12,
                size: 14,
                font: font,
                color: PDFLib.rgb(r, g, b)
              });
            }
          }

          // Incorporar Imagens
          if (edits.images.length > 0) {
            for (const imgData of edits.images) {
              const pdfJsPage = await state.pdfJsDoc.getPage(i);
              const viewport = pdfJsPage.getViewport({ scale: 1 });
              const scaleX = width / viewport.width;
              const scaleY = height / viewport.height;

              const embeddedImg = await state.pdfDocLib.embedPng(imgData.src);
              page.drawImage(embeddedImg, {
                x: imgData.x * scaleX,
                y: height - ((imgData.y + imgData.height) * scaleY),
                width: imgData.width * scaleX,
                height: imgData.height * scaleY
              });
            }
          }
        }

        const finalBytes = await state.pdfDocLib.save();
        const blob = new Blob([finalBytes], { type: 'application/pdf' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `Editado_${state.filename}`;
        link.click();

        document.getElementById('sync-status').innerText = "Pronto";
      } catch (err) {
        alert("Erro ao exportar PDF.");
        console.error(err);
        document.getElementById('sync-status').innerText = "Erro";
      }
    }

    // Auxiliar Hex to RGBA
    function hexToRgba(hex, alpha) {
      const r = parseInt(hex.slice(1, 3), 16);
      const g = parseInt(hex.slice(3, 5), 16);
      const b = parseInt(hex.slice(5, 7), 16);
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    initEditor();
  </script>
