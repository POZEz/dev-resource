<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Controlo Financeiro</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script>
    tailwind.config = {
        darkMode: 'class',
        theme: {
            extend: {
                fontFamily: { sans: ['Inter', 'sans-serif'] },
                colors: { 
                    matte: {
                        bg: '#09090b',
                        card: '#18181b',
                        border: '#27272a',
                        text: '#fafafa',
                        muted: '#a1a1aa'
                    }
                }
            }
        }
    }
  </script>

  <style>
    body { 
        background-color: #09090b; 
        color: #fafafa; 
        -webkit-tap-highlight-color: transparent; 
        overflow-x: hidden;
    }
    
    /* Scrollbar elegante */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #52525b; }

    /* Utilitários sem scrollbar para menus horizontais */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Inputs Modernos Customizados */
    input[type="text"], input[type="number"], select {
        color-scheme: dark;
    }

    /* Animações suaves para os modais e toasts */
    @keyframes slideUp {
      from { transform: translateY(15px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    @keyframes slideIn { 
      from { transform: translateY(-15px) translateX(-50%); opacity: 0; } 
      to { transform: translateY(0) translateX(-50%); opacity: 1; } 
    }
    
    .modal-anim { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .toast-anim { animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    
    /* Progress Circle Animation */
    .circle-progress {
        transition: stroke-dashoffset 1s ease-out;
    }
  </style>
</head>
<body class="antialiased min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const MONTHS = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
    const MONTHS_SHORT = ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'];
    const CURRENT_YEAR = new Date().getFullYear();
    const CURRENT_MONTH = new Date().getMonth();

    const ICONS_LIST = ['ph-piggy-bank', 'ph-car', 'ph-airplane-tilt', 'ph-house', 'ph-graduation-cap', 'ph-laptop', 'ph-heart', 'ph-wallet'];

    const formatMoney = (val) => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(val);
    const generateId = () => crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).substring(2, 15);

    function App() {
      // ESTADO PRINCIPAL (Atualizado para suportar metas/goals)
      const [data, setData] = useState(() => {
        const saved = localStorage.getItem('finances_premium_v1');
        if (saved) return JSON.parse(saved);
        
        // Estrutura inicial com migração automática caso exista dado antigo
        const oldSaved = localStorage.getItem('finances_simple_data_pt');
        if (oldSaved) {
            const oldData = JSON.parse(oldSaved);
            return { ...oldData, goals: [] };
        }
        
        return { year: CURRENT_YEAR, items: [], goals: [] };
      });

      // ESTATES DE INTERFACE
      const [expandedMonths, setExpandedMonths] = useState(new Set([CURRENT_MONTH]));
      
      const [txModal, setTxModal] = useState({ isOpen: false, item: null });
      const [goalModal, setGoalModal] = useState({ isOpen: false, item: null });
      const [depositModal, setDepositModal] = useState({ isOpen: false, goal: null });
      
      const [confirmDelete, setConfirmDelete] = useState(false);
      const [showClearConfirm, setShowClearConfirm] = useState(false);
      const [toast, setToast] = useState(null);
      
      const fileInputRef = useRef(null);

      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3500);
      };

      useEffect(() => {
        localStorage.setItem('finances_premium_v1', JSON.stringify(data));
      }, [data]);

      const stats = useMemo(() => {
        let totalIncome = 0;
        let totalExpense = 0;
        const monthly = Array(12).fill(null).map(() => ({ income: 0, expense: 0, items: [] }));

        data.items.forEach(item => {
          if (item.type === 'income') {
            totalIncome += item.value;
            monthly[item.month].income += item.value;
          } else {
            totalExpense += item.value;
            monthly[item.month].expense += item.value;
          }
          monthly[item.month].items.push(item);
        });

        // Cálculos Globais
        const balance = totalIncome - totalExpense;
        const totalSaved = (data.goals || []).reduce((acc, g) => acc + (g.current || 0), 0);
        const freeBalance = balance - totalSaved; // Dinheiro que não está nas metas

        // Alerta de Gastos
        let prevExpenseSum = 0;
        let prevMonthsCount = 0;
        for (let i = 0; i < CURRENT_MONTH; i++) {
          if (monthly[i].expense > 0 || monthly[i].income > 0) {
            prevExpenseSum += monthly[i].expense;
            prevMonthsCount++;
          }
        }
        const avgPrevExpense = prevMonthsCount > 0 ? prevExpenseSum / prevMonthsCount : 0;
        const isSpendingMoreThanAvg = prevMonthsCount > 0 && monthly[CURRENT_MONTH].expense > avgPrevExpense;

        return { 
            totalIncome, totalExpense, balance, freeBalance, totalSaved, 
            monthly, isSpendingMoreThanAvg, avgPrevExpense 
        };
      }, [data]);

      const handleSaveTx = (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        let valorInput = parseFloat(formData.get('value').replace(',', '.'));
        
        const newItem = {
          id: txModal.item?.id || generateId(),
          name: formData.get('name'),
          value: valorInput,
          type: formData.get('type'),
          month: parseInt(formData.get('month')),
          year: data.year
        };

        setData(prev => {
          const filtered = prev.items.filter(i => i.id !== newItem.id);
          return { ...prev, items: [...filtered, newItem] };
        });
        
        setExpandedMonths(prev => new Set([...prev, newItem.month]));
        setTxModal({ isOpen: false, item: null });
        showToast('Registo salvo com sucesso.');
      };

      const handleDeleteTx = (id) => {
        setData(prev => ({ ...prev, items: prev.items.filter(i => i.id !== id) }));
        setTxModal({ isOpen: false, item: null });
        showToast('Registo apagado.', 'error');
      };

      const handleSaveGoal = (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        let targetValue = parseFloat(formData.get('target').replace(',', '.'));
        
        const newGoal = {
          id: goalModal.item?.id || generateId(),
          name: formData.get('name'),
          target: targetValue,
          current: goalModal.item?.current || 0,
          icon: formData.get('icon'),
          color: formData.get('color')
        };

        setData(prev => {
          const goals = prev.goals || [];
          const filtered = goals.filter(g => g.id !== newGoal.id);
          return { ...prev, goals: [...filtered, newGoal] };
        });
        
        setGoalModal({ isOpen: false, item: null });
        showToast('Meta financeira definida!');
      };

      const handleDeleteGoal = (id) => {
        setData(prev => ({ ...prev, goals: (prev.goals || []).filter(g => g.id !== id) }));
        setGoalModal({ isOpen: false, item: null });
        showToast('Meta financeira apagada.', 'error');
      };

      const handleDeposit = (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        let amount = parseFloat(formData.get('amount').replace(',', '.'));
        const action = formData.get('action'); // add ou remove

        if(action === 'remove') amount = -amount;

        setData(prev => {
            const goals = [...(prev.goals || [])];
            const idx = goals.findIndex(g => g.id === depositModal.goal.id);
            if(idx !== -1) {
                let newCurrent = goals[idx].current + amount;
                if(newCurrent < 0) newCurrent = 0; // Impede saldo negativo na meta
                goals[idx] = { ...goals[idx], current: newCurrent };
            }
            return { ...prev, goals };
        });

        setDepositModal({ isOpen: false, goal: null });
        showToast(action === 'add' ? 'Dinheiro guardado!' : 'Dinheiro resgatado!');
      };

      const downloadBackup = () => {
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href = url; a.download = `financas_backup_${data.year}.json`;
        a.click(); URL.revokeObjectURL(url); showToast('Backup exportado!');
      };

      const handleImportJson = (e) => {
        const file = e.target.files[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const imported = JSON.parse(event.target.result);
            if (imported.year && Array.isArray(imported.items)) {
              setData({ ...imported, goals: imported.goals || [] });
              showToast('Dados restaurados!');
            } else throw new Error();
          } catch (err) { showToast('Ficheiro inválido.', 'error'); }
        };
        reader.readAsText(file); e.target.value = '';
      };

      const handleResetData = () => {
        setData({ year: CURRENT_YEAR, items: [], goals: [] });
        setShowClearConfirm(false); showToast('Dados formatados.');
      };

      const toggleMonth = (idx) => {
        setExpandedMonths(prev => { const n = new Set(prev); n.has(idx) ? n.delete(idx) : n.add(idx); return n; });
      };

      return (
        <div className="pb-24 font-sans relative">
          
          {/* TOAST NOTIFICATION */}
          {toast && (
            <div className={`fixed top-6 left-1/2 -translate-x-1/2 z-[100] px-4 py-3 rounded-xl shadow-2xl border border-white/[0.05] flex items-center gap-3 toast-anim pointer-events-auto bg-zinc-800`}>
              <i className={`ph-fill ${toast.type === 'error' ? 'ph-warning-circle text-red-500' : 'ph-check-circle text-blue-400'} text-lg`}></i>
              <span className="text-sm font-medium text-zinc-200 whitespace-nowrap">{toast.message}</span>
            </div>
          )}

          {/* CABEÇALHO */}
          <header className="sticky top-0 z-40 bg-matte-bg/90 backdrop-blur-md border-b border-white/[0.04]">
            <div className="max-w-2xl mx-auto px-4 py-3 flex justify-between items-center gap-4">
              <div className="flex items-center gap-3">
                <div className="bg-emerald-500/10 p-2 rounded-lg text-emerald-400">
                  <i className="ph-fill ph-wallet text-xl"></i>
                </div>
                <div>
                  <h1 className="text-base font-bold text-white leading-tight">Finanças</h1>
                  <p className="text-[10px] text-zinc-500 font-medium tracking-wide">Painel de {data.year}</p>
                </div>
              </div>
              
              <div className="flex items-center gap-2">
                <input type="file" accept=".json" ref={fileInputRef} onChange={handleImportJson} className="hidden" />
                <button onClick={() => fileInputRef.current.click()} title="Restaurar Backup" className="p-2 bg-white/[0.03] hover:bg-white/10 rounded-lg text-zinc-400 hover:text-white transition-colors">
                  <i className="ph-bold ph-upload-simple text-lg"></i>
                </button>
                <button onClick={downloadBackup} title="Criar Backup" className="p-2 bg-white/[0.03] hover:bg-white/10 rounded-lg text-zinc-400 hover:text-white transition-colors">
                  <i className="ph-bold ph-download-simple text-lg"></i>
                </button>
                <div className="w-px h-5 bg-white/[0.1] mx-1"></div>
                <button onClick={() => setShowClearConfirm(true)} title="Apagar Tudo" className="p-2 bg-red-500/10 hover:bg-red-500/20 text-red-400 rounded-lg transition-colors">
                  <i className="ph-bold ph-trash text-lg"></i>
                </button>
              </div>
            </div>
          </header>

          <main className="max-w-2xl mx-auto px-4 sm:px-6 mt-6 space-y-8">
            
            {/* NOVO PAINEL GERAL (Saldo, Livre e Guardado) */}
            <div className="bg-white/[0.02] rounded-2xl shadow-sm p-6 border border-white/[0.05] relative overflow-hidden">
              <div className="absolute top-0 right-0 w-40 h-40 bg-emerald-500/5 rounded-full blur-3xl -mr-10 -mt-10"></div>
              
              <div className="text-center mb-6 relative z-10">
                <p className="text-[10px] font-bold text-zinc-500 uppercase tracking-wider mb-1">Patrimônio Líquido</p>
                <p className={`text-4xl font-black tracking-tight ${stats.balance < 0 ? 'text-red-400' : 'text-white'}`}>
                  {formatMoney(stats.balance)}
                </p>
              </div>
              
              <div className="grid grid-cols-2 gap-4 pt-5 border-t border-white/[0.05] relative z-10">
                <div className="bg-blue-500/5 p-3 rounded-xl border border-blue-500/10">
                  <p className="text-[10px] font-bold text-blue-400/70 uppercase tracking-wider flex items-center gap-1.5 mb-1">
                    <i className="ph-fill ph-lock-key"></i> Guardado (Metas)
                  </p>
                  <p className="text-lg font-bold text-blue-400 truncate">{formatMoney(stats.totalSaved)}</p>
                </div>
                <div className="bg-emerald-500/5 p-3 rounded-xl border border-emerald-500/10">
                  <p className="text-[10px] font-bold text-emerald-400/70 uppercase tracking-wider flex items-center gap-1.5 mb-1">
                    <i className="ph-fill ph-money"></i> Livre (Disponível)
                  </p>
                  <p className="text-lg font-bold text-emerald-400 truncate">{formatMoney(stats.freeBalance)}</p>
                </div>
              </div>
            </div>

            {/* SEÇÃO DE METAS & POUPANÇA */}
            <div className="space-y-4">
                <div className="flex justify-between items-center">
                    <h2 className="text-sm font-bold text-white uppercase tracking-wider flex items-center gap-2">
                        <i class="ph-fill ph-target text-blue-400 text-lg"></i> Metas & Poupança
                    </h2>
                    <button onClick={() => { setConfirmDelete(false); setGoalModal({ isOpen: true, item: null }); }} className="text-[10px] font-bold bg-white/[0.05] hover:bg-white/[0.1] text-zinc-300 px-3 py-1.5 rounded-lg transition-colors uppercase tracking-wider">
                        Nova Meta
                    </button>
                </div>

                {(!data.goals || data.goals.length === 0) ? (
                    <div className="bg-white/[0.01] border border-white/[0.03] rounded-2xl p-6 text-center border-dashed">
                        <i className="ph ph-piggy-bank text-3xl text-zinc-600 mb-2"></i>
                        <p className="text-sm text-zinc-500">Nenhuma meta definida.</p>
                        <p className="text-[10px] text-zinc-600 mt-1">Crie metas para organizar o seu dinheiro guardado.</p>
                    </div>
                ) : (
                    <div className="flex gap-4 overflow-x-auto no-scrollbar pb-2 snap-x">
                        {data.goals.map(goal => {
                            const pct = Math.min(100, Math.round((goal.current / goal.target) * 100));
                            const strokeDashoffset = 100 - pct;
                            const isCompleted = pct === 100;

                            return (
                                <div key={goal.id} className="min-w-[240px] w-[240px] bg-white/[0.02] border border-white/[0.05] rounded-2xl p-4 snap-start relative flex flex-col justify-between">
                                    <div className="flex justify-between items-start mb-4">
                                        <div className={`w-10 h-10 rounded-xl flex items-center justify-center ${goal.color || 'bg-blue-500'}/20 text-${goal.color ? goal.color.split('-')[1] : 'blue'}-400`}>
                                            <i className={`ph-fill ${goal.icon || 'ph-target'} text-xl`}></i>
                                        </div>
                                        <button onClick={() => { setConfirmDelete(false); setGoalModal({ isOpen: true, item: goal }); }} className="text-zinc-500 hover:text-white p-1">
                                            <i className="ph-bold ph-pencil-simple"></i>
                                        </button>
                                    </div>
                                    
                                    <div>
                                        <h3 className="font-bold text-white text-base truncate mb-1">{goal.name}</h3>
                                        <p className="text-xs text-zinc-500 font-medium">
                                            <span className="text-zinc-300">{formatMoney(goal.current)}</span> / {formatMoney(goal.target)}
                                        </p>
                                    </div>

                                    <div className="mt-4 pt-4 border-t border-white/[0.05] flex items-center justify-between gap-3">
                                        {/* Barra de Progresso */}
                                        <div className="flex-1">
                                            <div className="flex justify-between text-[10px] font-bold mb-1.5">
                                                <span className={isCompleted ? 'text-emerald-400' : 'text-zinc-500'}>{isCompleted ? 'Concluída!' : 'Progresso'}</span>
                                                <span className="text-zinc-400">{pct}%</span>
                                            </div>
                                            <div className="h-1.5 w-full bg-white/[0.05] rounded-full overflow-hidden">
                                                <div className={`h-full rounded-full transition-all duration-1000 ${isCompleted ? 'bg-emerald-400' : 'bg-blue-500'}`} style={{ width: `${pct}%` }}></div>
                                            </div>
                                        </div>

                                        <button onClick={() => setDepositModal({isOpen: true, goal})} className="w-8 h-8 rounded-full bg-white/[0.05] hover:bg-white/[0.1] text-zinc-300 flex items-center justify-center shrink-0 transition-colors">
                                            <i className="ph-bold ph-plus"></i>
                                        </button>
                                    </div>
                                </div>
                            )
                        })}
                    </div>
                )}
            </div>

            {/* ALERTA INTELIGENTE */}
            {stats.isSpendingMoreThanAvg && (
              <div className="bg-amber-500/10 border border-amber-500/20 rounded-xl p-4 flex items-start gap-3 alert-anim">
                <i className="ph-fill ph-warning-circle text-amber-400 text-xl shrink-0 mt-0.5"></i>
                <div className="text-sm leading-relaxed text-amber-200/80">
                  <strong className="text-amber-400 block mb-0.5">Atenção ao ritmo de gastos</strong>
                  Os seus gastos este mês ({formatMoney(stats.monthly[CURRENT_MONTH].expense)}) 
                  já superam a sua média anterior ({formatMoney(stats.avgPrevExpense)}).
                </div>
              </div>
            )}

            {/* LISTA DE MESES (ACCORDION) */}
            <div className="space-y-4 pt-2">
              <h2 className="text-sm font-bold text-white uppercase tracking-wider flex items-center gap-2 mb-2">
                  <i class="ph-fill ph-calendar-blank text-zinc-400 text-lg"></i> Extrato Mensal
              </h2>

              {MONTHS.map((monthName, idx) => {
                const mData = stats.monthly[idx];
                const isExpanded = expandedMonths.has(idx);
                const hasItems = mData.items.length > 0;
                
                const sobra = mData.income - mData.expense;
                const isPositive = sobra >= 0;

                // Não mostra meses vazios do futuro
                if (!hasItems && idx > CURRENT_MONTH && !isExpanded) return null;

                return (
                  <div key={idx} className={`bg-white/[0.02] rounded-xl border ${idx === CURRENT_MONTH ? 'border-white/[0.1] shadow-[0_0_15px_rgba(255,255,255,0.03)]' : 'border-white/[0.05]'} overflow-hidden transition-colors`}>
                    <button onClick={() => toggleMonth(idx)} className="w-full px-4 py-4 flex items-center justify-between outline-none hover:bg-white/[0.02] transition-colors">
                      <div className="flex items-center gap-3">
                        <div className={`w-10 h-10 rounded-full flex items-center justify-center text-xs font-bold transition-colors ${idx === CURRENT_MONTH ? 'bg-zinc-200 text-black' : 'bg-white/[0.05] text-zinc-400'}`}>
                          {MONTHS_SHORT[idx]}
                        </div>
                        <div className="text-left">
                          <p className="font-bold text-white leading-tight">{monthName}</p>
                          {hasItems ? (
                              <p className={`text-[10px] font-bold uppercase tracking-wider mt-0.5 ${isPositive ? 'text-emerald-400' : 'text-red-400'}`}>
                                  Sobra: {formatMoney(sobra)}
                              </p>
                          ) : (
                              <p className="text-[10px] font-medium text-zinc-600 mt-0.5">Sem movimentos</p>
                          )}
                        </div>
                      </div>
                      
                      <div className="flex items-center gap-4 text-zinc-500">
                        {hasItems && (
                            <div className="hidden sm:flex flex-col items-end text-[10px] font-semibold mr-2">
                                <span className="text-emerald-400/80">+{formatMoney(mData.income)}</span>
                                <span className="text-red-400/80">-{formatMoney(mData.expense)}</span>
                            </div>
                        )}
                        <i className={`ph-bold ph-caret-down transition-transform duration-300 ${isExpanded ? 'rotate-180 text-white' : ''}`}></i>
                      </div>
                    </button>

                    {/* CONTEÚDO DO MÊS */}
                    <div className={`grid transition-[grid-template-rows] duration-300 ease-in-out ${isExpanded ? 'grid-rows-[1fr]' : 'grid-rows-[0fr]'}`}>
                      <div className="overflow-hidden">
                        <div className="bg-black/20 border-t border-white/[0.02]">
                          {!hasItems ? (
                            <div className="text-center py-6">
                              <i className="ph ph-receipt text-2xl text-zinc-700 mb-2"></i>
                              <p className="text-sm text-zinc-600">Nenhum registo neste mês.</p>
                            </div>
                          ) : (
                            <ul className="divide-y divide-white/[0.02]">
                              {mData.items.sort((a,b) => b.value - a.value).map(item => (
                                <li 
                                  key={item.id} 
                                  onClick={() => { setConfirmDelete(false); setTxModal({ isOpen: true, item }); }}
                                  className="px-4 py-3.5 flex justify-between items-center cursor-pointer hover:bg-white/[0.02] transition-colors"
                                >
                                  <div className="flex items-center gap-3 truncate pr-4">
                                    <div className={`w-8 h-8 rounded-full flex items-center justify-center shrink-0 ${item.type === 'income' ? 'bg-emerald-500/10 text-emerald-400' : 'bg-red-500/10 text-red-400'}`}>
                                      <i className={`ph-bold ${item.type === 'income' ? 'ph-arrow-down-left' : 'ph-arrow-up-right'} text-sm`}></i>
                                    </div>
                                    <span className="text-zinc-200 font-medium truncate text-sm">{item.name}</span>
                                  </div>
                                  <span className={`font-bold text-sm whitespace-nowrap ${item.type === 'income' ? 'text-emerald-400' : 'text-zinc-100'}`}>
                                    {item.type === 'expense' ? '- ' : '+ '}{formatMoney(item.value)}
                                  </span>
                                </li>
                              ))}
                            </ul>
                          )}
                        </div>
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          </main>

          {/* BOTÃO FLUTUANTE (FAB) PARA TRANSAÇÃO */}
          <button 
            onClick={() => { setConfirmDelete(false); setTxModal({ isOpen: true, item: null }); }}
            className="fixed bottom-6 right-6 w-14 h-14 bg-zinc-200 hover:bg-white text-black rounded-full shadow-[0_0_20px_rgba(255,255,255,0.15)] flex items-center justify-center transition-transform active:scale-90 z-30"
          >
            <i className="ph-bold ph-plus text-2xl"></i>
          </button>

          {/* ================= MODALS ================= */}

          {/* MODAL TRANSAÇÃO (NOVO / EDITAR) */}
          <div className={`fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center transition-opacity duration-300 ${txModal.isOpen ? 'opacity-100 pointer-events-auto' : 'opacity-0 pointer-events-none'}`}>
            {txModal.isOpen && (
              <div className="bg-matte-card w-full sm:max-w-sm rounded-t-2xl sm:rounded-2xl border border-white/[0.05] p-6 shadow-2xl modal-anim">
                <div className="flex justify-between items-center mb-6">
                  <h2 className="text-lg font-bold text-white">{txModal.item ? 'Editar Registo' : 'Novo Registo'}</h2>
                  <button onClick={() => setTxModal({isOpen: false, item: null})} className="p-2 bg-white/[0.03] hover:bg-white/10 rounded-full text-zinc-400 transition-colors"><i className="ph-bold ph-x text-lg"></i></button>
                </div>

                <form onSubmit={handleSaveTx} className="space-y-5">
                  <div className="flex gap-2 p-1.5 bg-white/[0.02] border border-white/[0.05] rounded-xl">
                    <label className="flex-1 cursor-pointer">
                      <input type="radio" name="type" value="expense" defaultChecked={txModal.item?.type !== 'income'} className="peer sr-only" />
                      <div className="text-center py-2.5 text-sm font-bold rounded-lg text-zinc-500 hover:text-zinc-300 peer-checked:bg-red-500/10 peer-checked:text-red-400 peer-checked:border-red-500/20 border border-transparent transition-all">Gasto</div>
                    </label>
                    <label className="flex-1 cursor-pointer">
                      <input type="radio" name="type" value="income" defaultChecked={txModal.item?.type === 'income'} className="peer sr-only" />
                      <div className="text-center py-2.5 text-sm font-bold rounded-lg text-zinc-500 hover:text-zinc-300 peer-checked:bg-emerald-500/10 peer-checked:text-emerald-400 peer-checked:border-emerald-500/20 border border-transparent transition-all">Receita</div>
                    </label>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-zinc-500 uppercase mb-1.5 tracking-wide">Descrição</label>
                    <input type="text" name="name" required autoFocus defaultValue={txModal.item?.name} placeholder="Ex: Supermercado, Salário..." className="w-full bg-white/[0.02] border border-white/[0.05] rounded-xl px-4 py-3 text-sm text-white outline-none focus:border-zinc-500 transition-colors" />
                  </div>

                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className="block text-xs font-semibold text-zinc-500 uppercase mb-1.5 tracking-wide">Valor (R$)</label>
                      <input type="number" name="value" required step="0.01" min="0" defaultValue={txModal.item?.value} placeholder="0.00" className="w-full bg-white/[0.02] border border-white/[0.05] rounded-xl px-4 py-3 text-sm text-white outline-none focus:border-zinc-500 transition-colors font-semibold" />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-zinc-500 uppercase mb-1.5 tracking-wide">Mês</label>
                      <select name="month" defaultValue={txModal.item?.month ?? CURRENT_MONTH} className="w-full bg-white/[0.02] border border-white/[0.05] rounded-xl px-4 py-3 text-sm text-white outline-none focus:border-zinc-500 transition-colors cursor-pointer appearance-none">
                        {MONTHS.map((m, i) => <option key={i} value={i} className="bg-matte-card">{m}</option>)}
                      </select>
                    </div>
                  </div>

                  <div className="pt-2 flex gap-3">
                    {txModal.item && (
                      <button type="button" onClick={() => { confirmDelete ? handleDeleteTx(txModal.item.id) : setConfirmDelete(true) }} className={`py-3.5 rounded-xl transition-all flex items-center justify-center font-bold text-sm ${confirmDelete ? 'bg-red-500 hover:bg-red-600 text-white flex-1' : 'bg-red-500/10 text-red-400 hover:bg-red-500/20 px-4'}`}>
                        {confirmDelete ? 'Excluir?' : <i className="ph-bold ph-trash text-lg"></i>}
                      </button>
                    )}
                    {(!confirmDelete || !txModal.item) && (
                      <button type="submit" className="flex-1 bg-zinc-200 hover:bg-white text-black font-bold py-3.5 px-4 rounded-xl transition-colors active:scale-95">Salvar</button>
                    )}
                  </div>
                </form>
              </div>
            )}
          </div>

          {/* MODAL META (CRIAR / EDITAR) */}
          <div className={`fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center transition-opacity duration-300 ${goalModal.isOpen ? 'opacity-100 pointer-events-auto' : 'opacity-0 pointer-events-none'}`}>
            {goalModal.isOpen && (
              <div className="bg-matte-card w-full sm:max-w-sm rounded-t-2xl sm:rounded-2xl border border-white/[0.05] p-6 shadow-2xl modal-anim">
                <div className="flex justify-between items-center mb-6">
                  <h2 className="text-lg font-bold text-white">{goalModal.item ? 'Editar Meta' : 'Criar Nova Meta'}</h2>
                  <button onClick={() => setGoalModal({isOpen: false, item: null})} className="p-2 bg-white/[0.03] hover:bg-white/10 rounded-full text-zinc-400 transition-colors"><i className="ph-bold ph-x text-lg"></i></button>
                </div>

                <form onSubmit={handleSaveGoal} className="space-y-4">
                  <div>
                    <label className="block text-xs font-semibold text-zinc-500 uppercase mb-1.5 tracking-wide">Nome da Meta</label>
                    <input type="text" name="name" required autoFocus defaultValue={goalModal.item?.name} placeholder="Ex: Viagem, Carro Novo..." className="w-full bg-white/[0.02] border border-white/[0.05] rounded-xl px-4 py-3 text-sm text-white outline-none focus:border-blue-500/50 transition-colors" />
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-zinc-500 uppercase mb-1.5 tracking-wide">Valor Alvo (R$)</label>
                    <input type="number" name="target" required step="0.01" min="1" defaultValue={goalModal.item?.target} placeholder="Ex: 5000.00" className="w-full bg-white/[0.02] border border-white/[0.05] rounded-xl px-4 py-3 text-sm text-white outline-none focus:border-blue-500/50 transition-colors font-semibold" />
                  </div>

                  <div className="grid grid-cols-2 gap-4">
                    <div>
                        <label className="block text-xs font-semibold text-zinc-500 uppercase mb-1.5 tracking-wide">Cor</label>
                        <select name="color" defaultValue={goalModal.item?.color || 'bg-blue-500'} className="w-full bg-white/[0.02] border border-white/[0.05] rounded-xl px-4 py-3 text-sm text-white outline-none focus:border-blue-500/50 transition-colors cursor-pointer appearance-none">
                            <option value="bg-blue-500" className="bg-matte-card text-blue-400">Azul</option>
                            <option value="bg-emerald-500" className="bg-matte-card text-emerald-400">Verde</option>
                            <option value="bg-purple-500" className="bg-matte-card text-purple-400">Roxo</option>
                            <option value="bg-amber-500" className="bg-matte-card text-amber-400">Laranja</option>
                            <option value="bg-pink-500" className="bg-matte-card text-pink-400">Rosa</option>
                        </select>
                    </div>
                    <div>
                        <label className="block text-xs font-semibold text-zinc-500 uppercase mb-1.5 tracking-wide">Ícone</label>
                        <select name="icon" defaultValue={goalModal.item?.icon || 'ph-target'} className="w-full bg-white/[0.02] border border-white/[0.05] rounded-xl px-4 py-3 text-sm text-white outline-none focus:border-blue-500/50 transition-colors cursor-pointer appearance-none">
                            <option value="ph-target" className="bg-matte-card">Alvo</option>
                            <option value="ph-piggy-bank" className="bg-matte-card">Porco</option>
                            <option value="ph-car" className="bg-matte-card">Carro</option>
                            <option value="ph-airplane-tilt" className="bg-matte-card">Avião</option>
                            <option value="ph-house" className="bg-matte-card">Casa</option>
                            <option value="ph-laptop" className="bg-matte-card">PC</option>
                        </select>
                    </div>
                  </div>

                  <div className="pt-2 flex gap-3">
                    {goalModal.item && (
                      <button type="button" onClick={() => { confirmDelete ? handleDeleteGoal(goalModal.item.id) : setConfirmDelete(true) }} className={`py-3.5 rounded-xl transition-all flex items-center justify-center font-bold text-sm ${confirmDelete ? 'bg-red-500 hover:bg-red-600 text-white flex-1' : 'bg-red-500/10 text-red-400 hover:bg-red-500/20 px-4'}`}>
                        {confirmDelete ? 'Excluir Meta?' : <i className="ph-bold ph-trash text-lg"></i>}
                      </button>
                    )}
                    {(!confirmDelete || !goalModal.item) && (
                      <button type="submit" className="flex-1 bg-blue-500 hover:bg-blue-600 text-white font-bold py-3.5 px-4 rounded-xl transition-colors active:scale-95 shadow-lg shadow-blue-500/20">Salvar Meta</button>
                    )}
                  </div>
                </form>
              </div>
            )}
          </div>

          {/* MODAL ADICIONAR FUNDOS NA META */}
          <div className={`fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 transition-opacity duration-300 ${depositModal.isOpen ? 'opacity-100 pointer-events-auto' : 'opacity-0 pointer-events-none'}`}>
            {depositModal.isOpen && (
              <div className="bg-matte-card max-w-sm w-full rounded-2xl border border-white/[0.05] p-6 shadow-2xl modal-anim">
                <div className="flex justify-between items-center mb-6">
                  <h2 className="text-lg font-bold text-white flex items-center gap-2">
                    <i className="ph-fill ph-coins text-yellow-500"></i> Gerir Fundos
                  </h2>
                  <button onClick={() => setDepositModal({isOpen: false, goal: null})} className="p-2 bg-white/[0.03] hover:bg-white/10 rounded-full text-zinc-400 transition-colors"><i className="ph-bold ph-x text-lg"></i></button>
                </div>
                
                <p className="text-sm text-zinc-400 mb-4">Meta selecionada: <strong className="text-white">{depositModal.goal?.name}</strong></p>

                <form onSubmit={handleDeposit} className="space-y-4">
                  <div className="flex gap-2 p-1.5 bg-white/[0.02] border border-white/[0.05] rounded-xl mb-4">
                    <label className="flex-1 cursor-pointer">
                      <input type="radio" name="action" value="add" defaultChecked className="peer sr-only" />
                      <div className="text-center py-2.5 text-sm font-bold rounded-lg text-zinc-500 hover:text-zinc-300 peer-checked:bg-emerald-500/10 peer-checked:text-emerald-400 peer-checked:border-emerald-500/20 border border-transparent transition-all">Guardar (+)</div>
                    </label>
                    <label className="flex-1 cursor-pointer">
                      <input type="radio" name="action" value="remove" className="peer sr-only" />
                      <div className="text-center py-2.5 text-sm font-bold rounded-lg text-zinc-500 hover:text-zinc-300 peer-checked:bg-red-500/10 peer-checked:text-red-400 peer-checked:border-red-500/20 border border-transparent transition-all">Resgatar (-)</div>
                    </label>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-zinc-500 uppercase mb-1.5 tracking-wide">Valor a movimentar (R$)</label>
                    <input type="number" name="amount" required step="0.01" min="0.01" placeholder="Ex: 100.00" autoFocus className="w-full bg-white/[0.02] border border-white/[0.05] rounded-xl px-4 py-3 text-sm text-white outline-none focus:border-zinc-500 transition-colors font-semibold" />
                  </div>

                  <button type="submit" className="w-full mt-2 bg-zinc-200 hover:bg-white text-black font-bold py-3.5 px-4 rounded-xl transition-colors active:scale-95">Confirmar</button>
                </form>
              </div>
            )}
          </div>

          {/* MODAL LIMPAR DADOS */}
          <div className={`fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 transition-opacity duration-300 ${showClearConfirm ? 'opacity-100 pointer-events-auto' : 'opacity-0 pointer-events-none'}`}>
            {showClearConfirm && (
              <div className="bg-matte-card max-w-sm w-full rounded-2xl border border-white/[0.05] p-6 text-center shadow-2xl modal-anim">
                <div className="w-12 h-12 bg-red-500/10 rounded-full flex items-center justify-center mx-auto mb-4">
                  <i className="ph-fill ph-warning-circle text-2xl text-red-500"></i>
                </div>
                <h2 className="text-lg font-bold text-white mb-2">Eliminar todos os dados?</h2>
                <p className="text-zinc-400 text-sm mb-6">Esta ação não pode ser desfeita. Todos os seus registos e metas serão apagados permanentemente.</p>
                <div className="flex gap-3">
                  <button onClick={() => setShowClearConfirm(false)} className="flex-1 py-3 rounded-xl font-bold bg-white/[0.05] hover:bg-white/[0.1] text-zinc-300 transition-colors">Cancelar</button>
                  <button onClick={handleResetData} className="flex-1 py-3 rounded-xl font-bold bg-red-500 hover:bg-red-600 text-white transition-colors">Sim, Eliminar</button>
                </div>
              </div>
            )}
          </div>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
