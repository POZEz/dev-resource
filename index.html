<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#09090b">
  <title>Tabelas & Dados IA</title>

  <!-- CDNs Supabase, Tailwind, Phosphor Icons -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script src="supabase-client.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            matte: { bg: '#09090b', card: '#121214', border: '#27272a', text: '#fafafa', muted: '#a1a1aa' }
          }
        }
      }
    }
  </script>

  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #09090b; color: #fafafa; overflow: hidden; }
    .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scroll::-webkit-scrollbar-track { background: transparent; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #27272a; border-radius: 99px; }
    .custom-scroll::-webkit-scrollbar-thumb:hover { background: #3f3f46; }

    td[contenteditable="true"]:focus, th[contenteditable="true"]:focus {
      outline: 2px solid #3b82f6;
      background: rgba(59, 130, 246, 0.08);
    }
  </style>
</head>
<body class="antialiased flex flex-col h-full bg-matte-bg font-sans select-none overflow-hidden">

  <!-- CABEÇALHO DA FERRAMENTA -->
  <header class="h-12 shrink-0 bg-matte-card border-b border-matte-border px-4 flex items-center justify-between z-20">
    <div class="flex items-center gap-2">
      <div class="w-7 h-7 rounded-lg bg-amber-500/10 border border-amber-500/20 flex items-center justify-center text-amber-400">
        <i class="ph-bold ph-table text-sm"></i>
      </div>
      <input type="text" id="dataset-name" value="Tabela Sem Título" class="bg-transparent text-xs font-bold text-white focus:outline-none focus:border-b focus:border-blue-500 max-w-[180px] sm:max-w-xs truncate px-1 py-0.5">
    </div>

    <div class="flex items-center gap-2">
      <span id="sync-status" class="text-[10px] text-zinc-500 hidden sm:inline">Pronto</span>
      <button onclick="saveToCloud()" class="px-3 py-1.5 rounded-lg bg-white/[0.05] hover:bg-white/[0.1] border border-matte-border text-white text-xs font-semibold flex items-center gap-1.5 transition-colors">
        <i class="ph-bold ph-cloud-arrow-up text-sm"></i>
        <span>Salvar</span>
      </button>

      <div class="relative">
        <button onclick="toggleExportMenu()" class="px-3 py-1.5 rounded-lg bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold flex items-center gap-1.5 transition-colors shadow-sm">
          <i class="ph-bold ph-download-simple text-sm"></i>
          <span>Exportar</span>
          <i class="ph-bold ph-caret-down text-[10px]"></i>
        </button>

        <div id="export-dropdown" class="hidden absolute right-0 mt-1.5 w-40 bg-matte-card border border-matte-border rounded-xl shadow-2xl p-1 z-50 text-xs">
          <button onclick="exportData('csv')" class="w-full text-left px-3 py-2 rounded-lg hover:bg-white/[0.06] text-zinc-300 hover:text-white flex items-center gap-2">
            <i class="ph-bold ph-file-csv text-emerald-400"></i> Arquivo CSV
          </button>
          <button onclick="exportData('json')" class="w-full text-left px-3 py-2 rounded-lg hover:bg-white/[0.06] text-zinc-300 hover:text-white flex items-center gap-2">
            <i class="ph-bold ph-brackets-curly text-blue-400"></i> Formato JSON
          </button>
          <button onclick="exportData('sql')" class="w-full text-left px-3 py-2 rounded-lg hover:bg-white/[0.06] text-zinc-300 hover:text-white flex items-center gap-2">
            <i class="ph-bold ph-database text-purple-400"></i> Comandos SQL
          </button>
          <button onclick="exportData('clipboard')" class="w-full text-left px-3 py-2 rounded-lg hover:bg-white/[0.06] text-zinc-300 hover:text-white flex items-center gap-2 border-t border-matte-border mt-1 pt-1.5">
            <i class="ph-bold ph-copy text-zinc-400"></i> Copiar TSV / Excel
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- ÁREA DE COMANDO IA -->
  <section class="p-3 sm:p-4 bg-[#121214]/60 border-b border-matte-border">
    <div class="max-w-5xl mx-auto space-y-2">
      <div class="flex items-center gap-2">
        <div class="relative flex-1">
          <i class="ph-fill ph-sparkle absolute left-3.5 top-3 text-amber-400 text-sm"></i>
          <input type="text" id="ai-prompt-input" placeholder="Ex: 'Crie uma tabela com 5 modelos de carros, ano, preço e potência' ou 'Extraia dados do texto...'" class="w-full bg-black/40 border border-matte-border rounded-xl pl-9 pr-24 py-2 text-xs text-white placeholder-zinc-500 focus:outline-none focus:border-amber-500/50 shadow-inner" onkeydown="if(event.key==='Enter') generateWithAI()">
          <button onclick="generateWithAI()" id="btn-ai-generate" class="absolute right-1.5 top-1.5 px-3 py-1 rounded-lg bg-amber-500/20 hover:bg-amber-500/30 border border-amber-500/30 text-amber-300 text-xs font-bold flex items-center gap-1 transition-colors">
            <i class="ph-bold ph-magic-wand"></i>
            <span>Gerar</span>
          </button>
        </div>
      </div>

      <!-- Presets de Prompts Rápidos -->
      <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbars text-[11px] text-zinc-400">
        <span class="text-zinc-600 font-semibold uppercase text-[9px] shrink-0">Sugestões:</span>
        <button onclick="setPromptExample('Tabela de vendas com Produto, Categoria, Qtd, Preço Unitário e Total')" class="px-2 py-0.5 rounded-md bg-white/[0.02] hover:bg-white/[0.06] border border-white/5 shrink-0 transition-colors">📦 Vendas de Produtos</button>
        <button onclick="setPromptExample('Tabela de controle de despesas mensais com Descrição, Categoria, Vencimento e Valor')" class="px-2 py-0.5 rounded-md bg-white/[0.02] hover:bg-white/[0.06] border border-white/5 shrink-0 transition-colors">💰 Despesas Mensais</button>
        <button onclick="setPromptExample('Tabela de tarefas de sprint com Tarefa, Responsável, Status e Prazo')" class="px-2 py-0.5 rounded-md bg-white/[0.02] hover:bg-white/[0.06] border border-white/5 shrink-0 transition-colors">📋 Sprint Kanban</button>
      </div>
    </div>
  </section>

  <!-- BARRA DE FERRAMENTAS & MANIPULAÇÃO DE DADOS -->
  <div class="h-10 shrink-0 bg-matte-card/80 border-b border-matte-border px-4 flex items-center justify-between text-xs overflow-x-auto no-scrollbars">
    <div class="flex items-center gap-1.5">
      <button onclick="addRow()" class="px-2.5 py-1 rounded-lg bg-white/[0.03] hover:bg-white/[0.08] border border-matte-border text-zinc-300 hover:text-white flex items-center gap-1" title="Adicionar Linha">
        <i class="ph-bold ph-plus text-xs text-blue-400"></i> Linha
      </button>
      <button onclick="addColumn()" class="px-2.5 py-1 rounded-lg bg-white/[0.03] hover:bg-white/[0.08] border border-matte-border text-zinc-300 hover:text-white flex items-center gap-1" title="Adicionar Coluna">
        <i class="ph-bold ph-plus text-xs text-blue-400"></i> Coluna
      </button>
      
      <div class="h-4 w-px bg-matte-border mx-1"></div>

      <button onclick="transposeTable()" class="px-2.5 py-1 rounded-lg bg-white/[0.03] hover:bg-white/[0.08] border border-matte-border text-zinc-300 hover:text-white flex items-center gap-1" title="Inverter Linhas e Colunas">
        <i class="ph-bold ph-arrows-clockwise text-xs text-amber-400"></i> Transpor
      </button>
      <button onclick="removeDuplicates()" class="px-2.5 py-1 rounded-lg bg-white/[0.03] hover:bg-white/[0.08] border border-matte-border text-zinc-300 hover:text-white flex items-center gap-1" title="Remover Registros Repetidos">
        <i class="ph-bold ph-funnel text-xs text-indigo-400"></i> Sem Duplicatas
      </button>
      <button onclick="removeEmptyRows()" class="px-2.5 py-1 rounded-lg bg-white/[0.03] hover:bg-white/[0.08] border border-matte-border text-zinc-300 hover:text-white flex items-center gap-1" title="Eliminar Linhas Vazias">
        <i class="ph-bold ph-broom text-xs text-emerald-400"></i> Limpar Vazios
      </button>
    </div>

    <div class="flex items-center gap-2 text-[11px] text-zinc-500">
      <span id="table-stats">0 linhas &bull; 0 colunas</span>
      <button onclick="resetTable()" class="text-red-400 hover:text-red-300 p-1" title="Limpar Tabela Inteira"><i class="ph-bold ph-trash"></i></button>
    </div>
  </div>

  <!-- VISUALIZADOR DA TABELA EDITÁVEL -->
  <main class="flex-1 p-4 overflow-auto custom-scroll">
    <div class="inline-block min-w-full align-middle">
      <div class="border border-matte-border rounded-xl overflow-hidden shadow-2xl bg-matte-card">
        <table id="dynamic-table" class="min-w-full divide-y divide-matte-border text-left text-xs">
          <thead id="table-head" class="bg-white/[0.03]">
            <!-- Cabeçalhos injetados dinamicamente -->
          </thead>
          <tbody id="table-body" class="divide-y divide-matte-border/50">
            <!-- Linhas injetadas dinamicamente -->
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- LÓGICA DE DADOS, MANIPULAÇÃO E INTEGRAÇÃO GEMINI IA -->
  <script>
    let tableData = {
      headers: ["Item", "Categoria", "Quantidade", "Valor Unitário (R$)", "Total (R$)"],
      rows: [
        ["Notebook Pro", "Eletrônicos", "2", "4500.00", "9000.00"],
        ["Mouse Sem Fio", "Acessórios", "5", "120.00", "600.00"],
        ["Teclado Mecânico", "Acessórios", "3", "350.00", "1050.00"],
        ["Monitor 27 pol", "Eletrônicos", "2", "1400.00", "2800.00"]
      ]
    };

    const clientDB = window.PortalDB || (window.parent && window.parent.PortalDB) || null;

    window.addEventListener('DOMContentLoaded', () => {
      renderTable();
      document.addEventListener('click', (e) => {
        if (!e.target.closest('#export-dropdown') && !e.target.closest('button[onclick="toggleExportMenu()"]')) {
          document.getElementById('export-dropdown').classList.add('hidden');
        }
      });
    });

    // ==== RENDERIZAÇÃO DA TABELA ====
    function renderTable() {
      const thead = document.getElementById('table-head');
      const tbody = document.getElementById('table-body');

      // 1. Renderiza Cabeçalho
      let headHTML = '<tr><th class="w-10 px-3 py-2 text-center text-[10px] text-zinc-600 font-mono">#</th>';
      tableData.headers.forEach((h, colIndex) => {
        headHTML += `
          <th class="px-3 py-2 font-bold text-zinc-300 border-r border-matte-border/50 group relative">
            <div class="flex items-center justify-between gap-1">
              <span contenteditable="true" onblur="updateHeader(${colIndex}, this.innerText)" class="focus:outline-none flex-1 truncate">${h}</span>
              <button onclick="deleteColumn(${colIndex})" class="opacity-0 group-hover:opacity-100 text-zinc-500 hover:text-red-400 text-xs transition-opacity p-0.5" title="Excluir Coluna">
                <i class="ph-bold ph-x"></i>
              </button>
            </div>
          </th>
        `;
      });
      headHTML += '</tr>';
      thead.innerHTML = headHTML;

      // 2. Renderiza Linhas
      let bodyHTML = '';
      tableData.rows.forEach((row, rowIndex) => {
        bodyHTML += `<tr class="hover:bg-white/[0.015] group">`;
        bodyHTML += `
          <td class="px-2 py-2 text-center text-[10px] text-zinc-600 font-mono border-r border-matte-border/50">
            <span class="group-hover:hidden">${rowIndex + 1}</span>
            <button onclick="deleteRow(${rowIndex})" class="hidden group-hover:inline-block text-zinc-500 hover:text-red-400 p-0.5" title="Excluir Linha">
              <i class="ph-bold ph-trash"></i>
            </button>
          </td>
        `;
        row.forEach((cell, colIndex) => {
          bodyHTML += `
            <td contenteditable="true" onblur="updateCell(${rowIndex}, ${colIndex}, this.innerText)" class="px-3 py-2 text-zinc-200 border-r border-matte-border/50 whitespace-nowrap">
              ${cell}
            </td>
          `;
        });
        bodyHTML += '</tr>';
      });
      tbody.innerHTML = bodyHTML;

      document.getElementById('table-stats').innerText = `${tableData.rows.length} linhas • ${tableData.headers.length} colunas`;
    }

    function updateHeader(index, val) {
      tableData.headers[index] = val.trim() || `Coluna ${index + 1}`;
    }

    function updateCell(row, col, val) {
      if (tableData.rows[row]) {
        tableData.rows[row][col] = val.trim();
      }
    }

    function addRow() {
      const newRow = new Array(tableData.headers.length).fill('');
      tableData.rows.push(newRow);
      renderTable();
    }

    function addColumn() {
      const colName = `Coluna ${tableData.headers.length + 1}`;
      tableData.headers.push(colName);
      tableData.rows.forEach(r => r.push(''));
      renderTable();
    }

    function deleteRow(idx) {
      tableData.rows.splice(idx, 1);
      renderTable();
    }

    function deleteColumn(idx) {
      if (tableData.headers.length <= 1) {
        alert("A tabela precisa de pelo menos uma coluna.");
        return;
      }
      tableData.headers.splice(idx, 1);
      tableData.rows.forEach(r => r.splice(idx, 1));
      renderTable();
    }

    // ==== OPERAÇÕES DE DADOS ====
    function transposeTable() {
      if (tableData.rows.length === 0) return;
      const newHeaders = ['Registro', ...tableData.rows.map((_, i) => `Linha ${i + 1}`)];
      const newRows = [];

      for (let c = 0; c < tableData.headers.length; c++) {
        const row = [tableData.headers[c]];
        for (let r = 0; r < tableData.rows.length; r++) {
          row.push(tableData.rows[r][c] || '');
        }
        newRows.push(row);
      }

      tableData.headers = newHeaders;
      tableData.rows = newRows;
      renderTable();
    }

    function removeDuplicates() {
      const seen = new Set();
      tableData.rows = tableData.rows.filter(row => {
        const key = JSON.stringify(row);
        if (seen.has(key)) return false;
        seen.add(key);
        return true;
      });
      renderTable();
    }

    function removeEmptyRows() {
      tableData.rows = tableData.rows.filter(row => row.some(cell => cell && cell.trim() !== ''));
      renderTable();
    }

    function resetTable() {
      if (!confirm("Limpar toda a tabela?")) return;
      tableData = { headers: ["Coluna 1", "Coluna 2"], rows: [["", ""]] };
      renderTable();
    }

    function setPromptExample(text) {
      document.getElementById('ai-prompt-input').value = text;
      generateWithAI();
    }

    // ==== INTEGRAÇÃO GEMINI IA POR JSON ====
    async function generateWithAI() {
      const promptInput = document.getElementById('ai-prompt-input');
      const prompt = promptInput.value.trim();
      if (!prompt) return;

      const btn = document.getElementById('btn-ai-generate');
      const originalHTML = btn.innerHTML;
      btn.innerHTML = `<i class="ph-bold ph-spinner animate-spin text-sm"></i> <span>Criando...</span>`;
      btn.disabled = true;

      try {
        if (!clientDB) throw new Error("Sistema do Hub não conectado.");

        const systemInstructions = `Você é um assistente estruturador de dados. O usuário fornecerá um comando ou texto desestruturado.
Retorne ESTRITAMENTE um objeto JSON válido no seguinte formato:
{
  "title": "Título sugerido para a tabela",
  "headers": ["Nome Coluna 1", "Nome Coluna 2", "Nome Coluna 3"],
  "rows": [
    ["Dado 1", "Dado 2", "Dado 3"],
    ["Dado 4", "Dado 5", "Dado 6"]
  ]
}
Não inclua explicações, comentários ou markdown adicional fora do bloco JSON.`;

        const fullPrompt = `${systemInstructions}\n\nSolicitação do usuário: ${prompt}`;
        const response = await clientDB.callGeminiEdge(fullPrompt, { context: "data_tables" });
        
        let rawText = response.text || response.candidates?.[0]?.content?.parts?.[0]?.text || (typeof response === 'string' ? response : JSON.stringify(response));

        // Limpeza de marcação markdown ```json caso retorne
        rawText = rawText.replace(/```json/gi, '').replace(/```/g, '').trim();

        const parsed = JSON.parse(rawText);
        if (parsed.headers && Array.isArray(parsed.headers) && parsed.rows && Array.isArray(parsed.rows)) {
          tableData = {
            headers: parsed.headers,
            rows: parsed.rows
          };
          if (parsed.title) {
            document.getElementById('dataset-name').value = parsed.title;
          }
          renderTable();
          promptInput.value = '';
        } else {
          throw new Error("Formato de tabela inválido retornado pela IA.");
        }

      } catch (err) {
        alert("Erro ao processar com a IA: " + err.message);
      } finally {
        btn.innerHTML = originalHTML;
        btn.disabled = false;
      }
    }

    // ==== EXPORTAÇÃO E SINCRONIZAÇÃO ====
    function toggleExportMenu() {
      document.getElementById('export-dropdown').classList.toggle('hidden');
    }

    function exportData(format) {
      document.getElementById('export-dropdown').classList.add('hidden');
      const filename = (document.getElementById('dataset-name').value.trim() || 'tabela').replace(/\s+/g, '_');

      if (format === 'csv') {
        const csvContent = [
          tableData.headers.map(h => `"${h.replace(/"/g, '""')}"`).join(','),
          ...tableData.rows.map(r => r.map(c => `"${c.replace(/"/g, '""')}"`).join(','))
        ].join('\n');
        downloadFile(`${filename}.csv`, csvContent, 'text/csv;charset=utf-8;');
      } 
      else if (format === 'json') {
        const jsonContent = tableData.rows.map(row => {
          const obj = {};
          tableData.headers.forEach((h, i) => obj[h] = row[i] || '');
          return obj;
        });
        downloadFile(`${filename}.json`, JSON.stringify(jsonContent, null, 2), 'application/json');
      }
      else if (format === 'sql') {
        const tableName = filename.toLowerCase();
        const cols = tableData.headers.map(h => `"${h.toLowerCase().replace(/[^a-z0-9_]/g, '_')}"`).join(', ');
        const sqlRows = tableData.rows.map(r => `(${r.map(c => `'${c.replace(/'/g, "''")}'`).join(', ')})`).join(',\n  ');
        const sqlContent = `INSERT INTO "${tableName}" (${cols})\nVALUES\n  ${sqlRows};`;
        downloadFile(`${filename}.sql`, sqlContent, 'text/plain');
      }
      else if (format === 'clipboard') {
        const tsvContent = [
          tableData.headers.join('\t'),
          ...tableData.rows.map(r => r.join('\t'))
        ].join('\n');
        navigator.clipboard.writeText(tsvContent).then(() => {
          alert("Dados copiados para a área de transferência no formato compatível com Excel / Sheets!");
        });
      }
    }

    function downloadFile(name, content, type) {
      const blob = new Blob([content], { type });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = name;
      link.click();
    }

    async function saveToCloud() {
      const syncStatus = document.getElementById('sync-status');
      syncStatus.innerText = "Salvando...";
      syncStatus.className = "text-[10px] text-amber-400";

      try {
        if (!clientDB) throw new Error("Supabase não disponível.");
        const session = await clientDB.getSession();
        if (!session) throw new Error("Conecte sua conta para salvar na nuvem.");

        const tableName = document.getElementById('dataset-name').value.trim() || 'Tabela Sem Título';

        const { error } = await clientDB.supabase
          .from('user_artifacts')
          .insert({
            user_id: session.user.id,
            name: tableName,
            tool_type: 'tabelas',
            data: tableData,
            metadata: {
              rowsCount: tableData.rows.length,
              colsCount: tableData.headers.length
            }
          });

        if (error) throw error;

        syncStatus.innerText = "Salvo na Nuvem";
        syncStatus.className = "text-[10px] text-emerald-400";
        setTimeout(() => { syncStatus.innerText = "Pronto"; syncStatus.className = "text-[10px] text-zinc-500"; }, 3000);

      } catch (err) {
        syncStatus.innerText = "Erro ao salvar";
        syncStatus.className = "text-[10px] text-red-400";
        alert(err.message);
      }
    }
  </script>
</body>
</html>
