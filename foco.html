<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Plano de Estudos - Foco Ifes</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { 
                        matte: {
                            bg: '#09090b',
                            card: '#18181b',
                            border: '#27272a',
                            text: '#fafafa',
                            muted: '#a1a1aa'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body { 
            background-color: #09090b; 
            color: #fafafa; 
            -webkit-tap-highlight-color: transparent; 
            overflow-x: hidden;
        }
        
        /* Scrollbar elegante */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #52525b; }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Animação suave para os dias (Acordeão) */
        .day-content {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .day-content.open { grid-template-rows: 1fr; }
        .day-content-inner {
            overflow: hidden;
            opacity: 0;
            transform: translateY(-8px);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        .day-content.open .day-content-inner {
            opacity: 1;
            transform: translateY(0);
        }

        /* Animações e Transições Premium */
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        .modal-anim { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        @keyframes slideIn { from { transform: translateY(-15px) translateX(-50%); opacity: 0; } to { transform: translateY(0) translateX(-50%); opacity: 1; } }
        .toast-animate { animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        @keyframes popBounce {
            0% { transform: scale(0.5); opacity: 0; }
            50% { transform: scale(1.15); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .bell-show { display: block !important; animation: popBounce 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        /* Estilo da Checklist */
        .task-checkbox {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .task-item:active .task-checkbox {
            transform: scale(0.85);
        }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col relative" onclick="closeProfileMenu(event)">

    <header class="sticky top-0 z-50 bg-matte-bg/90 backdrop-blur-md border-b border-white/[0.04]">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center gap-4">
            
            <div class="flex items-center gap-3">
                <!-- Dropdown de Perfil -->
                <div class="relative">
                    <button id="profile-btn" onclick="toggleProfileMenu(event)" class="flex items-center gap-3 p-1.5 -ml-1.5 rounded-xl hover:bg-white/[0.03] active:scale-[0.98] transition-all duration-200">

                            <i class="ph-fill ph-student text-xl"></i>
                        </div>
                        <div class="text-left">
                            <h1 class="text-sm sm:text-base font-bold text-white flex items-center gap-1.5 leading-tight">
                                <span id="current-profile-name">Carregando...</span>
                                <i class="ph-bold ph-caret-down text-zinc-500 text-[10px]"></i>
                            </h1>

                    </button>
                    
                    <!-- Menu de Perfis -->

                        <div class="p-3 border-b border-white/[0.05]">
                            <p class="text-[10px] font-bold text-zinc-500 uppercase tracking-wider">Meus Perfis</p>
                        </div>
                        <div id="profile-list" class="max-h-60 overflow-y-auto py-1">
                            <!-- JS renderiza lista -->
                        </div>
                        <div class="border-t border-white/[0.05] p-2">
                            <button onclick="openNewProfileModal()" class="w-full flex items-center gap-2 px-3 py-2.5 text-sm text-zinc-300 hover:text-white hover:bg-white/[0.03] active:scale-95 rounded-xl transition-all font-medium">
                                <i class="ph-bold ph-plus text-blue-400"></i> Criar novo plano
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Ações e Progresso Resumido -->
            <div class="flex items-center gap-2 sm:gap-4">

                </button>

                <div class="flex items-center gap-3 bg-white/[0.02] border border-white/[0.03] px-3 py-1.5 rounded-full">
                    <div class="relative w-8 h-8 flex items-center justify-center">
                        <svg class="w-8 h-8 transform -rotate-90" viewBox="0 0 36 36">
                            <circle cx="18" cy="18" r="16" fill="none" class="stroke-white/[0.05]" stroke-width="3"></circle>
                            <circle id="progress-circle" cx="18" cy="18" r="16" fill="none" class="stroke-blue-500" stroke-width="3" stroke-dasharray="100 100" stroke-dashoffset="100" stroke-linecap="round" style="transition: stroke-dashoffset 1s cubic-bezier(0.4, 0, 0.2, 1);"></circle>
                        </svg>
                        <span id="progress-text" class="absolute text-[9px] font-black text-white">0%</span>
                    </div>
                    <span class="text-[10px] font-bold text-zinc-400 uppercase tracking-wider hidden sm:block pr-2">Concluído</span>
                </div>
            </div>
        </div>
        
        <!-- Progresso Mobile em linha -->
        <div class="w-full h-1 bg-white/[0.02] sm:hidden">
            <div id="progress-bar-mobile" class="h-full bg-blue-500 shadow-[0_0_10px_rgba(59,130,246,0.5)] transition-all duration-1000 ease-out" style="width: 0%"></div>
        </div>
    </header>

    <main class="flex-1 max-w-6xl mx-auto w-full flex flex-col md:flex-row pb-24 relative">

                </nav>

                <!-- Seta Direita Mobile -->

                </button>
            </div>
        </aside>

        <div class="flex-1 p-4 sm:p-6 lg:p-8 overflow-x-hidden">

                </div>

                <div class="flex gap-4 w-full sm:w-auto">

                    </div>
                    <div class="bg-black/20 border border-white/[0.03] p-3 rounded-xl flex-1 sm:flex-none sm:min-w-[120px]">

                        <div>

                            <p class="text-sm text-amber-200/70">Você tem tarefas não concluídas de dias anteriores.</p>
                        </div>
                    </div>
                    <button onclick="goToOldestDelay()" class="w-full sm:w-auto whitespace-nowrap bg-amber-500 hover:bg-amber-600 text-black px-5 py-2.5 rounded-xl text-sm font-bold transition-colors shadow-lg shadow-amber-500/20 active:scale-95">
                        Revisar Atrasos

                </div>

            </div>

            </div>

    </main>

    
    <!-- Toasts -->

    <!-- Modal Perfil -->

                </div>

                    <label class="block text-xs font-bold text-zinc-500 mb-1.5 uppercase tracking-wide">Modelo de Plano</label>

            </div>
            
            <div class="flex gap-3">

            </div>
        </div>
    </div>

            'Descanso': 'text-emerald-400 bg-emerald-500/10 border border-emerald-500/20',
            'Geral': 'text-zinc-300 bg-white/5 border border-white/10'
        };

        // Estado Global
        let profiles = JSON.parse(localStorage.getItem('tads_profiles')) || [{ id: 'default', name: 'Meu Perfil' }];
        let activeProfileId = localStorage.getItem('tads_active_profile') || 'default';
        let studyData = [];
        let currentWeekIdx = 0;
        let openDays = {}; 
        let delayedInfo = null;
        let isAlertDismissed = false;

        function getAbsoluteDay(wIdx, dIdx) {
            let abs = 0;
            for(let i=0; i<wIdx; i++) abs += studyData[i].days.length;
            return abs + dIdx;
        }

        // === INICIALIZAÇÃO E PERFIS ===
        function init() {
            loadProfileData(activeProfileId);
            renderProfileList();
            updateProfileUI();
        }

        function loadProfileData(profileId) {
            const savedData = localStorage.getItem(`tads_data_${profileId}`);
            if (savedData) {
                studyData = JSON.parse(savedData);
            } else {
                studyData = JSON.parse(JSON.stringify(novoPlanoData));
                saveState();
            }
            
            // Abre automaticamente o dia de hoje, ou o dia 1
            const today = new Date(); today.setHours(0,0,0,0);
            let foundToday = false;
            
            for (let w = 0; w < studyData.length; w++) {
                for (let d = 0; d < studyData[w].days.length; d++) {
                    const expectedDate = new Date(FIXED_START_DATE);
                    expectedDate.setDate(expectedDate.getDate() + getAbsoluteDay(w, d));
                    if (expectedDate.getTime() === today.getTime()) {
                        currentWeekIdx = w;
                        openDays = { [`${w}-${d}`]: true };
                        foundToday = true; break;
                    }
                }
                if(foundToday) break;
            }
            
            if(!foundToday) { currentWeekIdx = 0; openDays = { '0-0': true }; }
            
            renderNavigation(); 
            selectWeek(currentWeekIdx); 
            updateProgressUI(); 
            checkDelays();
        }

        function saveState() {
            localStorage.setItem(`tads_data_${activeProfileId}`, JSON.stringify(studyData));
            updateProgressUI(); 
            renderNavigation(); 
            checkDelays();
        }

        // --- Interações Visuais (Menu e Modal) ---
        function toggleProfileMenu(e) {
            e.stopPropagation();
            const menu = document.getElementById('profile-menu');
            if(menu.classList.contains('hidden')) {
                menu.classList.remove('hidden'); menu.classList.add('flex');
            } else {
                menu.classList.add('hidden'); menu.classList.remove('flex');
            }
        }

        function closeProfileMenu(e) {
            const menu = document.getElementById('profile-menu');
            if (menu && !menu.classList.contains('hidden') && e.target.closest('#profile-btn') === null) {
                menu.classList.add('hidden'); menu.classList.remove('flex');
            }
        }

        function renderProfileList() {
            const list = document.getElementById('profile-list'); list.innerHTML = '';
            profiles.forEach(p => {
                const isSelected = p.id === activeProfileId;
                list.innerHTML += `
                    <button onclick="switchProfile('${p.id}')" class="w-full text-left px-4 py-3 text-sm flex items-center justify-between transition-colors ${isSelected ? 'text-white font-bold bg-white/[0.05]' : 'text-zinc-400 hover:text-zinc-200 hover:bg-white/[0.02]'}">
                        <span class="truncate">${p.name}</span>
                        ${isSelected ? '<i class="ph-bold ph-check text-blue-400"></i>' : ''}
                    </button>`;
            });
        }

        function switchProfile(profileId) {
            activeProfileId = profileId;
            localStorage.setItem('tads_active_profile', activeProfileId);
            updateProfileUI(); renderProfileList(); loadProfileData(profileId);
            showToast('Perfil alterado.');
        }

        function updateProfileUI() {
            const p = profiles.find(p => p.id === activeProfileId);
            document.getElementById('current-profile-name').innerText = p ? p.name : 'Aluno';
        }

        function showModalEl(id) {
            const m = document.getElementById(id); const c = document.getElementById(`${id}-content`);
            m.classList.remove('hidden');
            setTimeout(() => {
                m.classList.remove('opacity-0');
                if(c.classList.contains('translate-y-full')) c.classList.remove('translate-y-full');
                if(c.classList.contains('scale-95')) c.classList.remove('scale-95');
            }, 10);
        }

        function hideModalEl(id) {
            const m = document.getElementById(id); const c = document.getElementById(`${id}-content`);
            m.classList.add('opacity-0');
            c.classList.add('translate-y-full', 'scale-95');
            setTimeout(() => m.classList.add('hidden'), 300);
        }

        function openNewProfileModal() { showModalEl('profile-modal'); document.getElementById('new-profile-name').focus(); }
        function closeProfileModal() { hideModalEl('profile-modal'); document.getElementById('new-profile-name').value = ''; }

        function createNewProfile() {
            const name = document.getElementById('new-profile-name').value.trim();
            if (!name) return showToast('Digite um nome válido.', 'error');
            
            const newId = 'prof_' + Date.now();
            profiles.push({ id: newId, name: name });
            localStorage.setItem('tads_profiles', JSON.stringify(profiles));
            localStorage.setItem(`tads_data_${newId}`, JSON.stringify(novoPlanoData));
            
            closeProfileModal(); switchProfile(newId);
        }

        // === LÓGICA CORE ===
        function checkDelays() {
            const today = new Date(); today.setHours(0,0,0,0);
            delayedInfo = null;

            for (let w = 0; w < studyData.length; w++) {
                for (let d = 0; d < studyData[w].days.length; d++) {
                    const expectedDate = new Date(FIXED_START_DATE);
                    expectedDate.setDate(expectedDate.getDate() + getAbsoluteDay(w, d));
                    
                    const isCompleted = studyData[w].days[d].tasks.every(t => t.completed) || studyData[w].days[d].tasks.length === 0;
                    if (expectedDate < today && !isCompleted && !delayedInfo) {
                        delayedInfo = { w, d };
                    }
                }
            }
            updateAlertUI();
        }

        function updateAlertUI() {
            const banner = document.getElementById('delay-alert');
            const bell = document.getElementById('mini-alert-badge');
            
            if (delayedInfo) {
                if (isAlertDismissed) { banner.classList.add('hidden'); bell.classList.remove('hidden'); bell.classList.add('bell-show'); } 
                else { banner.classList.remove('hidden'); bell.classList.add('hidden'); bell.classList.remove('bell-show'); }
            } else { 
                banner.classList.add('hidden'); bell.classList.add('hidden'); bell.classList.remove('bell-show'); 
            }
        }

        function toggleAlertBanner(show) { isAlertDismissed = !show; updateAlertUI(); }
        
        function goToOldestDelay() {
            if (!delayedInfo) return;
            const { w, d } = delayedInfo;
            if (currentWeekIdx !== w) selectWeek(w);
            openDays[`${w}-${d}`] = true; renderDays();
            setTimeout(() => {
                const el = document.getElementById(`day-card-${w}-${d}`);
                if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 100);
        }

        function updateProgressUI() {
            let total = 0, comp = 0;
            let weekTotal = 0, weekComp = 0;
            
            studyData.forEach((w, wIdx) => w.days.forEach(d => { 
                d.tasks.forEach(t => { 
                    total++; if(t.completed) comp++; 
                    if(wIdx === currentWeekIdx) { weekTotal++; if(t.completed) weekComp++; }
                }); 
            }));
            
            const pct = total ? Math.round((comp / total) * 100) : 0;
            const weekPct = weekTotal ? Math.round((weekComp / weekTotal) * 100) : 0;

            document.getElementById('progress-text').innerText = `${pct}%`;
            document.getElementById('progress-circle').style.strokeDashoffset = 100 - pct;
            document.getElementById('progress-bar-mobile').style.width = `${pct}%`;
            
            document.getElementById('stats-tasks-done').innerHTML = `${comp}<span class="text-sm text-zinc-600 font-medium ml-1">/ ${total}</span>`;
            document.getElementById('stats-week-pct').innerText = `${weekPct}%`;
        }

        function renderNavigation() {
            const nav = document.getElementById('nav-weeks'); nav.innerHTML = '';
            studyData.forEach((week, idx) => {
                const isSelected = idx === currentWeekIdx;
                let t=0, c=0; week.days.forEach(d => d.tasks.forEach(task => { t++; if(task.completed) c++; }));
                const isDone = t > 0 && t === c;
                
                nav.innerHTML += `
                    <button onclick="selectWeek(${idx})" class="flex items-center justify-between px-4 py-3.5 rounded-xl text-left transition-colors flex-shrink-0 min-w-[140px] md:min-w-0 border ${isSelected ? 'bg-blue-500/10 border-blue-500/30 text-blue-400 shadow-sm' : 'bg-transparent border-transparent text-zinc-500 hover:text-zinc-300 hover:bg-white/[0.02]'}">
                        <span class="text-sm font-bold">Semana ${week.week}</span>
                        ${isDone ? '<i class="ph-bold ph-check text-emerald-400 hidden md:block"></i>' : ''}
                    </button>`;
            });
        }

        function selectWeek(idx) {
            currentWeekIdx = idx; renderNavigation();
            document.getElementById('current-week-title').innerText = studyData[idx].title;
            updateProgressUI(); // Atualiza a % da semana
            renderDays();
            window.scrollTo({ top: 0, behavior: 'smooth' }); 
        }

        function toggleDay(w, d) { openDays[`${w}-${d}`] = !openDays[`${w}-${d}`]; renderDays(); }
        
        function toggleTask(w, d, t) {
            studyData[w].days[d].tasks[t].completed = !studyData[w].days[d].tasks[t].completed;
            saveState(); renderDays();
        }

        function renderDays() {
            const container = document.getElementById('days-container'); container.innerHTML = '';
            
            studyData[currentWeekIdx].days.forEach((day, dIdx) => {
                const isOpen = openDays[`${currentWeekIdx}-${dIdx}`];
                const total = day.tasks.length, comp = day.tasks.filter(t => t.completed).length;
                const isDone = total > 0 && total === comp;
                
                const realDate = new Date(FIXED_START_DATE); 
                realDate.setDate(realDate.getDate() + getAbsoluteDay(currentWeekIdx, dIdx));
                const dateStr = realDate.toLocaleDateString('pt-BR', { day: '2-digit', month: 'short' });

                const today = new Date(); today.setHours(0,0,0,0);
                const realDateMidnight = new Date(realDate); realDateMidnight.setHours(0,0,0,0);
                const isToday = realDateMidnight.getTime() === today.getTime();
                
                let statusBadge = '';
                if (isToday) statusBadge = `<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-blue-500 border border-blue-400 text-white uppercase tracking-wider ml-2 shadow-[0_0_10px_rgba(59,130,246,0.3)]">Hoje</span>`;
                else if (realDateMidnight < today && !isDone && total > 0) statusBadge = `<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-red-500/10 border border-red-500/20 text-red-400 uppercase tracking-wider ml-2">Atrasado</span>`;

                const cardStyle = isToday 
                    ? 'bg-blue-500/5 border border-blue-500/30 shadow-[0_0_20px_rgba(59,130,246,0.05)]' 
                    : (isDone ? 'bg-white/[0.01] border border-white/[0.03] opacity-60 hover:opacity-100' : 'bg-white/[0.02] border border-white/[0.05]');

                const card = document.createElement('div');
                card.id = `day-card-${currentWeekIdx}-${dIdx}`;
                card.className = `rounded-2xl transition-all duration-300 overflow-hidden ${cardStyle}`;
                
                let tasksHTML = total === 0 ? '<div class="text-center p-6 text-sm text-zinc-600">Dia livre. Nenhuma tarefa.</div>' : '';
                
                day.tasks.forEach((t, tIdx) => {
                    const tagClass = tagStyles[t.tag] || tagStyles['Geral'];
                    const ytBtn = t.link ? `<a href="${t.link}" target="_blank" onclick="event.stopPropagation()" class="p-1.5 text-zinc-500 hover:text-red-400 hover:bg-white/10 rounded-lg transition-colors"><i class="ph-fill ph-youtube-logo text-lg"></i></a>` : '';

                    tasksHTML += `
                        <div class="task-item flex items-start gap-3 p-3 mx-2 my-1 rounded-xl hover:bg-white/[0.03] transition-colors group">
                            
                            <button onclick="toggleTask(${currentWeekIdx}, ${dIdx}, ${tIdx})" class="mt-1 task-checkbox focus:outline-none ${t.completed ? 'text-emerald-400' : 'text-zinc-600 hover:text-blue-400'}">
                                <i class="ph-fill ${t.completed ? 'ph-check-circle' : 'ph-circle'} text-[22px]"></i>
                            </button>
                            
                            <div class="flex-1 min-w-0 pt-1 cursor-pointer" onclick="toggleTask(${currentWeekIdx}, ${dIdx}, ${tIdx})">
                                <p class="text-sm leading-relaxed mb-2 transition-colors ${t.completed ? 'text-zinc-500 line-through decoration-zinc-700' : 'text-zinc-200'}">${t.desc}</p>
                                <span class="inline-block px-2.5 py-0.5 rounded-lg text-[10px] font-bold tracking-wide uppercase ${tagClass}">${t.tag}</span>
                            </div>
                            
                            <div class="flex items-center gap-1 opacity-100 sm:opacity-0 sm:group-hover:opacity-100 transition-opacity">
                                ${ytBtn}
                                <button onclick="openAdminModal(${currentWeekIdx}, ${dIdx}, ${tIdx})" class="p-1.5 text-zinc-500 hover:text-white hover:bg-white/10 rounded-lg transition-colors" title="Editar"><i class="ph-bold ph-pencil-simple text-[16px]"></i></button>
                            </div>
                        </div>`;
                });

                card.innerHTML = `
                    <button class="w-full px-5 py-4 flex justify-between items-center bg-transparent hover:bg-white/[0.02] transition-colors focus:outline-none" onclick="toggleDay(${currentWeekIdx}, ${dIdx})">
                        <div class="flex items-center gap-4">
                            <div class="w-10 h-10 rounded-xl flex items-center justify-center transition-colors ${isDone && total>0 ? 'bg-emerald-500/20 text-emerald-400' : (isToday ? 'bg-blue-500 text-white' : 'bg-white/[0.05] text-zinc-400')}">
                                <i class="ph-bold ${isDone && total>0 ? 'ph-check' : 'ph-calendar-blank'} text-lg"></i>
                            </div>
                            <div class="text-left">
                                <h3 class="font-bold text-base transition-colors ${isDone && total>0 ? 'text-zinc-500' : (isToday ? 'text-blue-400' : 'text-white')}">${day.name}</h3>
                                <div class="flex items-center mt-0.5">
                                    <p class="text-xs font-medium text-zinc-500 tracking-wide">${dateStr}</p>
                                    ${statusBadge}
                                </div>
                            </div>
                        </div>
                        <div class="flex items-center gap-4">
                            <span class="text-xs font-bold px-3 py-1.5 rounded-lg bg-white/[0.05] text-zinc-400 hidden sm:block">${comp}/${total}</span>
                            <div class="text-zinc-500 transition-transform duration-300 ${isOpen ? 'rotate-180 text-white' : ''}"><i class="ph-bold ph-caret-down"></i></div>
                        </div>
                    </button>
                    
                    <div class="day-content ${isOpen ? 'open' : ''}">
                        <div class="day-content-inner border-t border-white/[0.02] bg-black/20">
                            <div class="py-3">
                                ${tasksHTML}
                                <div class="px-5 py-3 border-t border-white/[0.02] mt-2">
                                    <button onclick="openAdminModal(${currentWeekIdx}, ${dIdx}, null)" class="text-xs font-bold text-zinc-500 hover:text-white flex items-center gap-1.5 transition-colors uppercase tracking-wider"><i class="ph-bold ph-plus"></i> Nova Tarefa</button>
                                </div>
                            </div>
                        </div>
                    </div>`;
                container.appendChild(card);
            });
        }

        function showToast(msg, type='success') {
            const cont = document.getElementById('toast-container');
            const el = document.createElement('div');
            el.className = 'toast-animate flex items-center gap-3 bg-zinc-800 border border-white/[0.05] px-4 py-3 rounded-xl shadow-2xl pointer-events-auto';
            el.innerHTML = `<i class="ph-fill ${type === 'error' ? 'ph-warning-circle text-red-500' : 'ph-check-circle text-blue-400'} text-lg"></i><span class="text-sm font-medium text-zinc-200">${msg}</span>`;
            cont.appendChild(el);
            setTimeout(() => { 
                el.style.opacity = '0'; el.style.transform = 'translateY(-15px) translateX(-50%)'; el.style.transition = 'all 0.3s'; 
                setTimeout(()=>el.remove(), 300); 
            }, 2500);
        }

        let editCtx = null;
        function openAdminModal(w, d, t) {
            editCtx = {w, d, t};
            if(t !== null) {
                document.getElementById('modal-title').innerText = "Editar Tarefa";
                document.getElementById('modal-desc').value = studyData[w].days[d].tasks[t].desc;
                document.getElementById('modal-link').value = studyData[w].days[d].tasks[t].link || '';
                document.getElementById('modal-tag').value = studyData[w].days[d].tasks[t].tag || 'Geral';
                document.getElementById('btn-delete-task').classList.remove('hidden');
            } else {
                document.getElementById('modal-title').innerText = "Nova Tarefa";
                document.getElementById('modal-desc').value = '';
                document.getElementById('modal-link').value = '';
                document.getElementById('btn-delete-task').classList.add('hidden');
            }
            showModalEl('admin-modal');
            setTimeout(() => document.getElementById('modal-desc').focus(), 100);
        }
        
        function closeAdminModal() { hideModalEl('admin-modal'); }

        document.getElementById('btn-save-task').addEventListener('click', () => {
            const desc = document.getElementById('modal-desc').value.trim();
            const link = document.getElementById('modal-link').value.trim();
            const tag = document.getElementById('modal-tag').value;
            if(!desc) return showToast('Descreva a tarefa.', 'error');
            
            const taskObj = { tag, desc, link: link || null, completed: false };

            if(editCtx.t !== null) {
                taskObj.completed = studyData[editCtx.w].days[editCtx.d].tasks[editCtx.t].completed;
                studyData[editCtx.w].days[editCtx.d].tasks[editCtx.t] = taskObj;
            } else {
                studyData[editCtx.w].days[editCtx.d].tasks.push(taskObj);
            }
            
            openDays[`${editCtx.w}-${editCtx.d}`] = true;
            saveState(); renderDays(); closeAdminModal(); showToast('Salvo!');
        });

        document.getElementById('btn-delete-task').addEventListener('click', () => {
            studyData[editCtx.w].days[editCtx.d].tasks.splice(editCtx.t, 1); 
            saveState(); renderDays(); closeAdminModal(); showToast('Excluído.');
        });

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
