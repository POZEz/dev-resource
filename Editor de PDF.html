<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#09090b">
  <title>Editor de PDF Mobile-First</title>

  <!-- Bibliotecas: Supabase, PDF.js, PDF-lib, Tailwind, Phosphor Icons -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            matte: { bg: '#09090b', card: '#121214', border: '#27272a', text: '#fafafa', muted: '#a1a1aa' }
          }
        }
      }
    }
  </script>

  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #09090b; color: #fafafa; overflow: hidden; overscroll-behavior-y: none; }
    
    /* Scrollbars invisíveis para manter o design clean no mobile */
    .no-scrollbars::-webkit-scrollbar { display: none; }
    .no-scrollbars { -ms-overflow-style: none; scrollbar-width: none; }

    /* Container de visualização (Motor de Gestos) */
    #workspace {
      position: absolute;
      top: 48px; /* Altura do header */
      bottom: 64px; /* Altura do toolbar inferior */
      left: 0;
      right: 0;
      overflow: hidden;
      background-color: #121214;
      touch-action: none; /* Desabilita zoom/pan nativo do navegador para controlarmos via JS */
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Container físico da página do PDF */
    #document-container {
      position: absolute;
      transform-origin: 0 0; /* Essencial para o cálculo do CSS Transform (Zoom/Pan) */
      background: white;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
    }

    canvas { display: block; position: absolute; top: 0; left: 0; }
    
    #pdf-layer { z-index: 1; pointer-events: none; }
    #drawing-layer { z-index: 2; pointer-events: none; }
    #overlay-layer { z-index: 3; position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }

    /* Caixa de texto sobre o PDF */
    .text-box {
      position: absolute;
      pointer-events: auto;
      color: #000;
      font-size: 16px;
      font-family: Arial, sans-serif;
      min-width: 20px;
      min-height: 20px;
      padding: 2px;
      border: 1px dashed transparent;
      outline: none;
      white-space: pre-wrap;
      line-height: 1.2;
    }
    .text-box:focus, .text-box:hover { border-color: #3b82f6; background: rgba(59,130,246,0.1); cursor: move; }

    /* Drawer Lateral de Páginas */
    #pages-drawer {
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .drawer-closed { transform: translateX(-100%); }
    .drawer-open { transform: translateX(0); }

    /* Estilos do Toolbar Inferior Ativo */
    .tool-btn.active { color: #60a5fa; background: rgba(59, 130, 246, 0.15); border-radius: 12px; }
  </style>
</head>
<body class="antialiased text-white select-none">

  <!-- ESTADO VAZIO: TELA INICIAL ANTES DO UPLOAD -->
  <div id="empty-state" class="absolute inset-0 z-50 flex flex-col items-center justify-center bg-matte-bg px-6">
    <div class="w-20 h-20 rounded-3xl bg-white/[0.02] border border-matte-border flex items-center justify-center text-zinc-500 mb-6 shadow-2xl">
      <i class="ph-fill ph-file-pdf text-4xl text-red-500/80"></i>
    </div>
    <h2 class="text-xl font-bold text-white mb-2 text-center">Editor de PDF</h2>
    <p class="text-sm text-zinc-400 mb-8 text-center max-w-xs leading-relaxed">Carregue um arquivo existente ou comece com um documento em branco.</p>
    
    <div class="flex flex-col sm:flex-row items-center gap-4 w-full max-w-xs">
      <!-- Opção 1: Upload de Arquivo -->
      <label class="w-full px-5 py-3.5 rounded-2xl bg-white text-black font-bold text-sm hover:bg-zinc-200 transition-colors cursor-pointer shadow-[0_0_40px_rgba(255,255,255,0.1)] flex items-center justify-center gap-2">
        <i class="ph-bold ph-upload-simple text-lg"></i>
        Abrir Arquivo
        <input type="file" id="file-upload" accept="application/pdf" class="hidden" onchange="handleFileSelect(event)">
      </label>

      <!-- Opção 2: Documento em Branco -->
      <button onclick="createBlankPDF()" class="w-full px-5 py-3.5 rounded-2xl bg-white/[0.05] border border-matte-border text-white font-bold text-sm hover:bg-white/[0.1] transition-colors flex items-center justify-center gap-2">
        <i class="ph-bold ph-file-plus text-lg"></i>
        Criar do Zero
      </button>
    </div>
  </div>

  <!-- EDITOR PRINCIPAL (OCULTO ATÉ O UPLOAD) -->
  <div id="editor-ui" class="hidden flex-col h-full w-full relative">
    
    <!-- CABEÇALHO MINIMALISTA SUPERIOR -->
    <header class="h-12 bg-matte-card border-b border-matte-border flex items-center justify-between px-3 shrink-0 absolute top-0 w-full z-40">
      <div class="flex items-center gap-2">
        <button onclick="toggleDrawer(true)" class="p-2 rounded-xl text-zinc-300 hover:bg-white/[0.08] transition-colors" title="Ver Páginas">
          <i class="ph-bold ph-sidebar-simple text-lg"></i>
        </button>
        <span id="header-filename" class="text-xs font-bold truncate max-w-[120px] sm:max-w-xs">documento.pdf</span>
      </div>

      <div class="flex items-center gap-1.5">
        <span id="sync-status" class="text-[10px] text-zinc-500 mr-2 hidden sm:block">Editando...</span>
        <button onclick="exportFinalPDF()" class="px-3 py-1.5 rounded-lg bg-blue-500 hover:bg-blue-600 text-white text-xs font-bold shadow flex items-center gap-1.5">
          <i class="ph-bold ph-download-simple"></i> <span class="hidden sm:inline">Exportar</span>
        </button>
      </div>
    </header>

    <!-- MOTOR DE GESTOS E VISUALIZAÇÃO DO PDF -->
    <!-- Ele ocupa a área entre o header(48px) e o toolbar(64px) -->
    <main id="workspace">
      <div id="document-container">
        <!-- O PDF.js renderiza aqui -->
        <canvas id="pdf-layer"></canvas>
        <!-- Onde o usuário desenha -->
        <canvas id="drawing-layer"></canvas>
        <!-- Onde os textos e imagens flutuam -->
        <div id="overlay-layer"></div>
      </div>
    </main>

    <!-- FLOATING TOOLBAR INFERIOR (ESTILO APP MOBILE) -->
    <nav class="absolute bottom-0 w-full h-16 bg-matte-card border-t border-matte-border flex items-center justify-around px-2 sm:px-6 z-40 pb-safe">
      <button onclick="setTool('hand')" id="tool-hand" class="tool-btn active flex flex-col items-center gap-1 p-2 w-14 text-zinc-400">
        <i class="ph-bold ph-hand-palm text-xl"></i>
        <span class="text-[9px] font-bold">Mover</span>
      </button>
      
      <button onclick="setTool('draw')" id="tool-draw" class="tool-btn flex flex-col items-center gap-1 p-2 w-14 text-zinc-400">
        <i class="ph-bold ph-pencil-simple text-xl"></i>
        <span class="text-[9px] font-bold">Caneta</span>
      </button>

      <button onclick="setTool('text')" id="tool-text" class="tool-btn flex flex-col items-center gap-1 p-2 w-14 text-zinc-400">
        <i class="ph-bold ph-text-t text-xl"></i>
        <span class="text-[9px] font-bold">Texto</span>
      </button>

      <!-- Divisor -->
      <div class="w-px h-8 bg-matte-border mx-1"></div>

      <!-- Controles Dinâmicos para a ferramenta ativa (Ex: Cores) -->
      <div class="flex items-center gap-3">
        <div class="flex flex-col items-center gap-1">
          <input type="color" id="tool-color" value="#ef4444" class="w-6 h-6 rounded-full bg-transparent border-0 cursor-pointer overflow-hidden">
          <span class="text-[9px] font-bold text-zinc-500">Cor</span>
        </div>
        <button onclick="clearCurrentPageDrawings()" class="flex flex-col items-center gap-1 p-2 w-14 text-red-400 hover:text-red-300">
          <i class="ph-bold ph-eraser text-xl"></i>
          <span class="text-[9px] font-bold">Limpar</span>
        </button>
      </div>
    </nav>

    <!-- DRAWER LATERAL DE PÁGINAS -->
    <div id="drawer-backdrop" onclick="toggleDrawer(false)" class="fixed inset-0 bg-black/60 z-40 hidden transition-opacity"></div>
    
    <aside id="pages-drawer" class="fixed inset-y-0 left-0 w-64 bg-matte-card border-r border-matte-border z-50 drawer-closed flex flex-col shadow-2xl">
      <div class="h-12 px-4 border-b border-matte-border flex items-center justify-between shrink-0">
        <span class="text-xs font-bold text-white">Páginas do PDF</span>
        <button onclick="toggleDrawer(false)" class="text-zinc-500 p-1"><i class="ph-bold ph-x"></i></button>
      </div>
      
      <div id="thumbnails-container" class="flex-1 overflow-y-auto p-3 space-y-4 no-scrollbars">
        <!-- Miniaturas injetadas aqui -->
      </div>
    </aside>

  </div>

  <!-- LÓGICA DO EDITOR (MOTOR DE GESTOS, PDF.JS E PDF-LIB) -->
  <script>
    // ESTADO DA APLICAÇÃO E VARIÁVEIS GLOBAIS
    let state = {
      pdfDocLib: null,   // PDFDocument do pdf-lib (Para modificar e salvar)
      pdfJsDoc: null,    // Document do pdf.js (Para renderizar)
      originalBytes: null,
      filename: 'documento.pdf',
      
      currentPage: 1,
      totalPages: 0,
      
      // Motor de Gestos (Pan e Zoom)
      zoom: 1.0,
      panX: 0,
      panY: 0,
      
      activeTool: 'hand', // 'hand', 'draw', 'text'
      currentColor: '#ef4444',
      
      // Estrutura para salvar edições (Desenhos e Textos por página)
      edits: {} // edits[pageNum] = { paths: [...], texts: [...] }
    };

    // Referências DOM
    const workspace = document.getElementById('workspace');
    const container = document.getElementById('document-container');
    const pdfLayer = document.getElementById('pdf-layer');
    const drawLayer = document.getElementById('drawing-layer');
    const overlayLayer = document.getElementById('overlay-layer');
    
    let pdfCtx = pdfLayer.getContext('2d');
    let drawCtx = drawLayer.getContext('2d');

    // Inicialização
    function initEditor() {
      setupGestureEngine();
      document.getElementById('tool-color').addEventListener('input', (e) => state.currentColor = e.target.value);
    }

    // ==== CRIAÇÃO E CARREGAMENTO DE ARQUIVOS ====
    
    // Função NOVA: Cria um PDF em branco (Folha A4)
    async function createBlankPDF() {
      const btn = event.currentTarget;
      const originalHTML = btn.innerHTML;
      btn.innerHTML = '<div class="w-4 h-4 border-2 border-white/20 border-t-white rounded-full animate-spin"></div>';
      btn.disabled = true;

      try {
        const pdfDoc = await PDFLib.PDFDocument.create();
        pdfDoc.addPage([595.28, 841.89]); // Tamanho padrão A4 em points
        const pdfBytes = await pdfDoc.save();
        
        state.filename = "Documento em Branco.pdf";
        document.getElementById('header-filename').innerText = state.filename;
        
        await loadPdfData(pdfBytes);
      } catch (err) {
        alert("Erro ao criar o PDF em branco.");
        console.error(err);
      } finally {
        btn.innerHTML = originalHTML;
        btn.disabled = false;
      }
    }

    async function handleFileSelect(e) {
      const file = e.target.files[0];
      if (!file || file.type !== 'application/pdf') return;
      
      state.filename = file.name;
      document.getElementById('header-filename').innerText = file.name;
      
      try {
        const arrayBuffer = await file.arrayBuffer();
        await loadPdfData(arrayBuffer);
      } catch (err) {
        alert("Erro ao ler o arquivo selecionado.");
        console.error(err);
      }
    }

    async function loadPdfData(arrayBuffer) {
      try {
        state.originalBytes = arrayBuffer;

        // Inicia as duas bibliotecas
        state.pdfDocLib = await PDFLib.PDFDocument.load(arrayBuffer);
        
        // CORREÇÃO CRÍTICA: Usa Uint8Array em vez de ArrayBuffer cru para evitar falhas do PDF.js em alguns navegadores
        const typedArray = new Uint8Array(arrayBuffer);
        state.pdfJsDoc = await pdfjsLib.getDocument({ data: typedArray }).promise;
        state.totalPages = state.pdfJsDoc.numPages;

        // Prepara estrutura de edições
        for(let i=1; i<=state.totalPages; i++) {
          state.edits[i] = { paths: [], texts: [] };
        }

        // Troca a UI
        document.getElementById('empty-state').classList.add('hidden');
        document.getElementById('editor-ui').classList.remove('hidden');
        document.getElementById('editor-ui').classList.add('flex');

        // Centraliza e renderiza
        state.currentPage = 1;
        await renderCurrentPage();
        centerDocument();
        renderThumbnailsDrawer();
      } catch(err) {
        alert("Erro fatal ao processar o PDF. Verifique se o arquivo não está corrompido ou protegido por senha.");
        console.error("PDF Load Error:", err);
      }
    }

    // ==== RENDERIZAÇÃO DA PÁGINA (PDF.js) ====
    async function renderCurrentPage() {
      if (!state.pdfJsDoc) return;
      
      const page = await state.pdfJsDoc.getPage(state.currentPage);
      
      // Renderiza em alta resolução interna para não ficar pixelado ao dar zoom
      const renderScale = 2.0; 
      const viewport = page.getViewport({ scale: renderScale });

      // Ajusta os canvas físicos
      pdfLayer.width = viewport.width;
      pdfLayer.height = viewport.height;
      drawLayer.width = viewport.width;
      drawLayer.height = viewport.height;

      // Ajusta o tamanho do container baseando na escala real da tela (escala 1.0 css)
      const cssWidth = viewport.width / renderScale;
      const cssHeight = viewport.height / renderScale;
      container.style.width = `${cssWidth}px`;
      container.style.height = `${cssHeight}px`;

      // Renderiza PDF base
      await page.render({ canvasContext: pdfCtx, viewport }).promise;

      // Restaura Desenhos da página atual
      redrawDrawings(renderScale);
      
      // Restaura Textos da página atual
      renderTexts();
    }

    // ==== MOTOR DE GESTOS (PINCH-TO-ZOOM, PAN, DESENHO) ====
    let pointers = []; // Guarda os toques ativos (dedos)
    let initialPinchDistance = null;
    let initialZoom = 1;
    let lastPanPt = null;

    let isDrawingStroke = false;
    let currentPath = [];

    function setupGestureEngine() {
      workspace.addEventListener('touchstart', e => e.preventDefault(), { passive: false });

      workspace.addEventListener('pointerdown', (e) => {
        pointers.push(e);

        if (pointers.length === 2) {
          // Inicia Pinch-to-Zoom
          initialPinchDistance = Math.hypot(pointers[0].clientX - pointers[1].clientX, pointers[0].clientY - pointers[1].clientY);
          initialZoom = state.zoom;
          isDrawingStroke = false; // Cancela desenho se usar 2 dedos
        } 
        else if (pointers.length === 1) {
          if (state.activeTool === 'hand') {
            lastPanPt = { x: e.clientX, y: e.clientY };
          } 
          else if (state.activeTool === 'draw') {
            isDrawingStroke = true;
            const pt = getRelativeCoordinates(e.clientX, e.clientY);
            currentPath = [{ x: pt.x, y: pt.y, c: state.currentColor }];
            drawCtx.beginPath();
            drawCtx.strokeStyle = state.currentColor;
            drawCtx.lineWidth = 3;
            drawCtx.lineCap = 'round';
            drawCtx.moveTo(pt.x * 2, pt.y * 2); // *2 pelo renderScale interno
          }
          else if (state.activeTool === 'text') {
            // Cria texto no local do clique
            const pt = getRelativeCoordinates(e.clientX, e.clientY);
            createTextElement(pt.x, pt.y);
            setTool('hand'); // Volta pra mão pra não criar textos acidentais
          }
        }
      });

      workspace.addEventListener('pointermove', (e) => {
        // Atualiza o pointer atual na lista
        const index = pointers.findIndex(p => p.pointerId === e.pointerId);
        if (index !== -1) pointers[index] = e;

        if (pointers.length === 2) {
          // Processa Pinch-to-Zoom
          const dist = Math.hypot(pointers[0].clientX - pointers[1].clientX, pointers[0].clientY - pointers[1].clientY);
          const scale = dist / initialPinchDistance;
          let newZoom = initialZoom * scale;
          // Limites de Zoom
          newZoom = Math.max(0.5, Math.min(newZoom, 4.0)); 
          
          // Calcula o centro da pinça para dar zoom em direção ao dedo
          const centerX = (pointers[0].clientX + pointers[1].clientX) / 2;
          const centerY = (pointers[0].clientY + pointers[1].clientY) / 2;
          
          // Ajusta o Pan para focar no centro
          const workspaceRect = workspace.getBoundingClientRect();
          const relX = centerX - workspaceRect.left;
          const relY = centerY - workspaceRect.top;

          state.panX = relX - (relX - state.panX) * (newZoom / state.zoom);
          state.panY = relY - (relY - state.panY) * (newZoom / state.zoom);
          state.zoom = newZoom;
          applyTransform();
        } 
        else if (pointers.length === 1) {
          if (state.activeTool === 'hand' && lastPanPt) {
            // Processa Pan (Arrastar Tela)
            const dx = e.clientX - lastPanPt.x;
            const dy = e.clientY - lastPanPt.y;
            state.panX += dx;
            state.panY += dy;
            lastPanPt = { x: e.clientX, y: e.clientY };
            applyTransform();
          } 
          else if (state.activeTool === 'draw' && isDrawingStroke) {
            // Processa Desenho
            const pt = getRelativeCoordinates(e.clientX, e.clientY);
            currentPath.push({ x: pt.x, y: pt.y });
            drawCtx.lineTo(pt.x * 2, pt.y * 2);
            drawCtx.stroke();
          }
        }
      });

      const endPointer = (e) => {
        pointers = pointers.filter(p => p.pointerId !== e.pointerId);
        if (pointers.length < 2) initialPinchDistance = null;
        if (pointers.length === 0) lastPanPt = null;

        if (state.activeTool === 'draw' && isDrawingStroke && currentPath.length > 1) {
          // Salva o traçado quando levanta o dedo
          state.edits[state.currentPage].paths.push([...currentPath]);
          isDrawingStroke = false;
        }
      };

      workspace.addEventListener('pointerup', endPointer);
      workspace.addEventListener('pointercancel', endPointer);
      workspace.addEventListener('pointerout', endPointer);

      // Suporte a Mouse Wheel para Zoom no Desktop
      workspace.addEventListener('wheel', (e) => {
        e.preventDefault();
        const zoomDelta = e.deltaY < 0 ? 1.1 : 0.9;
        let newZoom = state.zoom * zoomDelta;
        newZoom = Math.max(0.5, Math.min(newZoom, 4.0));
        
        const workspaceRect = workspace.getBoundingClientRect();
        const relX = e.clientX - workspaceRect.left;
        const relY = e.clientY - workspaceRect.top;

        state.panX = relX - (relX - state.panX) * (newZoom / state.zoom);
        state.panY = relY - (relY - state.panY) * (newZoom / state.zoom);
        state.zoom = newZoom;
        applyTransform();
      }, { passive: false });
    }

    function applyTransform() {
      container.style.transform = `translate(${state.panX}px, ${state.panY}px) scale(${state.zoom})`;
    }

    function centerDocument() {
      const wRect = workspace.getBoundingClientRect();
      const cRect = container.getBoundingClientRect();
      
      const fitZoom = (wRect.width - 40) / (cRect.width / state.zoom);
      state.zoom = Math.min(fitZoom, 1.2);

      state.panX = (wRect.width - (cRect.width / state.zoom) * state.zoom) / 2;
      state.panY = 20;
      applyTransform();
    }

    function getRelativeCoordinates(clientX, clientY) {
      const rect = container.getBoundingClientRect();
      const x = (clientX - rect.left) / state.zoom;
      const y = (clientY - rect.top) / state.zoom;
      return { x, y };
    }

    // ==== FERRAMENTAS E UI ====
    function setTool(toolName) {
      state.activeTool = toolName;
      document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(`tool-${toolName}`).classList.add('active');
      
      overlayLayer.style.pointerEvents = toolName === 'text' ? 'auto' : 'none';
    }

    // ==== EDIÇÕES: DESENHOS ====
    function redrawDrawings(scale) {
      drawCtx.clearRect(0, 0, drawLayer.width, drawLayer.height);
      const paths = state.edits[state.currentPage].paths;
      
      paths.forEach(path => {
        if (path.length < 2) return;
        drawCtx.beginPath();
        drawCtx.strokeStyle = path[0].c || '#ef4444';
        drawCtx.lineWidth = 3;
        drawCtx.lineCap = 'round';
        drawCtx.moveTo(path[0].x * scale, path[0].y * scale);
        for (let i = 1; i < path.length; i++) {
          drawCtx.lineTo(path[i].x * scale, path[i].y * scale);
        }
        drawCtx.stroke();
      });
    }

    function clearCurrentPageDrawings() {
      state.edits[state.currentPage].paths = [];
      state.edits[state.currentPage].texts = [];
      redrawDrawings(2.0);
      renderTexts();
    }

    // ==== EDIÇÕES: TEXTOS INSTANTÂNEOS ====
    function createTextElement(x, y, content = '') {
      const textId = crypto.randomUUID();
      const textObj = { id: textId, x: x, y: y, text: content, color: state.currentColor };
      state.edits[state.currentPage].texts.push(textObj);
      renderTexts();
      
      setTimeout(() => {
        const el = document.getElementById(textId);
        if (el) {
          el.focus();
          const range = document.createRange();
          const sel = window.getSelection();
          range.selectNodeContents(el);
          range.collapse(false);
          sel.removeAllRanges();
          sel.addRange(range);
        }
      }, 50);
    }

    function renderTexts() {
      overlayLayer.innerHTML = '';
      const texts = state.edits[state.currentPage].texts;

      texts.forEach(txt => {
        const div = document.createElement('div');
        div.id = txt.id;
        div.className = 'text-box';
        div.contentEditable = true;
        div.innerText = txt.text || '';
        if (!txt.text) div.dataset.placeholder = 'Digite aqui...';
        
        div.style.left = `${txt.x}px`;
        div.style.top = `${txt.y}px`;
        div.style.color = txt.color;

        div.onblur = () => {
          if (!div.innerText.trim()) {
            state.edits[state.currentPage].texts = state.edits[state.currentPage].texts.filter(t => t.id !== txt.id);
            div.remove();
          } else {
            txt.text = div.innerText;
          }
        };

        let isDragging = false;
        let startX, startY;
        div.onmousedown = div.ontouchstart = (e) => {
          if(e.type === 'touchstart') e = e.touches[0];
          if(document.activeElement === div) return;
          
          isDragging = true;
          startX = e.clientX;
          startY = e.clientY;
          e.stopPropagation();
        };

        window.addEventListener('mousemove', dragTxt);
        window.addEventListener('touchmove', dragTxt, {passive: false});
        window.addEventListener('mouseup', endDrag);
        window.addEventListener('touchend', endDrag);

        function dragTxt(e) {
          if (!isDragging) return;
          e.preventDefault();
          if(e.type === 'touchmove') e = e.touches[0];
          
          const dx = (e.clientX - startX) / state.zoom;
          const dy = (e.clientY - startY) / state.zoom;
          txt.x += dx;
          txt.y += dy;
          div.style.left = `${txt.x}px`;
          div.style.top = `${txt.y}px`;
          
          startX = e.clientX;
          startY = e.clientY;
        }
        function endDrag() { isDragging = false; }

        overlayLayer.appendChild(div);
      });
    }

    // ==== DRAWER (MENU LATERAL) DE PÁGINAS ====
    function toggleDrawer(show) {
      const drawer = document.getElementById('pages-drawer');
      const backdrop = document.getElementById('drawer-backdrop');
      if (show) {
        backdrop.classList.remove('hidden');
        drawer.classList.remove('drawer-closed');
        drawer.classList.add('drawer-open');
      } else {
        backdrop.classList.add('hidden');
        drawer.classList.remove('drawer-open');
        drawer.classList.add('drawer-closed');
      }
    }

    async function renderThumbnailsDrawer() {
      const container = document.getElementById('thumbnails-container');
      container.innerHTML = '';

      for (let i = 1; i <= state.totalPages; i++) {
        const wrapper = document.createElement('div');
        wrapper.className = `p-2 rounded-xl flex flex-col gap-2 transition-colors cursor-pointer border ${i === state.currentPage ? 'bg-blue-500/10 border-blue-500/50' : 'bg-white/[0.02] border-matte-border hover:bg-white/[0.05]'}`;
        
        wrapper.onclick = async () => {
          state.currentPage = i;
          await renderCurrentPage();
          centerDocument();
          toggleDrawer(false); 
          renderThumbnailsDrawer();
        };

        wrapper.innerHTML = `
          <div class="flex items-center justify-between text-zinc-400">
            <span class="text-xs font-bold text-white">Página ${i}</span>
            <div class="flex items-center gap-2">
              <button onclick="event.stopPropagation(); deletePage(${i})" class="hover:text-red-400 p-1" title="Excluir"><i class="ph-bold ph-trash"></i></button>
            </div>
          </div>
          <div class="w-full aspect-[1/1.4] bg-white rounded flex items-center justify-center text-zinc-300 font-bold text-lg pointer-events-none shadow-inner">
            ${i}
          </div>
        `;
        container.appendChild(wrapper);
      }
    }

    async function deletePage(pageNum) {
      if (state.totalPages <= 1) {
        alert("O PDF precisa ter pelo menos 1 página.");
        return;
      }
      if (!confirm(`Remover página ${pageNum}?`)) return;

      state.pdfDocLib.removePage(pageNum - 1);
      
      for (let i = pageNum; i < state.totalPages; i++) {
        state.edits[i] = state.edits[i+1];
      }
      delete state.edits[state.totalPages];

      const newBytes = await state.pdfDocLib.save();
      state.pdfJsDoc = await pdfjsLib.getDocument({ data: newBytes.slice(0) }).promise;
      state.totalPages = state.pdfJsDoc.numPages;

      if (state.currentPage > state.totalPages) state.currentPage = state.totalPages;

      renderThumbnailsDrawer();
      await renderCurrentPage();
    }

    // ==== EXPORTAÇÃO FINAL (QUEIMANDO DESENHOS E TEXTOS NO PDF) ====
    async function exportFinalPDF() {
      if (!state.pdfDocLib) return;
      document.getElementById('sync-status').innerText = "Gerando PDF...";
      document.getElementById('sync-status').classList.remove('hidden');

      try {
        for (let i = 1; i <= state.totalPages; i++) {
          const edits = state.edits[i];
          if (!edits || (edits.paths.length === 0 && edits.texts.length === 0)) continue;

          const page = state.pdfDocLib.getPage(i - 1);
          const { width, height } = page.getSize();

          if (edits.paths.length > 0) {
            const offCanvas = document.createElement('canvas');
            offCanvas.width = width * 2;
            offCanvas.height = height * 2;
            const offCtx = offCanvas.getContext('2d');

            const pdfJsPage = await state.pdfJsDoc.getPage(i);
            const viewScale = (width * 2) / (pdfLayer.width / 2);

            edits.paths.forEach(path => {
              if (path.length < 2) return;
              offCtx.beginPath();
              offCtx.strokeStyle = path[0].c;
              offCtx.lineWidth = 3 * viewScale; 
              offCtx.lineCap = 'round';
              offCtx.moveTo(path[0].x * 2 * viewScale, path[0].y * 2 * viewScale);
              for (let p = 1; p < path.length; p++) {
                offCtx.lineTo(path[p].x * 2 * viewScale, path[p].y * 2 * viewScale);
              }
              offCtx.stroke();
            });

            const pngDataUrl = offCanvas.toDataURL('image/png');
            const pngImage = await state.pdfDocLib.embedPng(pngDataUrl);
            page.drawImage(pngImage, { x: 0, y: 0, width: width, height: height });
          }

          if (edits.texts.length > 0) {
            const font = await state.pdfDocLib.embedFont(PDFLib.StandardFonts.Helvetica);
            edits.texts.forEach(async txt => {
              const viewport = (await state.pdfJsDoc.getPage(i)).getViewport({ scale: 1 });
              const scaleX = width / viewport.width;
              const scaleY = height / viewport.height;

              const r = parseInt(txt.color.substr(1,2), 16) / 255;
              const g = parseInt(txt.color.substr(3,2), 16) / 255;
              const b = parseInt(txt.color.substr(5,2), 16) / 255;

              page.drawText(txt.text, {
                x: txt.x * scaleX,
                y: height - (txt.y * scaleY) - 12,
                size: 14,
                font: font,
                color: PDFLib.rgb(r, g, b),
                lineHeight: 16
              });
            });
          }
        }

        const finalBytes = await state.pdfDocLib.save();
        const blob = new Blob([finalBytes], { type: 'application/pdf' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `Editado_${state.filename}`;
        link.click();

        document.getElementById('sync-status').innerText = "Pronto";
      } catch (err) {
        alert("Erro ao exportar o PDF.");
        console.error(err);
        document.getElementById('sync-status').innerText = "Erro";
      }
    }

    initEditor();
  </script>
